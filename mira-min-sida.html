<!--
  mira-min-sida.html — Min sida (User-profil), render-omtag av Bubble-popupen PopupMyPage.
  Ersätter den input-bindnings-trasiga popupen på dashboard_crm med ett render-block.
  Speglad skrivning: en "Spara" patchar BÅDE Current User OCH kopplad Coworker.
  Backend (companies_api.js):
    GET   /admin/companies/mypage/:userId            — profil (user+coworker+consent)
    PATCH /admin/companies/mypage/:userId            — speglad skrivning {fields:{first,last,title,phone}}
    POST  /admin/companies/mypage/:userId/consent    — godkänn användarvillkor {agree:true}
    POST  /admin/companies/coworker/:cid/photo       — profilbild (återanvänd, LIVE)
  data-mira: api_host + planning_token + current_user (User-id). Konventioner: INGEN ?./??,
  IIFE, BROOT-claim, .ms-namnrymd.
  ⚠️ email är LÄS-ONLY: Bubbles auth-login (auth ägs av Bubble) + join-nyckel mot Coworker.
  ⚠️ Microsoft-integrationen byggs om separat senare — placeholder här, ingen logik.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap');
  .ms, .ms *{box-sizing:border-box;margin:0;padding:0;}
  .ms{
    --base:#1e2235;--panel:#23283f;--card:#262b42;--deep:#2c314e;--input:#2e3350;
    --orange:#F47B30;--orange-dim:rgba(244,123,48,.13);
    --white:#fff;--w70:rgba(255,255,255,.70);--w40:rgba(255,255,255,.40);--w10:rgba(255,255,255,.07);
    --green:#4CAF7D;--red:#E05A5A;--border:rgba(255,255,255,.07);
    --fb:Arial,sans-serif;background:var(--base);color:var(--white);font-family:var(--fb);font-size:13px;line-height:1.5;
    display:block;padding:22px 26px 40px;border-radius:14px;}
  .ms input[type=hidden]{display:none;}
  .ms-head{margin:0 0 20px;}
  .ms-head h1{font-family:'DM Serif Display',Georgia,serif;font-size:26px;font-weight:400;}
  .ms-head h1 span{color:var(--orange);}
  .ms-head .sub{color:var(--w40);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .ms-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;}
  .ms-tab{background:var(--input);border:1px solid var(--border);border-radius:20px;padding:7px 15px;font-size:12px;color:var(--w70);cursor:pointer;font-family:var(--fb);}
  .ms-tab.on{background:var(--orange);border-color:var(--orange);color:#1c1206;font-weight:700;}
  .ms-panel{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:16px 18px;}
  .ms-panel + .ms-panel{margin-top:14px;}
  .ms-panel.form{border-left:2px solid var(--orange);}
  .ms-wrap{max-width:760px;}
  .ms-sech{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--w40);font-weight:700;margin:0 0 13px;}
  .ms-grid{display:flex;flex-wrap:wrap;gap:14px;}
  .ms-fld{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;}
  .ms-fld.full{flex-basis:100%;min-width:100%;}
  .ms-fld label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--w40);font-weight:700;}
  .ms-fld input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--white);font-family:var(--fb);font-size:13px;}
  .ms-fld input:focus{outline:none;border-color:var(--orange);}
  .ms-fld input[readonly]{opacity:.55;cursor:not-allowed;}
  .ms-hint{font-size:11px;color:var(--w40);margin-top:3px;line-height:1.45;}
  .ms-actions{display:flex;align-items:center;gap:14px;border-top:1px solid var(--border);padding-top:13px;margin-top:16px;}
  .ms-btn{background:var(--orange);border:none;border-radius:8px;padding:8px 22px;color:#1c1206;font-weight:800;font-size:12.5px;cursor:pointer;font-family:var(--fb);transition:filter .12s;}
  .ms-btn:hover{filter:brightness(1.07);}
  .ms-btn[disabled]{opacity:.5;cursor:default;filter:none;}
  .ms-btn.ghost{background:var(--input);border:1px solid var(--border);color:var(--w70);font-weight:700;transition:border-color .12s,color .12s;}
  .ms-btn.ghost:hover{filter:none;border-color:var(--orange);color:var(--orange);}
  .ms-msg{font-size:12px;color:var(--w40);}
  .ms-msg.ok{color:var(--green);}
  .ms-msg.err{color:#ff8080;}
  .ms-warn{background:rgba(224,90,90,.12);border:1px solid rgba(224,90,90,.35);border-radius:10px;padding:11px 14px;font-size:12px;color:#e0a060;margin:0 0 14px;line-height:1.5;}
  .ms-photo{display:flex;align-items:center;gap:16px;}
  .ms-avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;background:var(--deep);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--w40);}
  .ms-photo-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .ms-msg-block{margin-top:10px;}
  .ms-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
  .ms-pill .d{width:6px;height:6px;border-radius:50%;background:var(--w40);}
  .ms-pill.ok{background:rgba(76,175,125,.13);color:var(--green);}
  .ms-pill.ok .d{background:var(--green);}
  .ms-pill.no{background:rgba(224,90,90,.13);color:var(--red);}
  .ms-pill.no .d{background:var(--red);}
  .ms-check{display:flex;align-items:flex-start;gap:9px;margin:16px 0;font-size:13px;color:var(--white);cursor:pointer;line-height:1.5;}
  .ms-check input{margin-top:2px;width:16px;height:16px;flex-shrink:0;cursor:pointer;accent-color:var(--orange);}
  .ms-link{color:var(--orange);text-decoration:underline;}
  /* Inbäddade användarvillkor (scrollbar panel, samma designspråk) */
  .ms-terms{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:14px 0 4px;max-height:360px;overflow-y:auto;}
  .ms-terms .tinner{padding:16px 18px;}
  .ms-terms .tmeta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;}
  .ms-terms .tchip{display:inline-flex;align-items:center;gap:6px;background:var(--input);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:11px;color:var(--w40);}
  .ms-terms .tchip b{color:var(--white);font-weight:700;}
  .ms-terms .tlead{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--orange);border-radius:9px;padding:13px 15px;color:var(--w70);font-size:12.5px;line-height:1.55;margin:0 0 14px;}
  .ms-terms .tlead b{color:var(--white);}
  .ms-terms .tsec{margin:0 0 16px;}
  .ms-terms .tsec:last-child{margin-bottom:0;}
  .ms-terms h4{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:15px;line-height:1.25;color:var(--white);margin:0 0 9px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
  .ms-terms h4 .tn{font-family:var(--fb);font-size:10px;font-weight:700;color:var(--orange);background:var(--orange-dim);border:1px solid rgba(244,123,48,.35);border-radius:5px;padding:2px 7px;min-width:24px;text-align:center;}
  .ms-terms p{font-size:12.5px;color:var(--w70);line-height:1.55;margin:0 0 8px;}
  .ms-terms p:last-child{margin-bottom:0;}
  .ms-terms .cl{display:grid;grid-template-columns:34px 1fr;gap:4px;margin:0 0 9px;}
  .ms-terms .cl:last-child{margin-bottom:0;}
  .ms-terms .cl .id{font-size:11px;font-weight:700;color:var(--w40);padding-top:2px;}
  .ms-terms ul{margin:6px 0 0;padding-left:16px;display:grid;gap:5px;}
  .ms-terms li{font-size:12.5px;color:var(--w70);line-height:1.5;}
  .ms-terms li::marker{color:var(--orange);}
  .ms-terms b{color:var(--white);}
  .ms-terms .tcard{background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
  .ms-terms .tcard .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--w40);margin:0 0 8px;}
  .ms-terms .fill{display:inline-block;background:var(--orange-dim);color:var(--orange);border:1px dashed rgba(244,123,48,.35);border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;}
  .ms-terms a{color:var(--orange);}
  .ms-termshead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .ms-soon{opacity:.55;}
  .ms-loading{padding:26px;text-align:center;color:var(--w40);}
  @media(max-width:560px){ .ms-fld{min-width:100%;} }
</style>

<div class="ms">
  <input type="hidden" data-mira="api_host"       value="https://mira-exchange.onrender.com">
  <input type="hidden" data-mira="planning_token" value="SÄTT_SAMMA_SOM_PLANNING_ADMIN_TOKEN">
  <input type="hidden" data-mira="current_user"   value=""><!-- bind till Current User's unique id -->
  <input type="hidden" data-mira="terms_url"      value=""><!-- URL till användarvillkoren (t.ex. https://mira-fm.com/villkor) -->
  <div data-ms="root"><div class="ms-loading">Laddar…</div></div>
</div>

<script>
(function(){
  "use strict";
  var all=document.querySelectorAll(".ms"),root=null;
  for(var i=0;i<all.length;i++){ if(!all[i].getAttribute("data-ms-claimed")){ root=all[i]; break; } }
  if(!root) return; root.setAttribute("data-ms-claimed","1");
  var $=function(k){ return root.querySelector('[data-ms="'+k+'"]'); };
  var cfg=function(k){ var el=root.querySelector('[data-mira="'+k+'"]'); return (el&&el.value)||""; };
  var HOST=cfg("api_host").replace(/\/+$/,""), TOKEN=cfg("planning_token"), UID=cfg("current_user").trim();
  var TERMS_URL=cfg("terms_url").trim();
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function api(path){ return fetch(HOST+path,{headers:{"x-admin-token":TOKEN}}).then(function(r){ return r.json(); }); }
  function post(path,bodyObj){ return fetch(HOST+path,{method:"POST",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(bodyObj)}).then(function(r){ return r.json(); }); }
  function patch(path,bodyObj){ return fetch(HOST+path,{method:"PATCH",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(bodyObj)}).then(function(r){ return r.json(); }); }

  var STATE={ tab:"profil", loading:true, err:"", data:null, agree:false };

  function initials(u){
    var f=(u&&u.first)?u.first.charAt(0):"", l=(u&&u.last)?u.last.charAt(0):"";
    return (f+l).toUpperCase()||"?";
  }

  function profileHtml(){
    var d=STATE.data, u=(d&&d.user)||{}, co=d&&d.coworker;
    var linked=d&&d.coworker_linked;
    var warn=linked?"":'<div class="ms-warn">Ingen kopplad medarbetare (Coworker) hittades på din e-post. '+
      'Namn, titel och telefon sparas då bara på ditt användarkonto, och profilbild går inte att sätta '+
      'förrän en Coworker med samma e-post finns.</div>';
    var fotoUrl=(co&&co.foto)||"";
    var avatar=fotoUrl?('<img class="ms-avatar" src="'+esc(fotoUrl)+'" alt="">'):('<div class="ms-avatar">'+esc(initials(u))+'</div>');
    var photoBtns=linked?
      ('<div class="ms-photo-btns">'+
        '<button class="ms-btn ghost" data-ms="photo-pick">'+(fotoUrl?"Byt bild":"Ladda upp")+'</button>'+
        (fotoUrl?'<button class="ms-btn ghost" data-ms="photo-clear">Ta bort</button>':'')+
        '<input type="file" accept="image/*" data-ms="photo-file" style="display:none">'+
      '</div>')
      :'<div class="ms-hint">Profilbild kräver en kopplad medarbetare.</div>';
    return '<div class="ms-wrap">'+warn+
      '<div class="ms-panel">'+
        '<div class="ms-sech">Profilbild</div>'+
        '<div class="ms-photo">'+avatar+photoBtns+'</div>'+
        '<div class="ms-msg-block"><span class="ms-msg" data-ms="photomsg"></span></div>'+
      '</div>'+
      '<div class="ms-panel form">'+
        '<div class="ms-sech">Mina uppgifter</div>'+
        '<div class="ms-grid">'+
          fld("first","Förnamn",u.first,"text")+
          fld("last","Efternamn",u.last,"text")+
          fld("title","Titel",u.title,"text")+
          fld("phone","Telefon",u.phone,"tel")+
          '<div class="ms-fld full"><label>E-post (inloggning)</label>'+
            '<input type="email" value="'+esc(u.email)+'" readonly>'+
            '<div class="ms-hint">Din inloggningsmail ändras inte här — kontakta admin om den behöver bytas.</div>'+
          '</div>'+
        '</div>'+
        '<div class="ms-actions">'+
          '<button class="ms-btn" data-ms="save">Spara</button>'+
          '<span class="ms-msg" data-ms="savemsg"></span>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  function fld(k,label,val,type){
    return '<div class="ms-fld"><label>'+esc(label)+'</label>'+
      '<input type="'+type+'" data-ms="f-'+k+'" value="'+esc(val)+'"></div>';
  }

  // Användarvillkoren inbäddade (v1.0, från mira-anvandarvillkor-mira-fm.html) — statisk,
  // betrodd text. ⚠️ Uppdatera denna funktion när villkoren revideras (och bumpa versionen).
  function termsHtml(){
    var cl=function(id,html){ return '<div class="cl"><div class="id">'+id+'</div><div>'+html+'</div></div>'; };
    var sec=function(n,title,inner){ return '<div class="tsec"><h4><span class="tn">'+n+'</span>'+title+'</h4>'+inner+'</div>'; };
    return '<div class="ms-terms"><div class="tinner">'+
      '<div class="tmeta">'+
        '<span class="tchip">Version <b>1.0 – utkast</b></span>'+
        '<span class="tchip">Gäller från <b>ÅÅÅÅ-MM-DD</b></span>'+
        '<span class="tchip">Leverantör <b>Carotte Group AB</b></span>'+
      '</div>'+
      '<div class="tlead"><p>Mira FM tillhandahålls av <b>Carotte Group AB</b>, org.nr 556305–1068, Tegeluddsvägen 92, 115 28 Stockholm ("Carotte", "vi").</p>'+
        '<p>Du har fått tillgång till Mira FM genom din arbetsgivare eller uppdragsgivare ("Kunden"), som har ett avtal med Carotte om tjänsten ("Kundavtalet"). Dessa användarvillkor ("Villkoren") gäller mellan dig som användare och Carotte. Genom att logga in och använda Mira FM godkänner du Villkoren.</p></div>'+
      sec("1","Hur villkoren hänger ihop",
        cl("1.1","<p>Kundavtalet reglerar förhållandet mellan Carotte och Kunden: abonnemang, priser, tillgänglighet, personuppgiftsbehandling och avtalstid.</p>")+
        cl("1.2","<p>Villkoren reglerar din personliga användning av tjänsten. De ger dig inga rättigheter utöver dem Kunden har enligt Kundavtalet.</p>")+
        cl("1.3","<p>Om Villkoren och Kundavtalet säger olika saker gäller Kundavtalet.</p>"))+
      sec("2","Ditt konto",
        cl("2.1","<p>Kontot skapas av Kunden, eller av Carotte på Kundens begäran. Kontot är personligt och får inte delas eller överlåtas.</p>")+
        cl("2.2","<p>Du ansvarar för att hålla dina inloggningsuppgifter hemliga och för allt som sker via ditt konto. Misstänker du obehörig åtkomst ska du omgående meddela Kunden och Carotte på <span class=\"fill\">support@mira-fm.com</span>.</p>")+
        cl("2.3","<p>Kunden bestämmer vilken behörighet du har och kan när som helst ändra, begränsa eller avsluta ditt konto.</p>")+
        cl("2.4","<p>Mira FM är ett verktyg för arbetslivet. Du ska vara minst 18 år och använda tjänsten inom ramen för din anställning eller ditt uppdrag hos Kunden.</p>"))+
      sec("3","Så får du använda Mira",
        cl("3.1","<p>Du får använda Mira FM för Kundens verksamhet, i enlighet med Villkoren, gällande lag och Kundens egna interna regler.</p>")+
        cl("3.2","<p>Du får inte:</p><ul>"+
          "<li>ge någon utanför Kundens organisation tillgång till tjänsten,</li>"+
          "<li>kopiera, dekompilera, reverse-engineera eller kringgå säkerhetsfunktioner,</li>"+
          "<li>samla in data automatiserat (skrapa, botar) eller belasta tjänsten onormalt,</li>"+
          "<li>ladda upp skadlig kod, olagligt eller kränkande material,</li>"+
          "<li>lagra känsliga personuppgifter – till exempel uppgifter om hälsa, religion eller fackligt medlemskap – utan att detta särskilt har avtalats mellan Kunden och Carotte.</li>"+
          "</ul>"))+
      sec("4","Bokningar och beställningar",
        cl("4.1","<p>När du bokar eller beställer i Mira FM – till exempel fika, lunch, lokalvård, bemanning eller event – gör du det för Kundens räkning. Beställningen kan binda Kunden ekonomiskt. Se därför till att du har behörighet att beställa.</p>")+
        cl("4.2","<p>En beställning är bindande när den bekräftats i tjänsten.</p>")+
        cl("4.3","<p>Ledtider, avbokningsregler och priser för de tjänster du beställer framgår av respektive tjänstebeskrivning i Mira FM och av Kundavtalet.</p>")+
        cl("4.4","<p>Du betalar aldrig själv. All fakturering sker till Kunden.</p>"))+
      sec("5","Innehåll och data",
        cl("5.1","<p>Information som läggs in i Mira FM tillhör Kunden, inte dig personligen.</p>")+
        cl("5.2","<p>Kunden kan ta del av, exportera och radera innehåll i tjänsten. Utgå därför inte från att det du skriver i Mira FM är privat.</p>")+
        cl("5.3","<p>Carotte får använda anonymiserad och aggregerad statistik om hur tjänsten används för att utveckla och förbättra den.</p>"))+
      sec("6","Personuppgifter",
        cl("6.1","<p>Kunden är personuppgiftsansvarig för de personuppgifter som behandlas i Mira FM. Carotte är personuppgiftsbiträde och behandlar uppgifterna på Kundens instruktion, enligt det personuppgiftsbiträdesavtal som ingår i Kundavtalet.</p>")+
        cl("6.2","<p>Vill du veta vilka uppgifter som behandlas om dig, eller vill få dem rättade eller raderade, vänder du dig till Kunden – normalt din HR- eller dataskyddsfunktion.</p>")+
        cl("6.3","<p>För uppgifter som Carotte samlar in på egen hand via mira-fm.com, till exempel kontaktformulär, nyhetsbrev och cookies, är Carotte själv personuppgiftsansvarig. Läs mer i vår <a href=\"https://mira-fm.com/privacy_policy\" target=\"_blank\" rel=\"noopener\">integritetspolicy</a>.</p>")+
        cl("6.4","<p>Tjänsten drivs på infrastruktur från Bubble.io och Amazon Web Services. Data lagras i EU/EES där det är möjligt; vid överföring till tredje land används EU-kommissionens standardavtalsklausuler.</p>"))+
      sec("7","Förslag och feedback",
        "<p>Tipsar du oss om buggar, idéer eller förbättringar får Carotte fritt använda dessa i sin produktutveckling, utan ersättning och utan begränsning i tid.</p>")+
      sec("8","Tillgänglighet och utveckling",
        cl("8.1","<p>Vi arbetar för hög tillgänglighet, men lämnar ingen garanti om drifttid gentemot dig som användare. Någon servicenivå (SLA) gäller inte om det inte särskilt har avtalats med Kunden.</p>")+
        cl("8.2","<p>Mira FM är webbaserad och fungerar bäst i aktuella versioner av Chrome, Edge och Safari.</p>")+
        cl("8.3","<p>Mira FM utvecklas löpande. Funktioner kan komma att ändras, läggas till eller tas bort. Planerade driftstopp aviseras i förväg när det är möjligt.</p>")+
        cl("8.4","<p>Vilka funktioner du ser beror på Kundens abonnemang och din behörighet.</p>"))+
      sec("9","Rättigheter till tjänsten",
        "<p>Mira FM med källkod, design, varumärken och innehåll tillhör Carotte och dess licensgivare. Du får en personlig, begränsad och icke-överlåtbar rätt att använda tjänsten så länge Kundavtalet gäller och ditt konto är aktivt. Ingen annan rätt överlåts.</p>")+
      sec("10","Avstängning",
        "<p>Carotte får omedelbart begränsa eller stänga av din åtkomst om vi har skälig anledning att tro att Villkoren har överträtts, om användningen innebär en säkerhets- eller driftrisk, eller om Kundavtalet upphör eller åtkomsten stängs på grund av utebliven betalning. Vi informerar Kunden om åtgärden.</p>")+
      sec("11","Ansvar",
        cl("11.1","<p>Tjänsten tillhandahålls i befintligt skick. Vi kan inte garantera att den alltid är fri från fel eller avbrott.</p>")+
        cl("11.2","<p>Eventuella krav med anledning av tjänsten regleras mellan Carotte och Kunden enligt Kundavtalet, som också innehåller ansvarsbegränsningar. Carotte har inget ansvar gentemot dig personligen för indirekt skada, till exempel utebliven vinst, dataförlust eller produktionsbortfall.</p>")+
        cl("11.3","<p>Begränsningarna gäller inte vid uppsåt eller grov vårdslöshet, eller där ansvar inte kan begränsas enligt tvingande lag.</p>"))+
      sec("12","När åtkomsten upphör",
        "<p>Upphör Kundavtalet eller avslutas ditt konto förlorar du tillgången till Mira FM. Hanteringen av Kundens data – radering eller återlämnande – sker enligt Kundavtalet. Carotte har ingen skyldighet att bevara data längre än trettio (30) dagar efter att Kundavtalet upphört, om inte lag kräver annat.</p>")+
      sec("13","Ändringar av villkoren",
        "<p>Vi kan uppdatera Villkoren, till exempel när tjänsten utvecklas eller när lagkrav ändras. Väsentliga ändringar meddelas minst trettio (30) dagar i förväg i tjänsten eller via e-post. Fortsatt användning efter att ändringen trätt i kraft innebär att du godkänner den nya versionen. Gällande version finns alltid på mira-fm.com.</p>")+
      sec("14","Tillämplig lag och tvist",
        cl("14.1","<p>Svensk rätt gäller för Villkoren.</p>")+
        cl("14.2","<p>Tvist mellan dig och Carotte prövas av allmän domstol, med Stockholms tingsrätt som första instans. Tvister mellan Carotte och Kunden avgörs genom skiljeförfarande enligt Kundavtalet.</p>"))+
      sec("15","Kontakt",
        '<div class="tcard"><p class="lbl">Carotte Group AB</p><p>Org.nr 556305–1068<br>Tegeluddsvägen 92, 115 28 Stockholm<br>E-post: <span class="fill">support@mira-fm.com</span> · Webb: mira-fm.com</p></div>')+
    '</div></div>';
  }

  function consentHtml(){
    var d=STATE.data, c=(d&&d.consent)||{};
    var status=c.godkant
      ? '<span class="ms-pill ok"><span class="d"></span>Godkänt</span>'+(c.date?'<div class="ms-hint" style="margin-top:8px;">Godkänt '+esc(c.date)+'.</div>':'')
      : '<span class="ms-pill no"><span class="d"></span>Ej godkänt</span>';
    var body=c.godkant
      ? '<div class="ms-hint" style="margin-top:12px;">Du har godkänt användarvillkoren. Vill du godkänna en ny version, bocka i rutan nedan och godkänn på nytt.</div>'
      : '';
    var openLink=TERMS_URL?('<a class="ms-link" data-ms="terms" href="'+esc(TERMS_URL)+'" target="_blank" rel="noopener">Öppna i egen flik ↗</a>'):'';
    return '<div class="ms-wrap"><div class="ms-panel form">'+
      '<div class="ms-termshead"><div class="ms-sech" style="margin:0;">Användarvillkor</div>'+openLink+'</div>'+
      '<div style="margin-top:12px;">'+status+body+'</div>'+
      termsHtml()+
      '<label class="ms-check"><input type="checkbox" data-ms="agree"'+(STATE.agree?" checked":"")+'>'+
        '<span>Jag har läst och godkänner användarvillkoren för Mira ovan.</span></label>'+
      '<div class="ms-actions">'+
        '<button class="ms-btn" data-ms="consent-save"'+(STATE.agree?"":" disabled")+'>Godkänn</button>'+
        '<span class="ms-msg" data-ms="consentmsg"></span>'+
      '</div>'+
    '</div>'+
    '<div class="ms-panel ms-soon" style="margin-top:14px;">'+
      '<div class="ms-sech">Microsoft-koppling</div>'+
      '<div class="ms-hint">Kalenderkopplingen mot Outlook byggs om separat och är inte aktiv i den här vyn ännu.</div>'+
    '</div></div>';
  }

  function tabsHtml(){
    var t=[["profil","Mina uppgifter"],["consent","Användarvillkor"]];
    var h=""; for(var i=0;i<t.length;i++){ h+='<span class="ms-tab'+(STATE.tab===t[i][0]?" on":"")+'" data-ms="tab" data-t="'+t[i][0]+'">'+esc(t[i][1])+'</span>'; }
    return '<div class="ms-tabs">'+h+'</div>';
  }

  function render(){
    if(STATE.loading){ $("root").innerHTML='<div class="ms-loading">Laddar…</div>'; return; }
    if(STATE.err){ $("root").innerHTML='<div class="ms-panel"><div class="ms-msg err">'+esc(STATE.err)+'</div></div>'; return; }
    var nm=((STATE.data&&STATE.data.user&&(STATE.data.user.first+" "+STATE.data.user.last).trim())||"");
    var head='<div class="ms-head"><h1>Min <span>sida</span></h1><div class="sub">'+(nm?esc(nm):"Användarprofil")+'</div></div>';
    $("root").innerHTML=head+tabsHtml()+(STATE.tab==="consent"?consentHtml():profileHtml());
  }

  function load(){
    STATE.loading=true; render();
    if(!UID){ STATE.loading=false; STATE.err="Ingen användare kopplad (bind Current User's unique id i data-mira current_user)."; render(); return; }
    api("/admin/companies/mypage/"+encodeURIComponent(UID)).then(function(j){
      STATE.loading=false;
      if(j&&j.ok){ STATE.data=j; STATE.agree=false; }
      else { STATE.err=(j&&j.error)||"Kunde inte ladda profilen."; }
      render();
    }).catch(function(){ STATE.loading=false; STATE.err="Nätverksfel vid laddning."; render(); });
  }

  function saveProfile(){
    var msg=$("savemsg"), btn=$("save");
    var fields={
      first:(root.querySelector('[data-ms="f-first"]')||{}).value||"",
      last: (root.querySelector('[data-ms="f-last"]') ||{}).value||"",
      title:(root.querySelector('[data-ms="f-title"]')||{}).value||"",
      phone:(root.querySelector('[data-ms="f-phone"]')||{}).value||""
    };
    if(msg){ msg.textContent="Sparar…"; msg.className="ms-msg"; }
    if(btn) btn.disabled=true;
    patch("/admin/companies/mypage/"+encodeURIComponent(UID),{fields:fields}).then(function(j){
      if(btn) btn.disabled=false;
      if(!j||!j.ok){ if(msg){ msg.textContent="✗ "+((j&&j.error)||"kunde inte spara"); msg.className="ms-msg err"; } return; }
      // Läs tillbaka från servern (vy-cache: visa serverns sanning, inte formulärets).
      api("/admin/companies/mypage/"+encodeURIComponent(UID)).then(function(f){
        if(f&&f.ok){ STATE.data=f; render(); var m2=$("savemsg"); if(m2){ m2.textContent=j.coworker_linked?"✓ Sparat":"✓ Sparat (ingen kopplad medarbetare att spegla till)"; m2.className="ms-msg ok"; } }
      });
    }).catch(function(){ if(btn) btn.disabled=false; if(msg){ msg.textContent="✗ nätverksfel"; msg.className="ms-msg err"; } });
  }

  function compressImage(file, cb){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=512, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(function(blob){ cb(blob||file); }, "image/jpeg", 0.82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(file); };
    img.src=url;
  }
  function uploadPhoto(file){
    var d=STATE.data, co=d&&d.coworker, msg=$("photomsg");
    if(!co||!co.id){ if(msg){ msg.textContent="✗ ingen kopplad medarbetare"; msg.className="ms-msg err"; } return; }
    if(msg){ msg.textContent="Laddar upp…"; msg.className="ms-msg"; }
    compressImage(file, function(blob){
      var fd=new FormData(); fd.append("file", blob, "profil.jpg");
      fetch(HOST+"/admin/companies/coworker/"+encodeURIComponent(co.id)+"/photo",{method:"POST",headers:{"x-admin-token":TOKEN},body:fd})
        .then(function(r){ return r.json(); }).then(function(j){
          if(!j||!j.ok){ if(msg){ msg.textContent="✗ "+((j&&j.error)||"kunde inte ladda upp"); msg.className="ms-msg err"; } return; }
          STATE.data.coworker.foto=j.url||""; render(); var m2=$("photomsg"); if(m2){ m2.textContent="✓ Uppdaterad"; m2.className="ms-msg ok"; }
        }).catch(function(){ if(msg){ msg.textContent="✗ nätverksfel"; msg.className="ms-msg err"; } });
    });
  }
  function clearPhoto(){
    var d=STATE.data, co=d&&d.coworker, msg=$("photomsg");
    if(!co||!co.id) return;
    if(msg){ msg.textContent="Tar bort…"; msg.className="ms-msg"; }
    var fd=new FormData(); fd.append("clear","1");
    fetch(HOST+"/admin/companies/coworker/"+encodeURIComponent(co.id)+"/photo",{method:"POST",headers:{"x-admin-token":TOKEN},body:fd})
      .then(function(r){ return r.json(); }).then(function(j){
        if(!j||!j.ok){ if(msg){ msg.textContent="✗ "+((j&&j.error)||"kunde inte ta bort"); msg.className="ms-msg err"; } return; }
        STATE.data.coworker.foto=""; render(); var m2=$("photomsg"); if(m2){ m2.textContent="✓ Borttagen"; m2.className="ms-msg ok"; }
      }).catch(function(){ if(msg){ msg.textContent="✗ nätverksfel"; msg.className="ms-msg err"; } });
  }

  function saveConsent(){
    var msg=$("consentmsg"), btn=$("consent-save");
    if(!STATE.agree){ if(msg){ msg.textContent="Bocka i rutan först"; msg.className="ms-msg err"; } return; }
    if(msg){ msg.textContent="Sparar…"; msg.className="ms-msg"; }
    if(btn) btn.disabled=true;
    post("/admin/companies/mypage/"+encodeURIComponent(UID)+"/consent",{agree:true}).then(function(j){
      if(!j||!j.ok){ if(btn) btn.disabled=false; if(msg){ msg.textContent="✗ "+((j&&j.error)||"kunde inte spara"); msg.className="ms-msg err"; } return; }
      api("/admin/companies/mypage/"+encodeURIComponent(UID)).then(function(f){
        if(f&&f.ok){ STATE.data=f; STATE.agree=false; render(); var m2=$("consentmsg"); if(m2){ m2.textContent="✓ Godkänt"; m2.className="ms-msg ok"; } }
      });
    }).catch(function(){ if(btn) btn.disabled=false; if(msg){ msg.textContent="✗ nätverksfel"; msg.className="ms-msg err"; } });
  }

  root.addEventListener("click", function(e){
    var t=e.target;
    var tab=t.closest?t.closest('[data-ms="tab"]'):null;
    if(tab){ STATE.tab=tab.getAttribute("data-t"); render(); return; }
    if(t.closest && t.closest('[data-ms="save"]')){ saveProfile(); return; }
    if(t.closest && t.closest('[data-ms="photo-pick"]')){ var fi=root.querySelector('[data-ms="photo-file"]'); if(fi) fi.click(); return; }
    if(t.closest && t.closest('[data-ms="photo-clear"]')){ clearPhoto(); return; }
    if(t.closest && t.closest('[data-ms="consent-save"]')){ saveConsent(); return; }
    if(t.closest && t.closest('[data-ms="terms"]')){ if(!TERMS_URL) e.preventDefault(); return; }
  });
  root.addEventListener("change", function(e){
    var t=e.target, k=t.getAttribute?t.getAttribute("data-ms"):null;
    if(k==="photo-file"){ if(t.files&&t.files[0]) uploadPhoto(t.files[0]); t.value=""; return; }
    if(k==="agree"){ STATE.agree=!!t.checked; var b=$("consent-save"); if(b) b.disabled=!STATE.agree; return; }
  });

  load();
})();
</script>
