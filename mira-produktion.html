<!--
  MIRA — Produktion: dagsvy per kök (Fas 1). Läser /admin/produktion/dag?date=
  → aggregerad prep-lista per kök + per-order-rader, med kök-fördelning.
  Design: OFFERT_PRODUKTION_HANDOFF.md §5. Fristående HTML-block (.mp-namnrymd).

  KOPPLING I BUBBLE:
    data-mira="api_host"        = https://mira-exchange.onrender.com
    data-mira="planning_token"  = PLANNING_ADMIN_TOKEN
  OBS: INGEN ?. eller ?? (Bubbles script-parser). IIFE, BROOT-scopat.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap');
  .mp, .mp *{box-sizing:border-box;margin:0;padding:0}
  .mp{
    --base:#1e2235;--panel:#23283f;--card:#262b42;--deep:#2c314e;--input:#2e3350;
    --orange:#F47B30;--orange-dim:rgba(244,123,48,.13);
    --white:#fff;--w70:rgba(255,255,255,.70);--w40:rgba(255,255,255,.40);--w10:rgba(255,255,255,.07);
    --green:#4CAF7D;--red:#E05A5A;--blue:#5B8DEF;--purple:#9B7DEF;--border:rgba(255,255,255,.07);
    --fb:Arial,sans-serif;background:var(--base);color:var(--white);font-family:var(--fb);font-size:13px;line-height:1.5;
    display:block;padding:22px 26px 40px;border-radius:14px}
  .mp input[type=hidden]{display:none}
  .mp h1{font-family:'DM Serif Display',Georgia,serif;font-size:26px}.mp h1 span{color:var(--orange)}
  .mp .sub{color:var(--w40);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:2px 0 20px}
  .mp .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .mp .datein{background:var(--input);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--white);font-family:var(--fb);font-size:13px;color-scheme:dark}
  .mp .datein:focus{outline:none;border-color:var(--orange)}
  .mp .navbtn{background:var(--input);border:1px solid var(--border);border-radius:9px;padding:9px 14px;color:var(--w70);cursor:pointer;font-family:var(--fb);font-size:13px}
  .mp .navbtn:hover{border-color:var(--orange);color:var(--orange)}
  .mp .summary{color:var(--w40);font-size:12px;margin-left:auto}
  .mp .kok{background:var(--panel);border:1px solid var(--border);border-radius:13px;margin-bottom:14px;overflow:hidden}
  .mp .kok.none{border-color:rgba(224,90,90,.4)}
  .mp .kok-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--card)}
  .mp .kok-h .knamn{font-family:'DM Serif Display',Georgia,serif;font-size:18px}
  .mp .kok.none .knamn{color:var(--red)}
  .mp .kok-h .kmeta{font-size:11px;color:var(--w40);text-transform:uppercase;letter-spacing:.05em}
  .mp .prep{border-top:1px solid var(--border)}
  .mp .prep-h{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;cursor:pointer}
  .mp .prep-h:hover{background:var(--card)}
  .mp .prep-h .pk{font-weight:700;font-size:14px}
  .mp .prep-h .pk .exp{color:var(--w40);font-weight:400;margin-right:7px;display:inline-block;transition:transform .12s}
  .mp .prep-h.open .exp{color:var(--orange);transform:rotate(90deg)}
  .mp .prep-h .ptot{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:var(--deep);border-radius:7px;padding:3px 11px;white-space:nowrap}
  .mp .items{display:none;padding:0 18px 12px}
  .mp .items.open{display:block}
  .mp table.it{width:100%;border-collapse:collapse}
  .mp table.it th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--w40);padding:6px 8px;border-bottom:1px solid var(--w10)}
  .mp table.it td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:12.5px}
  .mp .it-antal{font-weight:800;white-space:nowrap;width:70px}
  .mp .it-ben{font-weight:600}
  .mp .it-beskr{color:var(--w40);font-size:11px;margin-top:2px}
  .mp .it-meta{color:var(--w70);white-space:nowrap;font-size:11px}
  .mp .it-kok{background:var(--input);border:1px solid var(--border);border-radius:7px;padding:5px 7px;color:var(--white);font-family:var(--fb);font-size:11.5px;max-width:150px}
  .mp .it-kok:focus{outline:none;border-color:var(--orange)}
  .mp .empty{color:var(--w40);padding:30px 4px;text-align:center}
  .mp .err{color:var(--red);padding:20px 4px}
  .mp .muted{color:var(--w40)}
  .mp .vchip{background:var(--input);border:1px solid var(--border);border-radius:20px;padding:7px 15px;font-size:12px;color:var(--w70);cursor:pointer}
  .mp .vchip.on{background:var(--orange);border-color:var(--orange);color:#1c1206;font-weight:700}
  .mp .it-tid{font-weight:700;white-space:nowrap;color:var(--orange)}
  .mp .it-ref{white-space:nowrap;color:var(--w70)}
  .mp .pill{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--w70);background:var(--orange-dim)}
  .mp .klarbtn{background:var(--green);border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;color:#0d1a12;cursor:pointer;font-family:var(--fb);white-space:nowrap}
  .mp .klarbtn:hover{filter:brightness(1.07)}
  .mp .klarbtn:disabled{opacity:.5}
  .mp .ord-table{background:var(--panel);border:1px solid var(--border);border-radius:13px;overflow:hidden}
  .mp .ord-table table{width:100%;border-collapse:collapse}
  .mp .ord-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--w40);padding:11px 14px;border-bottom:1.5px solid var(--w10)}
  .mp .ord-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
  .mp .ord-table tr:last-child td{border-bottom:none}
</style>

<div class="mp">
  <input type="hidden" data-mira="api_host"       value="https://mira-exchange.onrender.com">
  <input type="hidden" data-mira="planning_token" value="SÄTT_SAMMA_SOM_PLANNING_ADMIN_TOKEN">

  <h1>Produktion <span>·</span> dagsvy</h1>
  <div class="sub">Prep-lista per kök · aggregerat på leveransdatum</div>

  <div class="bar">
    <button class="navbtn" data-mp="prev">‹ Föregående dag</button>
    <input type="date" class="datein" data-mp="date">
    <button class="navbtn" data-mp="next">Nästa dag ›</button>
    <button class="navbtn" data-mp="today">Idag</button>
    <span class="summary" data-mp="summary"></span>
  </div>

  <div class="bar">
    <span class="muted" style="font-size:11px">Vy:</span>
    <span class="vchip on" data-mp="view" data-v="prep">Prep-lista per kök</span>
    <span class="vchip" data-mp="view" data-v="order">Ordrar</span>
  </div>

  <div data-mp="body"><div class="empty">Laddar…</div></div>
</div>

<script>
(function(){
  "use strict";
  var all=document.querySelectorAll(".mp"),root=null;
  for(var i=0;i<all.length;i++){ if(!all[i].getAttribute("data-mp-claimed")){ root=all[i]; break; } }
  if(!root) return; root.setAttribute("data-mp-claimed","1");
  var $=function(k){ return root.querySelector('[data-mp="'+k+'"]'); };
  var cfg=function(k){ var el=root.querySelector('[data-mira="'+k+'"]'); return (el&&el.value)||""; };
  var HOST=cfg("api_host").replace(/\/+$/,""), TOKEN=cfg("planning_token");
  var STATE={ date:"", data:null, koklist:[], view:"prep" };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function num(n){ return (n==null?0:Math.round(n*100)/100).toLocaleString("sv-SE"); }
  function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function addDays(iso, n){ var d=new Date(iso+"T00:00:00.000Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

  function kokOptions(koks, cur){ var o='<option value="">— ej tilldelat —</option>'; for(var i=0;i<koks.length;i++){ o+='<option value="'+esc(koks[i].id)+'"'+(koks[i].id===cur?" selected":"")+'>'+esc(koks[i].namn)+'</option>'; } return o; }

  function itemsTable(items, koks){
    var trs=items.map(function(it){
      return '<tr>'+
        '<td class="it-antal">'+esc(num(it.antal))+' '+esc(it.enhet||"")+'</td>'+
        '<td class="it-tid">'+esc(it.leveranstid||"—")+'</td>'+
        '<td><div class="it-ben">'+esc(it.benamning||"")+'</div>'+(it.beskrivning?('<div class="it-beskr">'+esc(it.beskrivning)+'</div>'):'')+'</td>'+
        '<td class="it-meta">'+esc(it.order_nr||"")+(it.company?(' · '+esc(it.company)):'')+'</td>'+
        '<td class="it-ref">'+esc(it.ansvarig||"—")+'</td>'+
        '<td><select class="it-kok" data-rad="'+esc(it.rad_id)+'">'+kokOptions(koks, it.kok_id||"")+'</select></td>'+
      '</tr>';
    }).join("");
    return '<table class="it"><thead><tr><th>Antal</th><th>Tid</th><th>Maträtt / produkt</th><th>Order</th><th>Vår referens</th><th>Kök</th></tr></thead><tbody>'+trs+'</tbody></table>';
  }
  function renderOrders(){
    var d=STATE.data, os=d.orders||[];
    if(!os.length){ $("body").innerHTML='<div class="empty">Inga ordrar i produktion detta datum.</div>'; return; }
    var trs=os.map(function(o){
      return '<tr>'+
        '<td class="it-tid">'+esc(o.leveranstid||"—")+'</td>'+
        '<td><div class="it-ben">'+esc(o.ordernr||"")+'</div><div class="it-beskr">'+esc(o.company||"")+'</div></td>'+
        '<td class="it-meta">'+esc((o.koks||[]).join(", "))+'</td>'+
        '<td class="it-antal">'+esc(num(o.total_antal))+'</td>'+
        '<td class="it-ref">'+esc(o.ansvarig||"—")+'</td>'+
        '<td><span class="pill">'+esc(o.status)+'</span></td>'+
        '<td><button class="klarbtn" data-order="'+esc(o.order_id)+'">✓ Markera klar</button></td>'+
      '</tr>';
    }).join("");
    $("body").innerHTML='<div class="ord-table"><table><thead><tr><th>Tid</th><th>Order</th><th>Kök</th><th>Antal</th><th>Vår referens</th><th>Status</th><th></th></tr></thead><tbody>'+trs+'</tbody></table></div>';
  }
  function render(){
    var d=STATE.data;
    if(!d){ $("body").innerHTML='<div class="empty">Laddar…</div>'; return; }
    $("summary").textContent=d.order_count+" ordrar · "+d.row_count+" rader";
    if(STATE.view==="order"){ renderOrders(); return; }
    if(!d.koks || !d.koks.length){ $("body").innerHTML='<div class="empty">Inga ordrar i produktion detta datum.</div>'; return; }
    var koks=STATE.koklist||[];
    var h=d.koks.map(function(g, gi){
      var preps=g.prep.map(function(p, pi){
        return '<div class="prep">'+
          '<div class="prep-h" data-g="'+gi+'" data-p="'+pi+'"><div class="pk"><span class="exp">▸</span>'+esc(p.kategori)+'</div><div class="ptot">'+esc(num(p.total_antal))+' st</div></div>'+
          '<div class="items" data-items="'+gi+'-'+pi+'">'+itemsTable(p.items, koks)+'</div>'+
        '</div>';
      }).join("");
      return '<div class="kok'+(g.kok_id?"":" none")+'"><div class="kok-h"><div class="knamn">'+esc(g.kok_namn)+'</div><div class="kmeta">'+g.row_count+' rader</div></div>'+preps+'</div>';
    }).join("");
    $("body").innerHTML=h;
  }

  function load(){
    if(!HOST||!TOKEN){ $("body").innerHTML='<div class="err">Saknar api_host/planning_token.</div>'; return; }
    $("body").innerHTML='<div class="empty">Laddar…</div>';
    fetch(HOST+"/admin/produktion/dag?date="+encodeURIComponent(STATE.date),{headers:{"x-admin-token":TOKEN}})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j||!j.ok){ $("body").innerHTML='<div class="err">Kunde inte ladda ('+esc((j&&j.error)||"fel")+').</div>'; return; } STATE.data=j; STATE.koklist=j.koklist||[]; render(); })
      .catch(function(){ $("body").innerHTML='<div class="err">Nätverksfel.</div>'; });
  }
  function setDate(iso){ STATE.date=iso; var di=$("date"); if(di) di.value=iso; load(); }

  root.addEventListener("click",function(e){
    var t=e.target;
    if(t.closest && t.closest('[data-mp="prev"]')){ setDate(addDays(STATE.date,-1)); return; }
    if(t.closest && t.closest('[data-mp="next"]')){ setDate(addDays(STATE.date,1)); return; }
    if(t.closest && t.closest('[data-mp="today"]')){ setDate(todayISO()); return; }
    var vc=t.closest && t.closest('.vchip[data-mp="view"]');
    if(vc){ STATE.view=vc.getAttribute("data-v"); root.querySelectorAll('.vchip[data-mp="view"]').forEach(function(c){ c.className="vchip"+(c.getAttribute("data-v")===STATE.view?" on":""); }); render(); return; }
    var kb=t.closest && t.closest(".klarbtn");
    if(kb){
      var oid=kb.getAttribute("data-order"); kb.disabled=true; kb.textContent="…";
      fetch(HOST+"/admin/produktion/order/"+encodeURIComponent(oid)+"/status",{method:"POST",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({status:"Levererad"})})
        .then(function(r){ return r.json(); }).then(function(j){ if(!j||!j.ok){ kb.disabled=false; kb.textContent="✓ Markera klar"; alert("Kunde inte uppdatera status."); return; } load(); })   // reload → försvinner ur dagsvyn
        .catch(function(){ kb.disabled=false; kb.textContent="✓ Markera klar"; alert("Nätverksfel."); });
      return;
    }
    var ph=t.closest && t.closest(".prep-h");
    if(ph){ ph.classList.toggle("open"); var box=root.querySelector('[data-items="'+ph.getAttribute("data-g")+'-'+ph.getAttribute("data-p")+'"]'); if(box) box.classList.toggle("open"); return; }
  });
  root.addEventListener("change",function(e){
    var sel=e.target;
    if(!sel.classList || !sel.classList.contains("it-kok")) return;
    if(sel.getAttribute("data-mp")==="date"){ return; }
    var radId=sel.getAttribute("data-rad"), kokId=sel.value;
    sel.disabled=true;
    fetch(HOST+"/admin/produktion/rad/"+encodeURIComponent(radId)+"/kok",{method:"POST",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({kok_id:kokId})})
      .then(function(r){ return r.json(); })
      .then(function(j){ sel.disabled=false; if(!j||!j.ok){ alert("Kunde inte flytta rad."); return; } load(); })   // reload → omgruppering
      .catch(function(){ sel.disabled=false; alert("Nätverksfel."); });
  });
  root.addEventListener("change",function(e){ if(e.target.getAttribute("data-mp")==="date"){ STATE.date=e.target.value; load(); } });

  setDate(todayISO());
})();
</script>
