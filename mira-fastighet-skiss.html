<!--
  mira-fastighet-skiss.html — SKISS av fastighetsägarvyn (Mira Fastighet, sidan /fastighet).
  Klickbar prototyp med MOCK-data. Ingen backend, ingen token, inget att deploya.

  Syfte: visa vad en fastighetsägare (Hyresvärd) kan se om servicelivet i sitt bestånd
  UTAN att vi visar kronor och utan att hyresgästens innehåll läcker.

  Design-kontrakt när den byggs skarpt (se handoff/FASTIGHETSAGARVYN.md):
    - Egen roll `User_role = Hyresvärd`, egen session `x-landlord-token` (landlord_auth.js),
      speglar visitor_auth.js. BÄR ALDRIG PLANNING_ADMIN_TOKEN.
    - Tokenen bär en EXPLICIT fastighetslista, expanderad server-side ur Hyresvärden.
      Tom lista = ingen åtkomst, aldrig "alla".
    - Ägaren ser sina EGNA ärenden i detalj. Hyresgästens ärenden BARA i aggregat.
    - Inga belopp. Aldrig. Aktivitet, kvalitet, täckning.
    - Ingen totalsumma över de tre affärsområdena (BOKNINGSLAGE-regeln) — tre spår, tre mått.

  Konventioner: .fa-namnrymd, INGEN ?./??, IIFE, FAROOT-claim, raka quotes.
-->

    if(!f) return null; return (s-f)/f;
  }
  function pct(x){ return Math.round(x*100)+" %"; }
  function trendTag(d){
    if(d===null) return '<span class="pt flat">—</span>';
    var v=Math.round(d*100);
    if(v>2)  return '<span class="pt up">&#9650; '+v+' %</span>';
    if(v<-2) return '<span class="pt down">&#9660; '+Math.abs(v)+' %</span>';
    return '<span class="pt flat">&#8212; '+v+' %</span>';
  }
  function spar(h){
    var max=1,ser=[["hk",h.hk],["fe",h.fe],["sp",h.sp]],k,j;
    for(k=0;k<ser.length;k++){ for(j=0;j<ser[k][1].length;j++){ if(ser[k][1][j]>max) max=ser[k][1][j]; } }
    var out='<div class="spar">';
    for(j=0;j<6;j++){
      for(k=0;k<ser.length;k++){
        var v=ser[k][1][j], hgt=Math.max(2,Math.round(v/max*26));
        out+='<i class="'+ser[k][0]+'" style="height:'+hgt+'px" title="'+ser[k][0]+' '+v+'"></i>';
      }
      if(j<5) out+='<i style="width:4px;height:1px;background:transparent"></i>';
    }
    return out+'</div>';
  }
  function meter(v,inv){
    var cls = inv ? (v<0.5?"low":(v<0.75?"":"ok")) : (v<0.5?"low":(v<0.75?"":"ok"));
    return '<div class="mrow"><div class="meter"><b class="'+cls+'" style="width:'+Math.round(v*100)+'%"></b></div>'+
           '<span class="mv">'+pct(v)+'</span></div>';
  }
  function betygCell(b,d){
    var cls = b>=4.3?"up":(b>=3.8?"flat":"down");
    var arr = d>0.05?'&#9650;':(d<-0.05?'&#9660;':'');
    return '<span class="'+cls+'" style="font-weight:800">'+b.toFixed(1).replace(".",",")+'</span>'+
           '<span class="muted" style="font-size:11px"> / 5 '+arr+'</span>';
  }
  function trendPill(t){
    var m={up:["p-up","Växande"],flat:["p-flat","Stabil"],down:["p-down","Avtagande"],quiet:["p-quiet","Tyst"]};
    var x=m[t]||m.flat;
    return '<span class="pill '+x[0]+'"><span class="d"></span>'+x[1]+'</span>';
  }

  // ── Pulsremsan ────────────────────────────────────────────────────────────
  function paintPuls(){
    var v=valda();
    var hk=sumSpar(v,"hk"), fe=sumSpar(v,"fe"), sp=sumSpar(v,"sp");
    var oppna=sum(v,"oppna"), avv=sum(v,"avvikelser");
    var b=0; for(var i=0;i<v.length;i++) b+=v[i].betyg; b=v.length?b/v.length:0;
    var bd=0; for(i=0;i<v.length;i++) bd+=v[i].betygdelta; bd=v.length?bd/v.length:0;
    var tk=0; for(i=0;i<v.length;i++) tk+=v[i].tackning; tk=v.length?tk/v.length:0;

    // ⚠️ INGEN totalsumma över de tre affärsområdena — tre mått, tre kort.
    var html=''+
     '<div class="pk">'+trendTag(delta(v,"hk"))+'<div class="pl">Städpass</div><div class="pv">'+hk+'</div>'+
       '<div class="pu">utförda i beståndet</div></div>'+
     '<div class="pk warn">'+trendTag(delta(v,"fe"))+'<div class="pl">Mat &amp; event</div><div class="pv">'+fe+'</div>'+
       '<div class="pu">leveranstillfällen</div><div class="pw">täckning 70 %</div></div>'+
     '<div class="pk">'+trendTag(delta(v,"sp"))+'<div class="pl">Bemanning</div><div class="pv">'+sp+'</div>'+
       '<div class="pu">uppdrag (månadsnivå)</div></div>'+
     '<div class="pk">'+(avv?'<span class="pt down">'+avv+' avvikelser</span>':'<span class="pt up">0 avvikelser</span>')+
       '<div class="pl">Öppna ärenden</div><div class="pv">'+oppna+'</div>'+
       '<div class="pu">varav '+avv+' avvikelser</div></div>'+
     '<div class="pk">'+(bd>0.05?'<span class="pt up">&#9650; '+bd.toFixed(1).replace(".",",")+'</span>':
        (bd<-0.05?'<span class="pt down">&#9660; '+Math.abs(bd).toFixed(1).replace(".",",")+'</span>':'<span class="pt flat">&#8212;</span>'))+
       '<div class="pl">Kvalitet</div><div class="pv">'+b.toFixed(1).replace(".",",")+'</div>'+
       '<div class="pu">snitt av kontroller, av 5</div></div>';
    $("puls").innerHTML=html;
  }

  // ── Flik: Bestånd ─────────────────────────────────────────────────────────
  function viewBestand(){
    var v=valda();
    var rows=v.map(function(h){
      return '<tr class="clickrow" data-hus="'+h.id+'">'+
        '<td><span class="nm">'+esc(h.namn)+'</span><span class="s">'+esc(h.adress)+'</span></td>'+
        '<td class="num">'+h.hyresgaster+'</td>'+
        '<td class="num">'+h.kvm.toLocaleString("sv-SE")+'<span class="s" style="text-align:right">'+h.arbetsplatser+' apl</span></td>'+
        '<td>'+spar(h)+'</td>'+
        '<td class="num">'+h.oppna+(h.avvikelser?'<span class="s down" style="text-align:right;color:var(--red)">'+h.avvikelser+' avvik.</span>':'')+'</td>'+
        '<td class="num">'+h.mtts.toFixed(1).replace(".",",")+'<span class="s" style="text-align:right">dgr</span></td>'+
        '<td class="num">'+betygCell(h.betyg,h.betygdelta)+'</td>'+
        '<td style="min-width:130px">'+meter(h.tackning)+'</td>'+
      '</tr>';
    }).join("");
    return ''+
     '<div class="note"><b>Så här läser man den.</b> Varje rad är ett hus. Stapelgruppen visar sex månader '+
     'av serviceaktivitet i tre spår som aldrig slås ihop till en siffra — städ, mat och bemanning är '+
     'olika enheter, och en gemensam summa hade varit ett tal utan innebörd. Täckningen är andelen '+
     'hyresgäster i huset som har minst en aktiv tjänst hos oss.</div>'+
     '<div class="panel"><h3>Beståndet</h3>'+
     '<div class="ph">Klicka en rad för att filtrera hela vyn till det huset.</div>'+
     '<div class="tablewrap"><table><thead><tr>'+
       '<th>Fastighet</th><th style="text-align:right">Hyresgäster</th><th style="text-align:right">Kvm i service</th>'+
       '<th>Aktivitet, 6 mån</th><th style="text-align:right">Öppna ärenden</th>'+
       '<th style="text-align:right">Tid till stängning</th><th style="text-align:right">Kvalitet</th><th>Tjänstetäckning</th>'+
     '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
     '<div class="legend"><span><i style="background:rgba(155,125,239,.7)"></i>Städpass</span>'+
       '<span><i style="background:rgba(91,141,239,.7)"></i>Mat &amp; event</span>'+
       '<span><i style="background:rgba(76,175,125,.7)"></i>Bemanning</span></div></div>';
  }

  // ── Flik: Hyresgästpuls ───────────────────────────────────────────────────
  function viewPuls(){
    var list=HG.filter(function(c){ return (!STATE.hus||c.hus===STATE.hus) &&
      (!STATE.q||c.namn.toLowerCase().indexOf(STATE.q.toLowerCase())>-1); });
    var ordn={quiet:0,down:1,flat:2,up:3};
    list.sort(function(a,b){ return ordn[a.trend]-ordn[b.trend]; });
    var rows=list.map(function(c){
      var h=husById(c.hus);
      var tj=TJANSTER.map(function(t){
        return c.tj.indexOf(t.slug)>-1 ? '<span class="chip on">'+esc(t.namn)+'</span>' : '';
      }).join("")||'<span class="chip no">ingen tjänst</span>';
      var saknas=TJANSTER.length-c.tj.length;
      return '<tr>'+
        '<td><span class="nm">'+esc(c.namn)+'</span><span class="s">'+esc(h?h.namn:"")+' &middot; '+
          c.kvm.toLocaleString("sv-SE")+' kvm &middot; '+c.ap+' arbetsplatser</span></td>'+
        '<td>'+trendPill(c.trend)+'<span class="s">'+esc(c.delta)+' mot föregående kvartal</span></td>'+
        '<td>'+esc(c.sen)+'</td>'+
        '<td class="num">'+c.betyg.toFixed(1).replace(".",",")+'<span class="s" style="text-align:right">av 5</span></td>'+
        '<td style="max-width:320px">'+tj+'<span class="s">'+saknas+' av '+TJANSTER.length+' tjänster ej aktiva</span></td>'+
      '</tr>';
    }).join("")||'<tr><td colspan="5"><div class="empty">Inga hyresgäster matchar.</div></td></tr>';

    return ''+
     '<div class="note"><b>Det här är inblicken ni aldrig haft.</b> En hyresgäst som slutar beställa service '+
     'har ofta bestämt sig långt innan uppsägningen kommer. Aktivitetstrenden är den tidigaste signal som '+
     'finns i huset — tidigare än passagestatistik, och månader före en omförhandling. '+
     '<b>Tyst</b> betyder noll registrerad serviceaktivitet på över 60 dagar.</div>'+
     '<div class="bar"><input class="search" data-fa="q" placeholder="Sök hyresgäst..." value="'+esc(STATE.q)+'"></div>'+
     '<div class="panel"><h3>Hyresgästpuls</h3>'+
     '<div class="ph">Sorterad med störst risk överst. Trenden jämför senaste kvartalet mot föregående, '+
     'per affärsområde — en hyresgäst räknas som avtagande när minst två av tre spår faller.</div>'+
     '<div class="tablewrap"><table><thead><tr>'+
       '<th>Hyresgäst</th><th>Trend</th><th>Senaste aktivitet</th><th style="text-align:right">Kvalitet</th><th>Aktiva tjänster</th>'+
     '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  // ── Flik: Ärenden ─────────────────────────────────────────────────────────
  function viewArenden(){
    var v=valda(), ids=v.map(function(h){ return h.id; });
    var egna=EGNA.filter(function(m){ return ids.indexOf(m.hus)>-1; });
    var oppnaEgna=egna.filter(function(m){ return m.status==="Pågående"; });
    var rows=oppnaEgna.map(function(m){
      var h=husById(m.hus);
      var pcls=m.prio.indexOf("3")===0?"p-quiet":(m.prio.indexOf("2")===0?"p-down":"p-flat");
      return '<tr>'+
        '<td><span class="nm">'+esc(m.rubrik)+'</span><span class="s">'+esc(h?h.namn:"")+' &middot; '+esc(m.yta)+'</span></td>'+
        '<td><span class="pill '+pcls+'"><span class="d"></span>'+esc(m.prio)+'</span></td>'+
        '<td>'+(m.avv?'<span class="pill p-quiet"><span class="d"></span>Avvikelse</span>':'<span class="muted">&mdash;</span>')+'</td>'+
        '<td class="num">'+m.dgr+'<span class="s" style="text-align:right">dgr öppet</span></td>'+
      '</tr>';
    }).join("")||'<tr><td colspan="4"><div class="empty">Inga öppna ärenden i era egna ytor.</div></td></tr>';

    var kort=v.map(function(h){
      var a=HGAGG[h.id];
      var kat=a.kat.map(function(k){ return '<span class="chip">'+esc(k[0])+' &middot; '+k[1]+'</span>'; }).join("");
      return '<div class="aggk"><div class="an">'+esc(h.namn)+'</div>'+
        '<div class="ar"><span>Öppna ärenden</span><b>'+a.oppna+'</b></div>'+
        '<div class="ar"><span>Varav avvikelser</span><b style="color:'+(a.avv?"var(--red)":"var(--w70)")+'">'+a.avv+'</b></div>'+
        '<div class="ar"><span>Medeltid till stängning</span><b>'+a.mtts.toFixed(1).replace(".",",")+' dgr</b></div>'+
        '<div class="cats">'+kat+'</div></div>';
    }).join("");

    return ''+
     '<div class="panel"><h3>Era egna ytor</h3>'+
     '<div class="ph">Entréer, hisshallar, lounger, garage och lastkajer — ärenden där ni är beställaren. '+
     'De visas i sin helhet, för de är era.</div>'+
     '<div class="tablewrap"><table><thead><tr>'+
       '<th>Ärende</th><th>Prioritet</th><th>Avvikelse</th><th style="text-align:right">Ålder</th>'+
     '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
     '<div class="note"><b>Varför hyresgästernas ärenden bara visas i aggregat.</b> Ett ärende innehåller '+
     'vad som gick fel hos en namngiven hyresgäst och vem som anmälde det. Den informationen är '+
     'hyresgästens, inte husets. Ni får volymen, avvikelsegraden, kategorin och hur lång tid vi tar på oss — allt '+
     'som säger något om husets servicekvalitet — utan innehållet. En hyresgäst som vill dela mer '+
     'kan slå på det själv på sitt företagskort.</div>'+
     '<div class="panel"><h3>Hyresgästernas ärenden &mdash; aggregerat</h3>'+
     '<div class="ph">Per hus. Inga rubriker, inga beskrivningar, inga personer.</div>'+
     '<div class="agg">'+kort+'</div></div>';
  }

  // ── Flik: Kvalitet ────────────────────────────────────────────────────────
  function viewKvalitet(){
    var v=valda();
    var head=v.map(function(h){ return '<th style="text-align:right">'+esc(h.namn)+'</th>'; }).join("");
    var rows=YTOR.map(function(y){
      var tds=v.map(function(h){
        var b=y[h.id], cls=b>=4.3?"up":(b>=3.8?"flat":"down");
        return '<td class="num"><span class="'+cls+'">'+b.toFixed(1).replace(".",",")+'</span></td>';
      }).join("");
      return '<tr><td class="nm">'+esc(y.namn)+'</td>'+tds+'</tr>';
    }).join("");
    var husrader=v.map(function(h){
      return '<tr>'+
        '<td><span class="nm">'+esc(h.namn)+'</span></td>'+
        '<td style="min-width:170px">'+meter(h.betyg/5)+'</td>'+
        '<td class="num">'+betygCell(h.betyg,h.betygdelta)+'</td>'+
        '<td class="num">'+(h.id==="h3"?"4":(h.id==="h4"?"2":"6"))+'<span class="s" style="text-align:right">kontroller i perioden</span></td>'+
      '</tr>';
    }).join("");
    return ''+
     '<div class="note"><b>Det här är bevisföringen.</b> Varje kontroll är en fysisk genomgång av huset, '+
     'yta för yta, med foto och betyg. Det är den enda dokumentationen av hur huset faktiskt levereras '+
     '&mdash; och den finns bara för att vi är där och gör jobbet.</div>'+
     '<div class="panel"><h3>Kvalitet per hus</h3>'+
     '<div class="tablewrap"><table><thead><tr><th>Fastighet</th><th>Nivå</th>'+
     '<th style="text-align:right">Snitt</th><th style="text-align:right">Underlag</th></tr></thead>'+
     '<tbody>'+husrader+'</tbody></table></div></div>'+
     '<div class="panel"><h3>Snittbetyg per ytatyp</h3>'+
     '<div class="ph">Här syns mönstret som ett hussnitt döljer. Faller toaletterna i ett hus är det ett '+
     'städschema som behöver ändras, inte ett samtal om helheten.</div>'+
     '<div class="tablewrap"><table><thead><tr><th>Ytatyp</th>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  // ── Flik: Tjänstekartan ───────────────────────────────────────────────────
  function viewTjanster(){
    var list=HG.filter(function(c){ return !STATE.hus||c.hus===STATE.hus; });
    var head=TJANSTER.map(function(t){ return '<th>'+esc(t.namn)+'</th>'; }).join("");
    var rows=list.map(function(c){
      var h=husById(c.hus);
      var tds=TJANSTER.map(function(t){
        var on=c.tj.indexOf(t.slug)>-1;
        return '<td><span class="dot'+(on?" on":"")+'" title="'+esc(t.namn)+'"></span></td>';
      }).join("");
      return '<tr><td class="lft"><span class="nm">'+esc(c.namn)+'</span>'+
        '<span class="s">'+esc(h?h.namn:"")+'</span></td>'+tds+'</tr>';
    }).join("");
    // vitt utrymme per tjanst
    var vitt=TJANSTER.map(function(t){
      var n=0; for(var i=0;i<list.length;i++){ if(list[i].tj.indexOf(t.slug)===-1) n++; }
      return {namn:t.namn, n:n, andel:list.length?n/list.length:0};
    }).sort(function(a,b){ return b.n-a.n; });
    var vrows=vitt.map(function(x){
      return '<tr><td class="nm">'+esc(x.namn)+'</td>'+
        '<td style="min-width:180px">'+meter(1-x.andel)+'</td>'+
        '<td class="num">'+x.n+'<span class="s" style="text-align:right">hyresgäster utan</span></td></tr>';
    }).join("");
    return ''+
     '<div class="note"><b>Attraktivitet, inte försäljning.</b> Kartan visar vad huset faktiskt erbjuder '+
     'sina hyresgäster idag. Det vita utrymmet är skillnaden mellan vad ett hus kan vara och vad det är. '+
     'Priser sitter i avtalet mellan oss och hyresgästen och visas inte här.</div>'+
     '<div class="panel"><h3>Vem har vad</h3>'+
     '<div class="tablewrap"><table class="matrix"><thead><tr><th class="lft">Hyresgäst</th>'+head+
     '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
     '<div class="panel"><h3>Vitt utrymme</h3>'+
     '<div class="ph">Mätarna visar hur stor andel av hyresgästerna som HAR tjänsten.</div>'+
     '<div class="tablewrap"><table><thead><tr><th>Tjänst</th><th>Täckning</th>'+
     '<th style="text-align:right">Lucka</th></tr></thead><tbody>'+vrows+'</tbody></table></div></div>';
  }

  // ── Flik: Källtäckning ────────────────────────────────────────────────────
  // Källbadge i samma form och färg som affärsvyns .src — samma källa, samma färg,
  // över hela produkten.
  function srcTag(namn){
    var cls={Tengella:"tengella",Fortnox:"fortnox",Intelliplan:"intelliplan",Mira:"mira"}[namn]||"mira";
    return '<span class="src '+cls+'"><span class="d"></span>'+esc(namn)+'</span>';
  }
  function viewKallor(){
    var rows=KALLOR.map(function(k){
      var pill=k.tackning>=0.9?'<span class="pill p-up"><span class="d"></span>Frisk</span>':
               (k.tackning>0?'<span class="pill p-down"><span class="d"></span>Delvis</span>':
                             '<span class="pill p-quiet"><span class="d"></span>Ej i drift</span>');
      return '<tr><td><span class="nm">'+esc(k.namn)+'</span>'+
        (k.not?'<span class="s">'+esc(k.not)+'</span>':'')+'</td>'+
        '<td>'+srcTag(k.kalla)+'</td>'+
        '<td style="min-width:150px">'+meter(k.tackning)+'</td>'+
        '<td>'+esc(k.sync)+'</td><td>'+pill+'</td></tr>';
    }).join("");
    return ''+
     '<div class="note"><b>Det här är sidan ingen annan visar er.</b> En vy som inte berättar vad den '+
     'inte vet är farligare än ingen vy alls: en tom kolumn ser ut som "inget händer" när den i själva '+
     'verket betyder "vi mäter inte här än". Därför ligger täckningen öppet, och därför står det '+
     '70 % på mat och event i pulsremsan.</div>'+
     '<div class="panel"><h3>Vad vyn bygger på</h3>'+
     '<div class="tablewrap"><table><thead><tr><th>Underlag</th><th>Källa</th><th>Täckning</th>'+
     '<th>Senast uppdaterad</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function paintTabs(){
    $("tabs").innerHTML=TABS.map(function(t){
      var b=badge(t[0]);
      return '<button class="tab'+(STATE.tab===t[0]?" on":"")+'" data-tab="'+t[0]+'">'+esc(t[1])+
        (b?'<b>'+esc(b)+'</b>':'')+'</button>';
    }).join("");
  }
  function paintHus(){
    var o='<option value="">Hela beståndet ('+HUS.length+' fastigheter)</option>';
    for(var i=0;i<HUS.length;i++) o+='<option value="'+HUS[i].id+'"'+(STATE.hus===HUS[i].id?" selected":"")+'>'+
      esc(HUS[i].namn)+'</option>';
    $("hus").innerHTML=o;
  }
  function render(){
    paintHus(); paintPuls(); paintTabs();
    var f={bestand:viewBestand,puls:viewPuls,arenden:viewArenden,
           kvalitet:viewKvalitet,tjanster:viewTjanster,kallor:viewKallor}[STATE.tab];
    $("body").innerHTML=f?f():'<div class="empty">—</div>';
    var v=valda(), hg=sum(v,"hyresgaster");
    $("who").textContent="Vasakronan · "+v.length+
      (v.length===1?" fastighet · ":" fastigheter · ")+hg+" hyresgäster";
  }

  root.addEventListener("click",function(e){
    var t=e.target.closest ? e.target.closest("[data-tab]") : null;
    if(t){ STATE.tab=t.getAttribute("data-tab"); render(); return; }
    var r=e.target.closest ? e.target.closest("[data-hus]") : null;
    if(r){ STATE.hus=r.getAttribute("data-hus"); render(); return; }
  });
  root.addEventListener("change",function(e){
    if(e.target===$("hus")){ STATE.hus=e.target.value; render(); }
  });
  root.addEventListener("input",function(e){
    if(e.target.getAttribute && e.target.getAttribute("data-fa")==="q"){
      STATE.q=e.target.value;
      var pos=e.target.selectionStart; render();
      var n=$("q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    }
  });

  render();
})();
</script>
