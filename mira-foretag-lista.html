<!--
  mira-foretag-lista.html — företagslista + integrerat kundkort i ETT block (ingen Bubble-popup).
  Klick på företagsnamn → kort-vy i samma DOM (← Tillbaka går åter till listan).
  Backend: companies_api.js (GET /admin/companies/list, /meta, /:id/card ; PATCH /admin/companies/:id).
  Data-mira hidden inputs:
    data-mira="api_host"       = https://mira-exchange.onrender.com
    data-mira="planning_token" = PLANNING_ADMIN_TOKEN
  Konventioner (HANDOFF): INGEN ?. / ?? (Bubbles parser). IIFE, BROOT-claim, .fl-/.fk-namnrymd,
  yes/no→"ja". Inline-edit + kort-redigering via PATCH. SWR (fl:-prefix).
-->
<style>
  .fl{--fl-bg:#0f1830;--fl-card:#16223d;--fl-card2:#1b2947;--fl-line:#243456;--fl-txt:#e7ecf6;--fl-mut:#8ea0c2;--fl-acc:#df6f39;--fl-ok:#2ecc71;--fl-chip:#1c2b4d;
      color:var(--fl-txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.4;}
  .fl *{box-sizing:border-box;}
  .fl-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
  .fl-head h1{font-size:20px;font-weight:700;margin:0;}
  .fl-head .fl-count{color:var(--fl-mut);font-size:12px;font-weight:500;}
  .fl-head .fl-refresh{margin-left:auto;background:var(--fl-chip);color:var(--fl-txt);border:1px solid var(--fl-line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;}
  .fl-head .fl-refresh:hover{border-color:var(--fl-acc);}
  .fl-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;}
  .fl-filters .fl-search{flex:1;min-width:180px;background:var(--fl-card);border:1px solid var(--fl-line);color:var(--fl-txt);border-radius:8px;padding:8px 12px;font-size:13px;}
  .fl-filters .fl-sel{background:var(--fl-card);border:1px solid var(--fl-line);color:var(--fl-txt);border-radius:8px;padding:7px 10px;font-size:12px;max-width:190px;}
  .fl-filters .fl-sel option{background:#16223d;color:#e7ecf6;}
  .fl-filters .fl-clear{background:transparent;color:var(--fl-mut);border:1px solid var(--fl-line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px;}
  .fl-filters .fl-clear:hover{color:var(--fl-txt);border-color:var(--fl-acc);}
  .fl-wrap{overflow-x:auto;border:1px solid var(--fl-line);border-radius:12px;background:var(--fl-card);}
  .fl-tbl{width:100%;border-collapse:collapse;min-width:1050px;}
  .fl-tbl th{text-align:left;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--fl-mut);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--fl-line);white-space:nowrap;position:sticky;top:0;background:var(--fl-card);}
  .fl-tbl th.fl-sortable{cursor:pointer;user-select:none;}
  .fl-tbl th.fl-sortable:hover{color:var(--fl-txt);}
  .fl-tbl th .fl-arr{color:var(--fl-acc);margin-left:3px;}
  .fl-tbl th.fl-num,.fl-tbl td.fl-num{text-align:right;}
  .fl-tbl td{padding:9px 12px;border-bottom:1px solid rgba(36,52,86,.5);vertical-align:middle;white-space:nowrap;}
  .fl-tbl tr:last-child td{border-bottom:none;}
  .fl-tbl tr:hover td{background:rgba(28,43,77,.4);}
  .fl-name{font-weight:600;color:var(--fl-txt);}
  .fl-open{cursor:pointer;color:var(--fl-txt);border-bottom:1px dotted transparent;}
  .fl-open:hover{color:var(--fl-acc);border-bottom-color:var(--fl-acc);}
  .fl-edit{cursor:text;border-radius:6px;padding:2px 6px;margin:-2px -6px;display:inline-block;min-width:26px;}
  .fl-edit:hover{background:var(--fl-chip);outline:1px dashed var(--fl-line);}
  .fl-edit.fl-empty{color:var(--fl-mut);font-style:italic;}
  .fl-tbl td.fl-ecell{cursor:pointer;}
  .fl-tbl td.fl-ecell:hover{background:rgba(223,111,57,.10);box-shadow:inset 0 0 0 1px var(--fl-line);}
  .fl-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .fl-pill.fl-active{background:rgba(46,204,113,.16);color:#5fe0a0;}
  .fl-pill.fl-prospect{background:rgba(223,111,57,.16);color:#f0a070;}
  .fl-pill.fl-plain{background:var(--fl-chip);color:var(--fl-mut);}
  .fl-star{color:var(--fl-acc);}
  .fl-ec{background:var(--fl-bg);border:1px solid var(--fl-acc);color:var(--fl-txt);border-radius:6px;padding:4px 6px;font-size:12px;max-width:180px;}
  .fl-ec option{background:#16223d;color:#e7ecf6;}
  .fl-save{color:var(--fl-mut);font-size:10px;margin-left:6px;}
  .fl-save.fl-okc{color:var(--fl-ok);}
  .fl-save.fl-errc{color:#ff6b6b;}
  .fl-more{text-align:center;padding:14px;}
  .fl-more button{background:var(--fl-chip);color:var(--fl-txt);border:1px solid var(--fl-line);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:12px;}
  .fl-more button:hover{border-color:var(--fl-acc);}
  .fl-msg{padding:22px 6px;color:var(--fl-mut);text-align:center;}
  .fl-err{padding:16px;color:#ff8080;}
  .fl-loading{max-width:460px;margin:60px auto;text-align:center;}
  .fl-lbar{height:8px;border-radius:6px;background:var(--fl-line);overflow:hidden;}
  .fl-lfill{height:100%;background:linear-gradient(90deg,var(--fl-acc),#f0a070);border-radius:6px;width:0;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .fl-lpct{margin-top:10px;font-size:24px;font-weight:700;color:var(--fl-txt);font-variant-numeric:tabular-nums;}
  .fl-lmsg{margin-top:2px;font-size:13px;color:var(--fl-txt);}
  .fl-lsub{margin-top:8px;font-size:11.5px;color:var(--fl-mut);line-height:1.5;}
  .fl-revbanner{margin:8px 2px 0;font-size:11.5px;color:var(--fl-mut);display:flex;align-items:center;gap:7px;}
  .fl-revbanner .fl-dot{width:7px;height:7px;border-radius:50%;background:var(--fl-acc);animation:fl-pulse 1.1s ease-in-out infinite;}
  .fl-calc{color:var(--fl-mut);font-size:11px;font-style:italic;opacity:.75;animation:fl-pulse 1.4s ease-in-out infinite;}
  @keyframes fl-pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ── KORT (kundkort-vy i samma block) ── */
  .fk-back{background:var(--fl-chip);color:var(--fl-txt);border:1px solid var(--fl-line);border-radius:9px;padding:8px 15px;cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .fk-back:hover{border-color:var(--fl-acc);}
  .fk-card{background:var(--fl-bg);border:1px solid var(--fl-line);border-radius:16px;overflow:hidden;}
  .fk-hero{padding:20px 24px 0;}
  .fk-herotop{display:flex;align-items:flex-start;gap:16px;}
  .fk-hident{min-width:0;}
  .fk-herotop .fk-logo,.fk-herotop .fk-herologo{margin-left:auto;}
  .fk-logo{width:56px;height:56px;border-radius:12px;background:var(--fl-acc);color:#0f1830;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;overflow:hidden;}
  /* Riktig logga: bred pill med fast höjd + auto bredd → rektangulära wordmarks syns i full bredd */
  .fk-herologo{height:56px;max-width:300px;background:#fff;border-radius:12px;padding:8px 14px;box-sizing:border-box;display:flex;align-items:center;flex-shrink:0;}
  .fk-herologo img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;}
  .fk-avatar{width:52px;height:52px;border-radius:50%;background:var(--fl-acc);color:#0f1830;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex-shrink:0;overflow:hidden;}
  .fk-avatar img{width:100%;height:100%;object-fit:cover;}
  .fk-photorow{display:flex;align-items:center;gap:14px;margin:2px 0 4px;}
  .fk-photorow .fk-avatar{width:64px;height:64px;font-size:22px;}
  .fk-photobtns{display:flex;flex-direction:column;gap:6px;}
  .fk-photobtns button{background:var(--fl-chip);color:var(--fl-txt);border:1px solid var(--fl-line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;}
  .fk-photobtns button:hover{border-color:var(--fl-acc);}
  .fk-photobtns button.del{color:var(--fl-mut);}
  .fk-photomsg{font-size:11.5px;color:var(--fl-mut);min-height:14px;}
  .fk-feed{display:flex;flex-direction:column;}
  .fk-feeditem{display:flex;gap:14px;padding:11px 2px;border-bottom:1px solid var(--fl-line);}
  .fk-feeditem:last-child{border-bottom:none;}
  .fk-feeddate{flex:0 0 84px;font-size:12px;color:var(--fl-mut);font-variant-numeric:tabular-nums;padding-top:1px;}
  .fk-feedbody{flex:1;min-width:0;}
  .fk-feedhead{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
  .fk-feedtyp{font-size:12.5px;font-weight:600;color:var(--fl-txt);}
  .fk-feedmsg{font-size:12.5px;color:var(--fl-mut);line-height:1.45;white-space:pre-wrap;}
  .fk-hwrap{max-width:900px;}
  .fk-logobox{margin-top:10px;width:420px;max-width:100%;height:220px;border:1px dashed var(--fl-line);border-radius:12px;background:var(--fl-chip);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:22px;box-sizing:border-box;}
  .fk-logobox img{max-width:100%;max-height:100%;object-fit:contain;}
  .fk-logoinit{font-size:52px;font-weight:800;color:var(--fl-acc);}
  .fk-owrap{max-width:1080px;}
  .fk-olist{display:flex;flex-direction:column;gap:10px;}
  .fk-otile{background:var(--fl-card);border:1px solid var(--fl-line);border-radius:12px;padding:14px 16px;}
  .fk-orow{display:flex;align-items:center;gap:18px;}
  .fk-ocell{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;}
  .fk-ocell.grow{flex:1;min-width:0;}
  .fk-ocell .l{font-size:10px;color:var(--fl-mut);text-transform:uppercase;letter-spacing:.4px;}
  .fk-ocell b{font-size:12.5px;color:var(--fl-txt);font-weight:600;}
  .fk-oname{font-size:14px;font-weight:700;color:var(--fl-txt);}
  .fk-osub{font-size:11.5px;color:var(--fl-mut);margin-top:1px;}
  .fk-editbtn.sm{padding:6px 12px;font-size:12px;}
  .fk-oedit .fk-fld input,.fk-oedit .fk-fld select{width:100%;}
  .fk-oedit{margin-top:2px;}
  .fk-rooms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--fl-line);}
  @media(max-width:720px){ .fk-rooms{grid-template-columns:1fr;} }
  .fk-roomlist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;}
  .fk-roomrow{display:flex;align-items:center;gap:10px;background:var(--fl-chip);border:1px solid var(--fl-line);border-radius:8px;padding:8px 12px;}
  .fk-roomname{flex:1;min-width:0;font-size:12.5px;color:var(--fl-txt);}
  .fk-roomsub{color:var(--fl-mut);font-size:11px;}
  .fk-roomdel{background:none;border:1px solid var(--fl-line);color:var(--fl-mut);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600;flex-shrink:0;}
  .fk-roomdel:hover{border-color:var(--fl-err);color:var(--fl-err);}
  .fk-roomempty{font-size:12px;color:var(--fl-mut);padding:4px 2px;}
  .fk-roomadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .fk-roomadd input,.fk-roomadd select{flex:1;min-width:120px;}
  .fk-drow{cursor:pointer;}
  .fk-drow:hover td{background:var(--fl-chip);}
  .fk-dimg{max-width:280px;max-height:200px;border-radius:10px;margin-top:12px;display:block;object-fit:cover;}
  .fk-tradrow{font-size:12.5px;color:var(--fl-txt);padding:8px 0;border-bottom:1px solid var(--fl-line);line-height:1.45;white-space:pre-wrap;}
  .fk-tradrow:last-child{border-bottom:none;}
  .fk-qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px;}
  .fk-qcard{background:var(--fl-card);border:1px solid var(--fl-line);border-radius:12px;overflow:hidden;}
  .fk-qchead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;}
  .fk-qcname{font-size:12.5px;font-weight:700;color:var(--fl-acc);}
  .fk-qcimg{width:100%;height:150px;object-fit:cover;display:block;}
  .fk-qccom{font-size:12px;color:var(--fl-mut);padding:8px 12px;line-height:1.4;}
  .fk-hrowtoggle{cursor:pointer;user-select:none;}
  .fk-caret{margin-left:auto;color:var(--fl-mut);font-size:10px;}
  .fk-hdetail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--fl-line);}
  .fk-hmetagrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;}
  .fk-hmeta{display:flex;flex-direction:column;gap:1px;}
  .fk-hmeta span{font-size:10.5px;color:var(--fl-mut);text-transform:uppercase;letter-spacing:.4px;}
  .fk-hmeta b{font-size:12.5px;color:var(--fl-txt);font-weight:600;}
  .fk-hnote{margin-top:10px;}
  .fk-hnote label{display:block;font-size:10.5px;color:var(--fl-mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
  .fk-hnote div{font-size:12.5px;color:var(--fl-txt);line-height:1.45;white-space:pre-wrap;}
  .fk-hedit{margin-top:12px;padding-top:12px;border-top:1px solid var(--fl-line);}
  .fk-hrow{display:flex;flex-wrap:wrap;gap:12px;}
  .fk-hrow .fk-fld{flex:1;min-width:130px;}
  .fk-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fl-txt);padding-top:7px;cursor:pointer;}
  .fk-chk input{width:auto;}
  .fk-cancel{background:var(--fl-chip);color:var(--fl-mut);border:1px solid var(--fl-line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;font-weight:600;margin-left:8px;}
  .fk-cancel:hover{border-color:var(--fl-acc);}
  .fk-hname{font-size:24px;font-weight:700;line-height:1.1;}
  .fk-hmeta{color:var(--fl-mut);font-size:12px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;}
  .fk-hmeta b{color:var(--fl-txt);font-weight:600;}
  .fk-pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;vertical-align:middle;margin-left:10px;}
  .fk-pill.ok{background:rgba(46,204,113,.16);color:#5fe0a0;}
  .fk-pill.prospect{background:rgba(223,111,57,.16);color:#f0a070;}
  .fk-pill.plain{background:var(--fl-chip);color:var(--fl-mut);}
  .fk-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 4px;}
  .fk-stat{background:var(--fl-card);border:1px solid var(--fl-line);border-radius:12px;padding:12px 14px;}
  .fk-stat .l{color:var(--fl-mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .fk-stat .v{font-size:19px;font-weight:700;margin-top:5px;}
  .fk-stat.acc .v{color:var(--fl-acc);}
  .fk-calc{color:var(--fl-mut);font-size:12px;font-style:italic;opacity:.75;}
  .fk-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:14px 24px 0;border-bottom:1px solid var(--fl-line);}
  .fk-tab{padding:9px 14px;border-radius:9px 9px 0 0;cursor:pointer;font-size:12.5px;color:var(--fl-mut);font-weight:600;border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px;}
  .fk-tab:hover{color:var(--fl-txt);}
  .fk-tab.on{color:var(--fl-txt);background:var(--fl-card);border-color:var(--fl-line);}
  .fk-tab .cnt{background:var(--fl-chip);color:var(--fl-mut);border-radius:20px;font-size:10px;padding:1px 7px;font-weight:700;}
  .fk-tab.on .cnt{background:var(--fl-acc);color:#0f1830;}
  .fk-body{padding:20px 24px 24px;}
  .fk-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;}
  .fk-panel{background:var(--fl-card);border:1px solid var(--fl-line);border-radius:14px;padding:16px 18px;}
  .fk-ph{display:flex;align-items:center;margin-bottom:12px;gap:8px;}
  .fk-ph h3{font-size:14px;font-weight:700;margin:0;}
  .fk-editbtn{margin-left:auto;background:transparent;color:var(--fl-acc);border:1px solid var(--fl-line);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:11.5px;font-weight:600;}
  .fk-kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13px;align-items:baseline;}
  .fk-kv .k{color:var(--fl-mut);white-space:nowrap;}
  .fk-kv .val{color:var(--fl-txt);text-align:right;word-break:normal;}
  .fk-form{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;}
  .fk-fld{display:flex;flex-direction:column;gap:4px;}
  .fk-fld.full{grid-column:1 / -1;}
  .fk-fld label{font-size:11px;color:var(--fl-mut);font-weight:600;}
  .fk-fld input,.fk-fld select,.fk-fld textarea{background:var(--fl-bg);border:1px solid var(--fl-line);color:var(--fl-txt);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;width:100%;}
  .fk-fld input:focus,.fk-fld select:focus,.fk-fld textarea:focus{outline:none;border-color:var(--fl-acc);}
  .fk-fld select option{background:#16223d;}
  .fk-fld textarea{min-height:60px;resize:vertical;}
  .fk-fld .ro{color:var(--fl-mut);font-size:12.5px;padding:7px 0;}
  .fk-formbtns{grid-column:1 / -1;display:flex;gap:9px;margin-top:4px;align-items:center;}
  .fk-formbtns .save{background:var(--fl-acc);color:#0f1830;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:12.5px;font-weight:700;}
  .fk-formbtns .cancel{background:transparent;color:var(--fl-mut);border:1px solid var(--fl-line);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:12.5px;}
  .fk-formbtns .msg{font-size:12px;color:var(--fl-mut);}
  .fk-formbtns .msg.err{color:#ff8080;}
  .fk-note{margin-top:14px;padding:11px 13px;background:var(--fl-bg);border:1px solid var(--fl-line);border-radius:10px;color:var(--fl-mut);font-size:12.5px;line-height:1.5;}
  .fk-note b{color:var(--fl-txt);font-weight:600;display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .fk-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .fk-kc{background:var(--fl-card2);border-radius:12px;padding:13px 15px;}
  .fk-kc .l{color:var(--fl-mut);font-size:11px;font-weight:600;}
  .fk-kc .v{font-size:22px;font-weight:700;margin-top:4px;}
  .fk-kc .v.up{color:var(--fl-ok);}
  .fk-rate{display:flex;flex-direction:column;gap:9px;}
  .fk-rrow{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:12px;}
  .fk-rrow .rl{color:var(--fl-mut);}
  .fk-bar{height:6px;border-radius:4px;background:var(--fl-line);overflow:hidden;}
  .fk-bar i{display:block;height:100%;background:var(--fl-acc);border-radius:4px;}
  .fk-rrow .rv{text-align:right;font-weight:700;}
  .fk-actions{display:flex;gap:9px;flex-wrap:wrap;}
  .fk-act{background:var(--fl-chip);color:var(--fl-txt);border:1px solid var(--fl-line);border-radius:9px;padding:9px 15px;cursor:pointer;font-size:12px;font-weight:600;}
  .fk-act.pri{background:var(--fl-acc);color:#0f1830;border-color:var(--fl-acc);}
  .fk-act:hover{border-color:var(--fl-acc);}
  .fk-sech{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--fl-mut);font-weight:700;margin:2px 0 10px;}
  .fk-placeholder{padding:44px;text-align:center;color:var(--fl-mut);background:var(--fl-card);border:1px dashed var(--fl-line);border-radius:14px;}
  .fk-placeholder b{color:var(--fl-txt);display:block;font-size:15px;margin-bottom:6px;}
  .fk-ltbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .fk-ltbl th{text-align:left;color:var(--fl-mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--fl-line);}
  .fk-ltbl td{padding:9px 10px;border-bottom:1px solid rgba(36,52,86,.5);vertical-align:middle;}
  .fk-ltbl tr:last-child td{border-bottom:none;}

<div class="fl">
  <input type="hidden" data-mira="api_host"       value="https://mira-exchange.onrender.com">
  <input type="hidden" data-mira="planning_token" value="SÄTT_SAMMA_SOM_PLANNING_ADMIN_TOKEN">
  <input type="hidden" data-mira="user_company"   value=""><!-- bind till Current User's Company's unique id (för personal-dropdown i Leverantörer) -->
  <input type="hidden" data-mira="user_name"      value=""><!-- bind till Current User's namn (signerar drift-kommentarer) -->

  <div data-fl="listview">
    <div class="fl-head">
      <h1>Företag</h1>
      <span class="fl-count" data-fl="count"></span>
      <button class="fl-refresh" data-fl="refresh">↻ Uppdatera</button>
    </div>
    <div class="fl-filters" data-fl="filters"></div>
    <div data-fl="body"><div class="fl-msg">Laddar…</div></div>
  </div>
  <div data-fl="cardview" style="display:none"></div>
</div>

<script>
(function(){
  "use strict";
  var all=document.querySelectorAll(".fl"),root=null;
  for(var i=0;i<all.length;i++){ if(!all[i].getAttribute("data-fl-claimed")){ root=all[i]; break; } }
  if(!root) return; root.setAttribute("data-fl-claimed","1");

  var $=function(k){ return root.querySelector('[data-fl="'+k+'"]'); };
  var cfg=function(k){ var el=root.querySelector('[data-mira="'+k+'"]'); return (el&&el.value)||""; };
  var HOST=cfg("api_host").replace(/\/+$/,""), TOKEN=cfg("planning_token");

  var COLS=[
    {key:"name",       label:"Företagsnamn", sort:"name",       edit:null,         kind:"name"},
    {key:"group",      label:"Grupp",        sort:"group",      edit:"group",      kind:"groupref"},
    {key:"kundstatus", label:"Kundstatus",   sort:"kundstatus", edit:"kundstatus", kind:"status"},
    {key:"orgnr",      label:"Org nr",       sort:"orgnr",      edit:"orgnr",      kind:"text"},
    {key:"bransch",    label:"Bransch",      sort:"bransch",    edit:"bransch",    kind:"optionset"},
    {key:"ansvarig",   label:"Ansvarig",     sort:"ansvarig",   edit:"ansvarig",   kind:"userref"},
    {key:"potential",  label:"Potential",    sort:"potential",  edit:"potential",  kind:"optionset"},
    {key:"lojalitet",  label:"Lojalitet",    sort:"lojalitet",  edit:"lojalitet",  kind:"loyalty"},
    {key:"nki",        label:"NKI",          sort:"nki",        edit:"nki",        kind:"number", num:true},
    {key:"oms_now",    label:"Omsättning",   sort:"oms_now",    edit:null,         kind:"kr",     num:true, yearlbl:"now"},
    {key:"oms_prev",   label:"Omsättning",   sort:"oms_prev",   edit:null,         kind:"kr",     num:true, yearlbl:"prev"}
  ];
  var FACET_OF={kundstatus:"kundstatus", potential:"potential", lojalitet:"lojalitet", bransch:"bransch", region:"region", customer_type:"customer_type"};

  var STATE={ view:"list", q:"", sort:"name", dir:"asc", page:1, limit:100,
              rows:[], total:0, pages:1, year:0, prev:0, meta:null,
              revenue_ready:true, revTries:0, listDirty:false,
              f:{ansvarig:"", kundstatus:"", lojalitet:"", potential:"", region:"", fastighet:""},
              cardId:null, card:null, cardTab:"hem", cardEditing:false, cardRevTries:0, chain:{}, coworkers:null, avtalSub:"avtal", newPerson:false, personDetail:null, personTab:"profil", personActs:null, coworkerOffices:[], coworkerDepartments:[], histOpen:null, histNew:false,
              setupSub:"kontor", offices:null, officeMeta:{fastigheter:[],coworkers:[]}, officeNew:false, officeEdit:null, officeRooms:null, setupLev:null, setupHv:null,
              driftSub:"arenden", matters:null, qcList:null, matterOpen:null, matterDetail:null, qcOpen:null, qcDetail:null };
  var _deb=null, _prog=null, _revTimer=null, _cardRevTimer=null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function kr(n){ if(n==null) return '<span class="fl-edit fl-empty">—</span>'; return esc(Math.round(n).toLocaleString("sv-SE")); }
  function krc(n){ if(n==null) return "—"; return Math.round(n).toLocaleString("sv-SE")+" kr"; }
  function numc(n){ if(n==null) return "—"; return Number(n).toLocaleString("sv-SE"); }
  function initials(nm){ nm=String(nm||"").trim(); if(!nm) return "?"; var w=nm.split(/\s+/); if(w.length>1) return (w[0][0]+w[1][0]).toUpperCase(); return nm.slice(0,2).toUpperCase(); }
  function avatarInner(c){ return c&&c.foto?('<img src="'+esc(c.foto)+'" alt="">'):esc(initials(c&&c.name)); }
  // Telefon: number-fältet i Bubble tappar inledande 0 → återlägg + formatera xxx-xxx xx xx (10 siffror).
  function formatPhone(v){ var d=String(v==null?"":v).replace(/\D/g,""); if(!d) return "—"; if(d.charAt(0)!=="0") d="0"+d; if(d.length===10) return d.slice(0,3)+"-"+d.slice(3,6)+" "+d.slice(6,8)+" "+d.slice(8,10); return d; }

  function progHtml(pct){
    return '<div class="fl-loading"><div class="fl-lbar"><div class="fl-lfill" style="width:'+pct+'%"></div></div>'+
      '<div class="fl-lpct">'+Math.round(pct)+'%</div>'+
      '<div class="fl-lmsg">Hämtar företag & omsättning…</div>'+
      '<div class="fl-lsub">Första laddningen värmer upp datan (5 400+ företag + fakturahistorik) och kan ta upp till en minut. Därefter går det snabbt — datan hålls varm i bakgrunden.</div></div>';
  }
  function startProg(){
    if(_prog) return; var pct=6; $("body").innerHTML=progHtml(pct);
    _prog=setInterval(function(){ pct += (92-pct)*0.08; var f=root.querySelector(".fl-lfill"), p=root.querySelector(".fl-lpct"); if(f) f.style.width=pct+"%"; if(p) p.textContent=Math.round(pct)+"%"; }, 600);
  }
  function stopProg(){ if(_prog){ clearInterval(_prog); _prog=null; } }

  function ckey(){ return "fl:list:"+JSON.stringify({q:STATE.q,sort:STATE.sort,dir:STATE.dir,page:STATE.page,limit:STATE.limit,f:STATE.f}); }
  function cacheGet(k){ try{ var v=sessionStorage.getItem(k); if(!v) return null; var o=JSON.parse(v); if(!o||(Date.now()-o.t)>900000) return null; return o.d; }catch(e){ return null; } }
  function cacheSet(k,d){ try{ sessionStorage.setItem(k,JSON.stringify({t:Date.now(),d:d})); }catch(e){} }
  function cacheClearAll(){ try{ for(var i=sessionStorage.length-1;i>=0;i--){ var k=sessionStorage.key(i); if(k&&k.indexOf("fl:")===0) sessionStorage.removeItem(k); } }catch(e){} }

  function qstr(){
    var p=["q="+encodeURIComponent(STATE.q),"sort="+STATE.sort,"dir="+STATE.dir,"page="+STATE.page,"limit="+STATE.limit];
    var f=STATE.f; for(var k in f){ if(f[k]) p.push(k+"="+encodeURIComponent(f[k])); }
    return "/admin/companies/list?"+p.join("&");
  }
  function api(path){ return fetch(HOST+path,{headers:{"x-admin-token":TOKEN}}).then(function(r){ return r.json(); }); }
  function apiPatch(id, fields){ return fetch(HOST+"/admin/companies/"+encodeURIComponent(id),{method:"PATCH",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({fields:fields})}).then(function(r){ return r.json(); }); }
  function apiPost(path, body){ return fetch(HOST+path,{method:"POST",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(body||{})}).then(function(r){ return r.json(); }); }
  function apiCoworkerPatch(id, fields){ return fetch(HOST+"/admin/companies/coworker/"+encodeURIComponent(id),{method:"PATCH",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({fields:fields})}).then(function(r){ return r.json(); }); }

  // ── FILTERBAR ──
  function selOpts(list, cur, allLabel){
    var h='<option value="">'+esc(allLabel)+'</option>';
    for(var i=0;i<list.length;i++){ var it=list[i], v=it.id!==undefined?it.id:it, nm=it.name!==undefined?it.name:it;
      h+='<option value="'+esc(v)+'"'+(String(v)===String(cur)?" selected":"")+'>'+esc(nm)+'</option>'; }
    return h;
  }
  function renderFilters(){
    var m=STATE.meta; if(!m) return;
    var fac=m.facets||{};
    var h='<input class="fl-search" data-fl="q" type="text" placeholder="Sök företagsnamn / org.nr" value="'+esc(STATE.q)+'">';
    h+='<select class="fl-sel" data-flf="ansvarig">'+selOpts(m.users||[], STATE.f.ansvarig, "Alla kundansvariga")+'</select>';
    h+='<select class="fl-sel" data-flf="kundstatus">'+selOpts(fac.kundstatus||[], STATE.f.kundstatus, "Alla kundstatus")+'</select>';
    h+='<select class="fl-sel" data-flf="lojalitet">'+selOpts(fac.lojalitet||[], STATE.f.lojalitet, "All lojalitet")+'</select>';
    h+='<select class="fl-sel" data-flf="potential">'+selOpts(fac.potential||[], STATE.f.potential, "All potential")+'</select>';
    h+='<select class="fl-sel" data-flf="region">'+selOpts(fac.region||[], STATE.f.region, "Alla regioner")+'</select>';
    h+='<select class="fl-sel" data-flf="fastighet">'+selOpts(m.fastigheter||[], STATE.f.fastighet, "Alla fastigheter")+'</select>';
    h+='<button class="fl-clear" data-fl="clear">Rensa</button>';
    $("filters").innerHTML=h;
  }

  // ── TABELL ──
  function th(c){
    var lbl=esc(c.label); if(c.yearlbl==="now") lbl="Omsättning "+STATE.year; if(c.yearlbl==="prev") lbl="Omsättning "+STATE.prev;
    var cls="fl-sortable"+(c.num?" fl-num":"");
    var arr=""; if(STATE.sort===c.sort) arr='<span class="fl-arr">'+(STATE.dir==="asc"?"▲":"▼")+'</span>';
    return '<th class="'+cls+'" data-sort="'+esc(c.sort)+'">'+lbl+arr+'</th>';
  }
  function statusPill(v){
    if(!v) return '<span class="fl-edit fl-empty">—</span>';
    var cls="fl-plain"; var lv=v.toLowerCase();
    if(lv.indexOf("aktiv")>-1) cls="fl-active"; else if(lv.indexOf("prospekt")>-1) cls="fl-prospect";
    return '<span class="fl-pill '+cls+'">'+esc(v)+'</span>';
  }
  function loyaltyCell(v){ if(!v) return '<span class="fl-edit fl-empty">—</span>'; return '<span class="fl-star">★</span> '+esc(v); }
  function cellHtml(c, r){
    if(c.kind==="name")     return '<span class="fl-name fl-open" data-flopen="'+esc(r.id)+'">'+esc(r.name||"—")+'</span>';
    if(c.kind==="kr"){ if(!STATE.revenue_ready) return '<span class="fl-calc">beräknar…</span>'; return kr(c.key==="oms_now"?r.oms_now:r.oms_prev); }
    if(c.kind==="status")   return statusPill(r.kundstatus);
    if(c.kind==="loyalty")  return loyaltyCell(r.lojalitet);
    if(c.kind==="userref")  return r.ansvarig?esc(r.ansvarig):'<span class="fl-edit fl-empty">—</span>';
    if(c.kind==="groupref") return r.group?esc(r.group):'<span class="fl-edit fl-empty">—</span>';
    if(c.kind==="number"){ var nv=r[c.key]; return nv==null?'<span class="fl-edit fl-empty">—</span>':esc(nv); }
    var val=r[c.key]; return (val===""||val==null)?'<span class="fl-edit fl-empty">—</span>':esc(val);
  }
  function tdOf(c, r){
    var inner=cellHtml(c, r);
    var editable=!!c.edit;
    var cls=(c.num?"fl-num ":"")+(editable?"fl-ecell ":"");
    var attrs=editable?(' data-flcell="1" data-field="'+esc(c.edit)+'" data-kind="'+esc(c.kind)+'"'):"";
    return '<td class="'+cls.trim()+'"'+attrs+'>'+inner+'</td>';
  }
  function rowInner(r){ var h=""; for(var i=0;i<COLS.length;i++) h+=tdOf(COLS[i], r); return h; }
  function renderTable(){
    var head=""; for(var i=0;i<COLS.length;i++) head+=th(COLS[i]);
    var body="";
    for(var j=0;j<STATE.rows.length;j++){ var r=STATE.rows[j]; body+='<tr data-id="'+esc(r.id)+'">'+rowInner(r)+'</tr>'; }
    var more="";
    if(STATE.rows.length<STATE.total) more='<div class="fl-more"><button data-fl="more">Visa fler ('+STATE.rows.length+'/'+STATE.total+')</button></div>';
    var banner=STATE.revenue_ready?"":'<div class="fl-revbanner"><span class="fl-dot"></span>Beräknar omsättning ur fakturahistoriken — kolumnerna fylls i om en stund.</div>';
    var html='<div class="fl-wrap"><table class="fl-tbl"><thead><tr>'+head+'</tr></thead><tbody>'+
             (body||'<tr><td colspan="'+COLS.length+'"><div class="fl-msg">Inga företag matchar.</div></td></tr>')+
             '</tbody></table></div>'+banner+more;
    $("body").innerHTML=html;
    $("count").textContent=STATE.total+" företag";
  }

  // ── INLINE-EDIT (lista) ──
  function optsFor(kind, field, cur){
    var m=STATE.meta;
    if(kind==="userref") return selOpts(m.users||[], cur, "— ingen —");
    if(kind==="groupref") return selOpts(m.groups||[], cur, "— ingen —");
    var fk=FACET_OF[field]; var list=(m.facets&&m.facets[fk])||[];
    return selOpts(list, cur, "— tom —");
  }
  function findRow(id){ for(var i=0;i<STATE.rows.length;i++) if(STATE.rows[i].id===id) return STATE.rows[i]; return null; }
  function curValFor(r, field, kind){
    if(kind==="userref") return r.ansvarig_id||"";
    if(kind==="groupref") return r.group_id||"";
    return r[field]==null?"":r[field];
  }
  function beginEdit(td){
    if(td.getAttribute("data-editing")) return;
    var tr=td.parentNode, id=tr.getAttribute("data-id"), field=td.getAttribute("data-field"), kind=td.getAttribute("data-kind");
    var r=findRow(id); if(!r) return;
    td.setAttribute("data-editing","1");
    td.setAttribute("data-orig", td.innerHTML);
    var cur=curValFor(r, field, kind), ctrl;
    if(kind==="text"){ ctrl='<input class="fl-ec" type="text" value="'+esc(cur)+'">'; }
    else if(kind==="number"){ ctrl='<input class="fl-ec" type="number" value="'+esc(cur)+'">'; }
    else { ctrl='<select class="fl-ec">'+optsFor(kind, field, cur)+'</select>'; }
    td.innerHTML=ctrl+'<span class="fl-save" data-flsavemsg></span>';
    var el=td.querySelector(".fl-ec"); if(el){ el.focus(); if(el.select) try{el.select();}catch(e){} }
    var isSelect=(kind!=="text"&&kind!=="number");
    if(isSelect){ el.addEventListener("change", function(){ commitEdit(td, el.value); }); }
    el.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ commitEdit(td, el.value); } else if(ev.key==="Escape"){ cancelEdit(td); } });
    el.addEventListener("blur", function(){ if(!isSelect) commitEdit(td, el.value); });
  }
  function cancelEdit(td){ var o=td.getAttribute("data-orig"); td.removeAttribute("data-editing"); td.removeAttribute("data-orig"); if(o!=null) td.innerHTML=o; }
  function commitEdit(td, value){
    if(td.getAttribute("data-committing")) return; td.setAttribute("data-committing","1");
    var tr=td.parentNode, id=tr.getAttribute("data-id"), field=td.getAttribute("data-field"), kind=td.getAttribute("data-kind");
    var r=findRow(id); var prev=curValFor(r, field, kind);
    if(String(value)===String(prev)){ td.removeAttribute("data-committing"); cancelEdit(td); return; }
    var msg=td.querySelector("[data-flsavemsg]"); if(msg){ msg.textContent="Sparar…"; msg.className="fl-save"; }
    var fields={}; fields[field]=value;
    apiPatch(id, fields).then(function(j){
      td.removeAttribute("data-committing");
      if(!j||!j.ok){ if(msg){ msg.textContent="✗ "+((j&&(j.error||""))||"fel"); msg.className="fl-save fl-errc"; } setTimeout(function(){ cancelEdit(td); }, 2200); return; }
      if(j.row){ for(var i=0;i<STATE.rows.length;i++){ if(STATE.rows[i].id===id){ STATE.rows[i]=j.row; break; } } }
      cacheClearAll();
      td.removeAttribute("data-editing"); td.removeAttribute("data-orig");
      var nr=findRow(id); if(nr && tr){ tr.innerHTML=rowInner(nr); }
    }).catch(function(){
      td.removeAttribute("data-committing");
      if(msg){ msg.textContent="✗ nätverksfel"; msg.className="fl-save fl-errc"; }
      setTimeout(function(){ cancelEdit(td); }, 2200);
    });
  }

  // ── LADDNING (lista) ──
  function applyResp(j, append){
    if(!j||!j.ok) return false;
    STATE.total=j.total; STATE.pages=j.pages; STATE.year=j.year; STATE.prev=j.prev;
    STATE.revenue_ready=(j.revenue_ready!==false);
    if(j.meta) STATE.meta=j.meta;
    if(append) STATE.rows=STATE.rows.concat(j.rows||[]); else STATE.rows=j.rows||[];
    return true;
  }
  function scheduleRevenueRefetch(){
    if(_revTimer){ clearTimeout(_revTimer); _revTimer=null; }
    if(STATE.revenue_ready || STATE.revTries>20 || STATE.view!=="list") return;
    _revTimer=setTimeout(function(){ STATE.revTries++;
      api(qstr()).then(function(j){ if(applyResp(j,false)){ cacheSet(ckey(),j); if(STATE.view==="list") renderTable(); scheduleRevenueRefetch(); } });
    }, Math.min(4000+STATE.revTries*1000, 12000));
  }
  function load(append){
    var path=qstr(), key=ckey(), painted=false;
    if(!append){
      var cached=cacheGet(key);
      if(cached && applyResp(cached, false)){ if(!$("filters").innerHTML) renderFilters(); renderTable(); painted=true; }
    }
    if(!append && !painted) startProg();
    api(path).then(function(j){
      stopProg();
      if(!applyResp(j, append)){ if(!STATE.rows.length) $("body").innerHTML='<div class="fl-err">Kunde inte ladda: '+esc((j&&j.error)||"okänt fel")+'</div>'; return; }
      cacheSet(key, j);
      if(STATE.meta && !$("filters").innerHTML) renderFilters();
      if(STATE.view==="list") renderTable();
      if(!append){ STATE.revTries=0; scheduleRevenueRefetch(); }
    }).catch(function(){ stopProg(); if(!STATE.rows.length) $("body").innerHTML='<div class="fl-err">Nätverksfel — kontrollera api_host/token.</div>'; });
  }
  function reload(){ STATE.page=1; load(false); }

  // ══════════════ KORT-VY ══════════════
  var FIELDS=[
    {k:"kundstatus",lbl:"Kundstatus",t:"optionset",facet:"kundstatus"},
    {k:"potential",lbl:"Potential",t:"optionset",facet:"potential"},
    {k:"lojalitet",lbl:"Lojalitet",t:"optionset",facet:"lojalitet"},
    {k:"ansvarig",lbl:"Kundansvarig",t:"userref"},
    {k:"bransch",lbl:"Bransch",t:"optionset",facet:"bransch"},
    {k:"group",lbl:"Kundgrupp",t:"groupref"},
    {k:"orgnr",lbl:"Org.nr",t:"text"},
    {k:"region",lbl:"Region",t:"optionset",facet:"region"},
    {k:"adress",lbl:"Adress",t:"ro"},
    {k:"email",lbl:"E-post",t:"text"},
    {k:"telefon",lbl:"Telefon",t:"number"},
    {k:"web",lbl:"Web",t:"text"},
    {k:"grundat",lbl:"Grundat",t:"ro"},
    {k:"antal_medarbetare",lbl:"Medarbetare",t:"ro"}
  ];
  var TABS=[
    {k:"hem",lbl:"Hem"},{k:"personer",lbl:"Personer"},{k:"historik",lbl:"Historik"},
    {k:"deals",lbl:"Deals"},{k:"leads",lbl:"Leads"},{k:"offerter",lbl:"Offerter"},
    {k:"ordrar",lbl:"Ordrar"},{k:"fakturor",lbl:"Fakturor"},{k:"avtal",lbl:"Avtal"},
    {k:"drift",lbl:"Drift"},{k:"installningar",lbl:"Inställningar"}
  ];
  var CHAIN_TABS={deals:1,leads:1,offerter:1,ordrar:1,fakturor:1};
  var TAB_SRC={personer:"Coworker (company = koncernens bolag) · User-badge + lösenordsikon",historik:"activity_crm för företaget",
    deals:"deals för företaget (reverse-lookup)",leads:"leads för företaget",offerter:"offerter för företaget",

  // Komprimerar en vald bild client-side (max 512px, jpeg) → Blob, för att hålla uppladdningen liten.
  function compressImage(file, cb){
    try{
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){
        var mx=512, w=img.width, h=img.height;
        if(w>h){ if(w>mx){ h=Math.round(h*mx/w); w=mx; } } else { if(h>mx){ w=Math.round(w*mx/h); h=mx; } }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){ cb(b||file); }, "image/jpeg", 0.82);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); cb(file); };
      img.src=url;
    }catch(_){ cb(file); }
  }

      '<div class="fk-sech">Företagslogotyp</div>'+
      '<div class="fk-logobox">'+preview+'</div>'+
      '<div class="fk-photobtns" style="flex-direction:row;margin-top:14px">'+
        '<button data-fk="logopick">'+(lg?"Byt logotyp":"Ladda upp logotyp")+'</button>'+
        (lg?'<button class="del" data-fk="logodel">Ta bort</button>':'')+
      '</div>'+
      '<input type="file" accept="image/*" data-fk="logofile" style="display:none">'+
      '<div class="fk-photomsg" data-logomsg></div>'+
    '</div></div>';
  }
  function levSection(title, kind, items, available, addLbl){
    var rows="";
    for(var i=0;i<items.length;i++){ var it=items[i];
      var sub=(kind==="supplier")?(it.category||""):(it.email||"");
      rows+='<div class="fk-roomrow"><span class="fk-roomname">'+esc(it.name||"—")+(sub?' <span class="fk-roomsub">'+esc(sub)+'</span>':'')+'</span>'+
        '<button class="fk-roomdel" data-fk="levdel" data-kind="'+kind+'" data-id="'+esc(it.id)+'">Ta bort</button></div>';
    }
    if(!items.length) rows='<div class="fk-roomempty">Inget kopplat ännu.</div>';
    var opts='<option value="">'+esc(addLbl)+'</option>';
    for(var j=0;j<available.length;j++){ var a=available[j]; var al=a.name+((kind==="supplier"&&a.category)?(" · "+a.category):""); opts+='<option value="'+esc(a.id)+'">'+esc(al)+'</option>'; }
    return '<div class="fk-roomsec"><div class="fk-sech">'+esc(title)+'</div><div class="fk-roomlist">'+rows+'</div>'+
      '<div class="fk-roomadd"><select data-levadd="'+kind+'">'+opts+'</select><button class="fk-editbtn sm" data-fk="levaddbtn" data-kind="'+kind+'">Lägg till</button><span class="msg" data-levmsg="'+kind+'"></span></div></div>';
  }
  function leverantorerBody(){
    if(STATE.setupLev===null){ fetchLeverantorer(); return '<div class="fk-owrap"><div class="fl-msg">Laddar…</div></div>'; }
    if(STATE.setupLev==="loading") return '<div class="fk-owrap"><div class="fl-msg">Laddar…</div></div>';
    var L=STATE.setupLev, noUC=(cfg("user_company")==="");
    return '<div class="fk-owrap"><div class="fk-rooms">'+
      levSection("Våra dotterbolag","supplier",L.suppliers||[],L.available||[],"Lägg till leverantör…")+
      levSection("Vår personal","staff",L.personnel||[],L.personnel_available||[],"Lägg till Carotte-personal…")+
    '</div>'+
      (noUC?'<div class="fl-lsub" style="margin-top:10px">Personal-dropdownen är tom tills <b style="display:inline">data-mira="user_company"</b> binds till Current User\'s Company i Bubble.</div>':'')+
    '</div>';
  }
  function fastighetsagareBody(){
    if(STATE.setupHv===null){ fetchFastighetsagare(); return '<div class="fk-owrap"><div class="fl-msg">Laddar…</div></div>'; }
    if(STATE.setupHv==="loading") return '<div class="fk-owrap"><div class="fl-msg">Laddar…</div></div>';
    var H=STATE.setupHv;
    return '<div class="fk-owrap">'+
      '<div class="fl-lsub" style="margin:0 0 12px">Knyt företaget som hyresgäst till en eller flera fastighetsägare — styr t.ex. vilka erbjudanden som visas för deras hyresgäster.</div>'+
      levSection("Fastighetsägare","landlord",H.landlords||[],H.available||[],"Lägg till fastighetsägare…")+
    '</div>';
  }
  function roomList(title, type, rooms, ph){
    var items="";
    for(var i=0;i<rooms.length;i++){ var r=rooms[i];
      items+='<div class="fk-roomrow"><span class="fk-roomname">'+esc(r.name||"—")+(r.email?' <span class="fk-roomsub">'+esc(r.email)+'</span>':'')+'</span>'+
        '<button class="fk-roomdel" data-fk="roomdel" data-type="'+type+'" data-id="'+esc(r.id)+'">Radera</button></div>';
    }
    if(!rooms.length) items='<div class="fk-roomempty">Inga rum ännu.</div>';
    return '<div class="fk-roomsec"><div class="fk-sech">'+esc(title)+'</div><div class="fk-roomlist">'+items+'</div>'+
      '<div class="fk-roomadd"><input type="text" data-roomadd="'+type+'" placeholder="'+esc(ph)+'"><button class="fk-editbtn sm" data-fk="roomadd" data-type="'+type+'">Lägg till</button><span class="msg" data-roommsg="'+type+'"></span></div></div>';
  }
  function roomsSection(o){
    if(STATE.officeRooms===null){ fetchOfficeRooms(o.id); return '<div class="fk-rooms"><div class="fl-msg">Laddar rum…</div></div>'; }
    if(STATE.officeRooms==="loading") return '<div class="fk-rooms"><div class="fl-msg">Laddar rum…</div></div>';
    var R=STATE.officeRooms;
    return '<div class="fk-rooms">'+
      roomList("Mötesrum","meeting",R.meetingrooms||[],"Namn på mötesrummet")+
      roomList("Interna lokaler","internal",R.internals||[],"T ex Pentry")+
    '</div>';
  }
  function kontorBody(){
    if(STATE.offices===null){ fetchOffices(); return '<div class="fk-hwrap"><div class="fl-msg">Laddar kontor…</div></div>'; }
    if(STATE.offices==="loading") return '<div class="fk-hwrap"><div class="fl-msg">Laddar kontor…</div></div>';
    var rows=STATE.offices;
    var head='<div style="display:flex;justify-content:flex-end;margin:0 0 12px"><button class="fk-editbtn" data-fk="officenew">+ Nytt kontor</button></div>'+
      (STATE.officeNew?'<div class="fk-panel" style="margin:0 0 12px;padding:14px 16px"><div class="fk-ph"><h3>Nytt kontor</h3></div>'+officeForm(null)+'</div>':'');
    if(!rows.length) return '<div class="fk-owrap">'+head+'<div class="fk-placeholder"><b>Inga kontor</b>Lägg till företagets första kontor med "+ Nytt kontor".</div></div>';
    var body="";
    for(var i=0;i<rows.length;i++){ var o=rows[i];
      var ans=(o.ansvariga||[]).map(function(a){return a.name;}).join(", ")||"—";
      if(STATE.officeEdit===o.id){
        body+='<div class="fk-otile"><div class="fk-ph" style="margin:0 0 4px"><h3>Redigera '+esc(o.name||"kontor")+'</h3></div>'+officeForm(o)+roomsSection(o)+'</div>';
      } else {
        body+='<div class="fk-otile"><div class="fk-orow">'+
          '<div class="fk-ocell grow"><div class="fk-oname">'+esc(o.name||"—")+'</div><div class="fk-osub">'+esc(o.fastighet||"— ingen fastighet —")+(o.adress?(" · "+esc(o.adress)):"")+'</div></div>'+
          '<div class="fk-ocell"><span class="l">Ansvarig</span><b>'+esc(ans)+'</b></div>'+
          '<div class="fk-ocell"><span class="l">Yta</span><b>'+(o.yta==null?"—":esc(String(o.yta))+" kvm")+'</b></div>'+
          '<div class="fk-ocell"><span class="l">Arbetsplatser</span><b>'+(o.arbetsplatser==null?"—":esc(String(o.arbetsplatser)))+'</b></div>'+
          '<div class="fk-ocell"><span class="l">Rum</span><b>'+esc(String((o.motesrum||0)+(o.intern||0)))+'</b></div>'+
          '<button class="fk-editbtn sm" data-fk="officeedit" data-id="'+esc(o.id)+'">Redigera</button>'+
        '</div></div>';
      }
    }
    return '<div class="fk-owrap">'+head+'<div class="fk-olist">'+body+'</div></div>';
  }
  function renderCard(){
    if(!STATE.card){ $("cardview").innerHTML='<button class="fk-back" data-fk="back">← Företagslistan</button><div class="fl-msg">Laddar kundkort…</div>'; return; }
    $("cardview").innerHTML='<button class="fk-back" data-fk="back">← Företagslistan</button>'+
      '<div class="fk-card">'+cardHero()+cardTabs()+cardBody()+'</div>';
  }

  function cardKey(id){ return "fl:card:"+id; }
  function scheduleCardRev(){
    if(_cardRevTimer){ clearTimeout(_cardRevTimer); _cardRevTimer=null; }
    if(!STATE.card || STATE.card.revenue_ready || STATE.cardRevTries>20 || STATE.view!=="card") return;
    _cardRevTimer=setTimeout(function(){ STATE.cardRevTries++;
      api("/admin/companies/"+encodeURIComponent(STATE.cardId)+"/card").then(function(j){ if(j&&j.ok){ STATE.card=j; cacheSet(cardKey(STATE.cardId),j); if(STATE.view==="card"&&!STATE.cardEditing) renderCard(); scheduleCardRev(); } });
    }, Math.min(4000+STATE.cardRevTries*1000,12000));
  }
  function openCard(id){
    STATE.view="card"; STATE.cardId=id; STATE.cardTab="hem"; STATE.cardEditing=false; STATE.cardRevTries=0; STATE.chain={}; STATE.coworkers=null; STATE.newPerson=false; STATE.personDetail=null; STATE.personTab="profil"; STATE.personActs=null; STATE.histOpen=null; STATE.histNew=false; STATE.setupSub="kontor"; STATE.offices=null; STATE.officeMeta={fastigheter:[],coworkers:[]}; STATE.officeNew=false; STATE.officeEdit=null; STATE.officeRooms=null; STATE.setupLev=null; STATE.setupHv=null;
    STATE.driftSub="arenden"; STATE.matters=null; STATE.qcList=null; STATE.matterOpen=null; STATE.matterDetail=null; STATE.qcOpen=null; STATE.qcDetail=null;
    var cached=cacheGet(cardKey(id)); STATE.card=cached||null;
    $("listview").style.display="none"; $("cardview").style.display="";
    renderCard();
    api("/admin/companies/"+encodeURIComponent(id)+"/card").then(function(j){
      if(!j||!j.ok){ if(!STATE.card) $("cardview").innerHTML='<button class="fk-back" data-fk="back">← Företagslistan</button><div class="fl-err">Kunde inte ladda kundkort: '+esc((j&&j.error)||"okänt fel")+'</div>'; return; }
      STATE.card=j; cacheSet(cardKey(id),j);
      if(STATE.view==="card"&&!STATE.cardEditing) renderCard();
      scheduleCardRev();
    }).catch(function(){ if(!STATE.card) $("cardview").innerHTML='<button class="fk-back" data-fk="back">← Företagslistan</button><div class="fl-err">Nätverksfel.</div>'; });
  }
  function closeCard(){
    STATE.view="list"; STATE.cardEditing=false;
    $("cardview").style.display="none"; $("cardview").innerHTML=""; $("listview").style.display="";
    if(STATE.listDirty){ STATE.listDirty=false; cacheClearAll(); reload(); }   // reflektera kort-redigering i listan
    else { renderTable(); scheduleRevenueRefetch(); }
  }
  function cardSave(){
    var c=STATE.card.company, form=root.querySelector(".fk-form"), fields={};
    var els=form.querySelectorAll("[data-f]");
    for(var i=0;i<els.length;i++){ var el=els[i], key=el.getAttribute("data-f"), val=el.value, orig;
      if(key==="ansvarig") orig=c.ansvarig_id||""; else if(key==="group") orig=c.group_id||""; else orig=c[key]==null?"":String(c[key]);
      if(String(val)!==String(orig)) fields[key]=val;
    }
    var msg=root.querySelector('[data-fk="savemsg"]');
    if(!Object.keys(fields).length){ STATE.cardEditing=false; renderCard(); return; }
    msg.textContent="Sparar…"; msg.className="msg";
    apiPatch(STATE.cardId, fields).then(function(j){
      if(!j||!j.ok){ msg.textContent="✗ "+((j&&j.error)||"fel"); msg.className="msg err"; return; }
      STATE.listDirty=true;
      api("/admin/companies/"+encodeURIComponent(STATE.cardId)+"/card").then(function(cj){ if(cj&&cj.ok){ STATE.card=cj; cacheSet(cardKey(STATE.cardId),cj); } STATE.cardEditing=false; renderCard(); });
    }).catch(function(){ msg.textContent="✗ nätverksfel"; msg.className="msg err"; });
  }

  // ── EVENTS (delegation på root) ──
  root.addEventListener("click", function(e){
    var t=e.target;
    // KORT-vy
    if(STATE.view==="card"){
      if(t.closest && t.closest('[data-fk="back"]')){ closeCard(); return; }
      var ctab=t.closest?t.closest('[data-fk="tab"]'):null;
      if(ctab){ STATE.cardTab=ctab.getAttribute("data-t"); STATE.cardEditing=false; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="edit"]')){ STATE.cardEditing=true; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="canceledit"]')){ STATE.cardEditing=false; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="save"]')){ cardSave(); return; }
      var pw=t.closest?t.closest('[data-fk="pw"]'):null;
      if(pw){ sendPw(pw.getAttribute("data-cid"), pw); return; }
      if(t.closest && t.closest('[data-fk="newperson"]')){ STATE.newPerson=!STATE.newPerson; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="cancelperson"]')){ STATE.newPerson=false; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="saveperson"]')){ savePerson(); return; }
      var ca=t.closest?t.closest('[data-fk="createaccount"]'):null;
      if(ca){ createAccount(ca.getAttribute("data-cid"), ca); return; }
      var op=t.closest?t.closest('[data-fk="openperson"]'):null;
      if(op){ STATE.personDetail=op.getAttribute("data-cid"); STATE.personTab="profil"; STATE.personActs=null; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="backperson"]')){ STATE.personDetail=null; renderCard(); return; }
      var ptb=t.closest?t.closest('[data-fk="ptab"]'):null;
      if(ptb){ STATE.personTab=ptb.getAttribute("data-p"); renderCard(); return; }
      if(t.closest && t.closest('[data-fk="savecoworker"]')){ saveCoworker(); return; }
      if(t.closest && t.closest('[data-fk="photopick"]')){ var fi=root.querySelector('[data-fk="photofile"]'); if(fi) fi.click(); return; }
      if(t.closest && t.closest('[data-fk="photodel"]')){ removePhoto(); return; }
      var hsave=t.closest?t.closest('[data-fk="histsave"]'):null;
      if(hsave){ var hb=hsave.closest(".fk-hedit"); if(hb) saveHist(hb); return; }
      var hcre=t.closest?t.closest('[data-fk="histcreate"]'):null;
      if(hcre){ var hb2=hcre.closest(".fk-hedit"); if(hb2) createHist(hb2); return; }
      if(t.closest && t.closest('[data-fk="qa-aktivitet"]')){ STATE.cardTab="historik"; STATE.histNew=true; STATE.histOpen=null; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="qa-kontakt"]')){ STATE.cardTab="personer"; STATE.personDetail=null; STATE.newPerson=true; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="histnew"]')){ STATE.histNew=!STATE.histNew; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="histnewcancel"]')){ STATE.histNew=false; renderCard(); return; }
      var hrow=t.closest?t.closest('[data-fk="histrow"]'):null;
      if(hrow){ var rid=hrow.getAttribute("data-id"); STATE.histOpen=(STATE.histOpen===rid?null:rid); renderCard(); return; }
      var dsub=t.closest?t.closest('[data-fk="driftsub"]'):null;
      if(dsub){ STATE.driftSub=dsub.getAttribute("data-s"); STATE.matterOpen=null; STATE.qcOpen=null; renderCard(); return; }
      var mop=t.closest?t.closest('[data-fk="matteropen"]'):null;
      if(mop){ STATE.matterOpen=mop.getAttribute("data-id"); STATE.matterDetail=null; fetchMatterDetail(STATE.matterOpen); renderCard(); return; }
      var qop=t.closest?t.closest('[data-fk="qcopen"]'):null;
      if(qop){ STATE.qcOpen=qop.getAttribute("data-id"); STATE.qcDetail=null; fetchQCDetail(STATE.qcOpen); renderCard(); return; }
      if(t.closest && t.closest('[data-fk="driftback"]')){ STATE.matterOpen=null; STATE.qcOpen=null; STATE.matterDetail=null; STATE.qcDetail=null; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="msave"]')){ updateMatterStatus(); return; }
      if(t.closest && t.closest('[data-fk="mcommentsave"]')){ addMatterComment(); return; }
      var ssub=t.closest?t.closest('[data-fk="setupsub"]'):null;
      if(ssub){ STATE.setupSub=ssub.getAttribute("data-s"); STATE.officeNew=false; STATE.officeEdit=null; STATE.setupLev=null; STATE.setupHv=null; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="logopick"]')){ var lf=root.querySelector('[data-fk="logofile"]'); if(lf) lf.click(); return; }
      if(t.closest && t.closest('[data-fk="logodel"]')){ removeLogo(); return; }
      var laddb=t.closest?t.closest('[data-fk="levaddbtn"]'):null;
      if(laddb){ addLev(laddb.getAttribute("data-kind")); return; }
      var ldel=t.closest?t.closest('[data-fk="levdel"]'):null;
      if(ldel){ delLev(ldel.getAttribute("data-kind"), ldel.getAttribute("data-id")); return; }
      if(t.closest && t.closest('[data-fk="officenew"]')){ STATE.officeNew=!STATE.officeNew; STATE.officeEdit=null; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="officenewcancel"]')){ STATE.officeNew=false; renderCard(); return; }
      if(t.closest && t.closest('[data-fk="officeeditcancel"]')){ STATE.officeEdit=null; STATE.officeRooms=null; renderCard(); return; }
      var oed=t.closest?t.closest('[data-fk="officeedit"]'):null;
      if(oed){ STATE.officeEdit=oed.getAttribute("data-id"); STATE.officeNew=false; STATE.officeRooms=null; renderCard(); return; }
      var radd=t.closest?t.closest('[data-fk="roomadd"]'):null;
      if(radd){ addRoom(radd.getAttribute("data-type")); return; }
      var rdel=t.closest?t.closest('[data-fk="roomdel"]'):null;
      if(rdel){ delRoom(rdel.getAttribute("data-type"), rdel.getAttribute("data-id")); return; }
      var ocre=t.closest?t.closest('[data-fk="officecreate"]'):null;
      if(ocre){ var ob=ocre.closest(".fk-oedit"); if(ob) createOffice(ob); return; }
      var osav=t.closest?t.closest('[data-fk="officesave"]'):null;
      if(osav){ var ob2=osav.closest(".fk-oedit"); if(ob2) saveOffice(ob2); return; }
      var avs=t.closest?t.closest('[data-fk="avsub"]'):null;
      if(avs){ STATE.avtalSub=avs.getAttribute("data-s"); renderCard(); return; }
      return;
    }
    // LIST-vy
    var op=t.closest?t.closest('[data-flopen]'):null;
    if(op){ openCard(op.getAttribute("data-flopen")); return; }
    var soRt=t.closest?t.closest("th[data-sort]"):null;
    if(soRt){ var s=soRt.getAttribute("data-sort"); if(STATE.sort===s) STATE.dir=(STATE.dir==="asc"?"desc":"asc"); else { STATE.sort=s; STATE.dir="asc"; } reload(); return; }
    if(t.closest && t.closest('[data-fl="more"]')){ STATE.page++; load(true); return; }
    if(t.closest && t.closest('[data-fl="refresh"]')){ cacheClearAll(); reload(); return; }
    if(t.closest && t.closest('[data-fl="clear"]')){ STATE.q=""; for(var k in STATE.f) STATE.f[k]=""; renderFilters(); reload(); return; }
    var cell=t.closest?t.closest('[data-flcell="1"]'):null;
    if(cell){ beginEdit(cell); return; }
  });
  root.addEventListener("input", function(e){
    if(STATE.view!=="list") return;
    var t=e.target;
    if(t.getAttribute && t.getAttribute("data-fl")==="q"){ STATE.q=t.value; if(_deb) clearTimeout(_deb); _deb=setTimeout(reload, 350); }
  });
  root.addEventListener("change", function(e){
    var t=e.target;
    if(t.getAttribute && t.getAttribute("data-fk")==="photofile"){ onPhotoPick(t); return; }
    if(t.getAttribute && t.getAttribute("data-fk")==="logofile"){ onLogoPick(t); return; }
    var hf=t.getAttribute?t.getAttribute("data-hf"):null;
    if(hf==="type"||hf==="done"){ var hb=t.closest(".fk-hedit"); if(hb) toggleHistCond(hb); return; }
    if(STATE.view!=="list") return;
    var ff=t.getAttribute?t.getAttribute("data-flf"):null;
    if(ff){ STATE.f[ff]=t.value; reload(); }
  });

  load(false);
})();
</script>
