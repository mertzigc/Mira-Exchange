<!--
  MIRA — Affär: samlad vy (P1, LIVE). Ersätter Bubble-native-flikarna.
  Läser /admin/affar/feed → processtratt + samlad sökbar liggare. Client-side filter/sök.
  Design: OFFERT_PRODUKTION_HANDOFF.md §4.5. Fristående HTML-block.

  KOPPLING I BUBBLE:
    data-mira="api_host"        = https://mira-exchange.onrender.com
    data-mira="planning_token"  = PLANNING_ADMIN_TOKEN
  OBS: INGEN ?. eller ?? (Bubbles script-parser). Namespace .af-, IIFE, BROOT-scopat.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap');
  .af, .af *{box-sizing:border-box;margin:0;padding:0}
  .af{
    --base:#1e2235;--panel:#23283f;--card:#262b42;--deep:#2c314e;--input:#2e3350;
    --orange:#F47B30;--orange-dim:rgba(244,123,48,.13);
    --white:#fff;--w70:rgba(255,255,255,.70);--w40:rgba(255,255,255,.40);--w10:rgba(255,255,255,.07);
    --green:#4CAF7D;--red:#E05A5A;--blue:#5B8DEF;--purple:#9B7DEF;--border:rgba(255,255,255,.07);
    --fb:Arial,sans-serif;background:var(--base);color:var(--white);font-family:var(--fb);font-size:13px;line-height:1.5;
    display:block;padding:22px 26px 40px;border-radius:14px}
  .af input[type=hidden]{display:none}
  .af h1{font-family:'DM Serif Display',Georgia,serif;font-size:26px}.af h1 span{color:var(--orange)}
  .af .sub{color:var(--w40);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:2px 0 20px}
  .funnel{display:flex;gap:6px;margin-bottom:20px}
  .fstep{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px 15px;position:relative;cursor:pointer}
  .fstep.on{border-color:var(--orange);background:var(--orange-dim)}
  .fstep .lbl{font-size:11px;color:var(--w40);text-transform:uppercase;letter-spacing:.05em}
  .fstep .num{font-size:22px;font-weight:700;margin-top:3px}
  .fstep .arw{position:absolute;right:-11px;top:50%;transform:translateY(-50%);z-index:2;color:var(--w40);font-size:14px}
  .fstep:last-child .arw{display:none}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{flex:1;min-width:220px;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--white);font-family:var(--fb);font-size:13px}
  .search:focus{outline:none;border-color:var(--orange)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--input);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:12px;color:var(--w70);cursor:pointer}
  .chip.on{background:var(--orange);border-color:var(--orange);color:#1c1206;font-weight:700}
  .src{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;border-radius:6px;padding:3px 8px;text-transform:uppercase;letter-spacing:.03em}
  .src .d{width:6px;height:6px;border-radius:50%}
  .src.mira{background:rgba(244,123,48,.14);color:var(--orange)}.src.mira .d{background:var(--orange)}
  .src.fortnox{background:rgba(91,141,239,.14);color:var(--blue)}.src.fortnox .d{background:var(--blue)}
  .src.tengella{background:rgba(155,125,239,.14);color:var(--purple)}.src.tengella .d{background:var(--purple)}
  .tablewrap{width:100%;overflow-x:auto}
  .grid{width:100%;border-collapse:collapse}
  .grid th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--w40);padding:8px 12px;border-bottom:1.5px solid var(--w10)}
  .grid td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
  .grid tr:hover td{background:var(--card)}
  .typ{display:inline-flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap}
  .typ .ic{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--deep)}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mono{font-family:Menlo,Consolas,monospace;font-size:11px;color:var(--w70)}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--w40)}
  .p-open{background:var(--orange-dim);color:var(--orange)}.p-open .d{background:var(--orange)}
  .p-ok{background:rgba(76,175,125,.13);color:var(--green)}.p-ok .d{background:var(--green)}
  .p-wait{background:var(--w10);color:var(--w70)}
  .p-red{background:rgba(224,90,90,.13);color:var(--red)}.p-red .d{background:var(--red)}
  .muted{color:var(--w40)}
  .kindtag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--w40);background:var(--w10);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
  .af-note{margin-top:16px;font-size:11px;color:var(--w40)}
  .af .af-filterbar{align-items:center;gap:8px}
  .af .af-datein{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--white);font-family:var(--fb);font-size:12px;color-scheme:dark}
  .af .af-datein:focus{outline:none;border-color:var(--orange)}
  .af .af-datclear{cursor:pointer}
  .af .af-weekpreset{cursor:pointer;border-color:rgba(244,123,48,.4);color:var(--orange)}
  .af .af-weekpreset:hover{background:var(--orange-dim)}
  tr.affar{cursor:pointer}
  tr.affar.open td{background:var(--card)}
  .deal-cell{padding:0 !important;background:var(--card)}
  .deal{border-left:2px solid var(--orange);margin:0}
  .deal-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:12px;color:var(--w70)}
  .chain{display:flex;gap:0;padding:6px 18px 20px;overflow-x:auto}
  .cstep{flex:1;min-width:140px;position:relative;padding:0 8px}
  .cstep .line{position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--w10)}
  .cstep.done .line{background:var(--green)}
  .cstep:last-child .line{display:none}
  .cstep .dot{width:26px;height:26px;border-radius:50%;background:var(--deep);border:2px solid var(--w10);display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;z-index:2;margin-bottom:9px}
  .cstep.done .dot{background:var(--green);border-color:var(--green);color:#0d1a12}
  .cstep.active .dot{border-color:var(--orange);color:var(--orange)}
  .cstep .ct{font-size:10px;color:var(--w40);text-transform:uppercase;letter-spacing:.04em}
  .cstep .cv{font-weight:700;margin-top:3px;font-size:12px}
  .cstep .cm{font-size:11px;color:var(--w70);margin-top:2px}
  .cstep .cm .b{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;margin-top:3px}
  .msg{max-width:280px;color:var(--w70);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .assign{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--white);font-family:var(--fb);font-size:12px;max-width:170px}
  .assign:focus{outline:none;border-color:var(--orange)}
  .pager{display:flex;gap:10px;align-items:center;margin-top:14px}
  .pager button{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--white);font-size:12px;cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager .pinfo{font-size:11px;color:var(--w40)}
  .viewbtn{display:inline-block;background:var(--input);border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;color:var(--w70);text-decoration:none;white-space:nowrap}
  .viewbtn:hover{border-color:var(--orange);color:var(--orange)}
  .af-conv{background:var(--orange);border:none;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:800;color:#1c1206;cursor:pointer;white-space:nowrap;font-family:var(--fb);transition:filter .12s}
  .af-conv:hover{filter:brightness(1.07)}
  .af-conv:disabled{opacity:.5;cursor:default}
  .af .ordertag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--green);background:rgba(76,175,125,.13);border-radius:5px;padding:3px 8px;white-space:nowrap}
  .af .af-klarbadge{display:inline-block;font-size:11px;font-weight:800;color:var(--green);background:rgba(76,175,125,.15);border:1px solid rgba(76,175,125,.35);border-radius:6px;padding:3px 9px;white-space:nowrap}
  .af .af-klarbadge.sm{font-size:9.5px;padding:2px 6px;text-transform:uppercase;letter-spacing:.03em}
  /* order-editor (inline, dokument-läsvy + penn-ikon) */
  .af tr.orderrow{cursor:pointer}
  .af tr.orderrow.open>td{background:var(--card)}
  .af .af-ord .af-o-head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .af .af-o-pdfbtns{display:flex;gap:8px}
  .af .af-pdfbtn{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--w70);cursor:pointer;font-family:var(--fb)}
  .af .af-pdfbtn:hover{border-color:var(--orange);color:var(--orange)}
  .af .af-icobtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--border);color:var(--w40);cursor:pointer;font-size:12px;background:var(--input);flex:0 0 auto}
  .af .af-icobtn:hover{border-color:var(--orange);color:var(--orange)}
  .af .af-or-del:hover{border-color:var(--red);color:var(--red)}
  .af .af-lnk{background:none;border:none;color:var(--w40);cursor:pointer;font-size:12px;font-family:var(--fb);text-decoration:underline;padding:8px 4px}
  .af .af-lnk:hover{color:var(--white)}
  /* huvud-läsvy */
  .af .af-o-headview{position:relative;background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .af .af-ohv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px 18px;padding-right:30px}
  .af .af-ohv-f{display:flex;flex-direction:column;gap:2px;min-width:0}
  .af .af-ohv-l{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--w40);font-weight:700}
  .af .af-ohv-v{font-size:13px;color:var(--white);word-break:normal;overflow-wrap:anywhere}
  .af .af-o-headpencil{position:absolute;top:10px;right:10px}
  .af .af-ohv-instr{margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
  .af .af-ohv-instr .af-ohv-v{font-size:12.5px;color:var(--orange);white-space:pre-wrap;margin-top:2px}
  .af .af-o-headedit{background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:14px}
  /* rad-läsvy */
  .af .af-o-rowshead{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--w40);font-weight:700;margin:12px 0 4px}
  .af .af-o-rows{display:flex;flex-direction:column;gap:7px}
  .af .af-o-row{background:var(--deep);border:1px solid var(--border);border-radius:9px}
  .af .af-or-view{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 12px}
  .af .af-or-l{min-width:0;flex:1}
  .af .af-orv-namn{font-weight:700;font-size:13px}
  .af .af-orv-qty{font-size:11.5px;margin-top:1px}
  .af .af-orv-besk{font-size:11.5px;margin-top:3px;overflow-wrap:anywhere}
  .af .af-or-r{display:flex;align-items:center;gap:9px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
  .af .af-orv-sum{font-variant-numeric:tabular-nums;white-space:nowrap}
  .af .kokpill{font-size:10px;font-weight:700;color:var(--blue);background:rgba(91,141,239,.13);border-radius:6px;padding:3px 9px;white-space:nowrap}
  .af .kokpill.nokok{color:var(--w40);background:var(--w10)}
  .af .af-or-edit{padding:12px;border-top:1px solid var(--border)}
  .af .af-or-save{padding:7px 16px;font-size:12px}
  .af .af-o-totals{font-size:12px;color:var(--w70)}
  .af .af-o-totals b{color:var(--white)}
  /* inline edit (lead + aktivitet) */
  .af tr.lead,.af tr.akt{cursor:pointer}
  .af tr.lead.open>td,.af tr.akt.open>td{background:var(--card)}
  .af .exp{color:var(--w40);font-weight:400;margin-right:6px;display:inline-block;transition:transform .12s}
  .af tr.open .exp{color:var(--orange);transform:rotate(90deg)}
  .af .edit-cell{padding:0 !important;background:var(--card)}
  .af .edit{border-left:2px solid var(--orange);padding:15px 18px;display:flex;flex-direction:column;gap:11px;max-width:1080px}
  .af .erow{display:flex;gap:14px;flex-wrap:wrap}
  .af .erow>div{flex:1;min-width:180px}
  .af .egrow{position:relative}
  .af .el{display:block;font-size:9.5px;color:var(--w40);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .af .ein{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--white);font-family:var(--fb);font-size:13px}
  .af .ein:focus{outline:none;border-color:var(--orange)}
  .af textarea.ein{resize:vertical}
  .af .chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--white);cursor:pointer;padding:8px 0}
  .af .eact{display:flex;align-items:center;justify-content:flex-start;gap:14px;border-top:1px solid var(--border);padding-top:11px;margin-top:1px}
  /* Nasta steg-grinden pa en genomford aktivitet (speglar kundkortet). */
  .af .af-ns{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:2px 0;background:rgba(255,255,255,.03)}
  .af .af-nsbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .af .af-nsbtn{background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:12px}
  .af .af-nsbtn:hover{border-color:var(--orange)}
  .af .af-nsbtn.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
  .af .af-nsbody{margin-top:10px}
  .af .af-nsmsg{display:block;margin-top:8px}
  .af .af-nsmsg.err{color:#ff8080}
  /* "5 skal till bom" - stjarngradering som harleder sannolikheten. */
  .af .bom{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:2px 0;background:rgba(255,255,255,.03)}
  .af .bom-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
  .af .bom-h .t{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;opacity:.65;font-weight:700}
  .af .bom-h .p{font-size:15px;font-weight:800;color:var(--orange);white-space:nowrap}
  .af .bom-h .p.na{color:inherit;opacity:.45;font-size:12px;font-weight:600}
  .af .bom-row{display:flex;align-items:center;gap:10px;padding:4px 0}
  .af .bom-row .l{flex:1;min-width:0;font-size:12.5px}
  .af .bom-stars{display:inline-flex;gap:3px}
  .af .bom-star{cursor:pointer;font-size:17px;line-height:1;color:rgba(255,255,255,.22);background:none;border:0;padding:0 1px}
  .af .bom-star.on{color:var(--orange)}
  .af .bom-star:hover{color:var(--orange);opacity:.8}
  .af .bom-msg{display:block;margin-top:8px;font-size:11.5px;opacity:.65}
  .af .bom-msg.err{color:#ff8080;opacity:1}
  .af .ebtn{background:var(--orange);border:none;border-radius:8px;padding:8px 22px;color:#1c1206;font-weight:800;font-size:12.5px;cursor:pointer;font-family:var(--fb);transition:filter .12s}
  .af .ebtn:hover{filter:brightness(1.07)}
  .af .ebtn:disabled{opacity:.5;cursor:default}
  .af .egrow .ecur{font-size:11px;color:var(--w40);margin-top:4px}
  .af .ecur{font-size:11px;color:var(--w40)}
  .af .sugg{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--deep);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:220px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .af .sugg.on{display:block}
  .af .si{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
  .af .si:last-child{border-bottom:none}
  .af .si:hover{background:var(--input)}
  .af .si .sc{color:var(--w40);font-size:11px;margin-left:6px}
  /* deal-edit (affär-expansion) */
  .af .deal-edit{border-left:none;border-top:1px solid var(--border);margin:4px 0 0;padding:15px 18px 4px}
  .af .kats{display:flex;flex-wrap:wrap;gap:8px 16px;padding-top:2px}
  .af .dchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;min-height:2px}
  .af .dchip{display:inline-flex;align-items:center;gap:5px;background:var(--input);border:1px solid var(--border);border-radius:16px;padding:4px 6px 4px 11px;font-size:12px;color:var(--white)}
  .af .dx{cursor:pointer;color:var(--w40);font-weight:700;font-size:15px;line-height:1;padding:0 3px}
  .af .dx:hover{color:var(--red)}
  /* workorder radexpandering + koppla-rad */
  .af tr.worow,.af tr.kopplarow{cursor:pointer}
  .af tr.worow.open>td,.af tr.kopplarow.open>td{background:var(--card)}
  .af .worows{width:100%;border-collapse:collapse}
  .af .worows th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--w40);padding:6px 10px;border-bottom:1px solid var(--w10)}
  .af .worows td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top}
  .af .worows .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .af .worowlink{color:var(--w70);font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
  .af .worowlink:hover{color:var(--orange)}
  /* rikare affärskort: summeringsrad + klickbara steg + steg-detalj + kort-koppling */
  .af .deal-sum{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 4px}
  .af .deal-sum span{font-size:11px;font-weight:700;color:var(--w70);background:var(--w10);border-radius:6px;padding:3px 9px}
  .af .cstep.cstep-x{cursor:pointer;border-radius:9px;transition:background .12s}
  .af .cstep.cstep-x:hover{background:var(--deep)}
  .af .cstep.cstep-x .ct::after{content:" ▾";color:var(--w40);font-size:9px}
  .af .cstep.cstep-x.opened .ct::after{content:" ▴";color:var(--orange)}
  .af .cstep-detail{margin:0 18px 14px;background:var(--deep);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .af .csd-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--w40);padding:9px 12px 4px;font-weight:700}
  .af .card-koppla{margin:2px 18px 4px;border-top:1px solid var(--border);padding-top:11px}
  .af .ck-toggle{display:inline-block;font-size:12px;font-weight:700;color:var(--orange);cursor:pointer;padding:4px 0}
  .af .ck-toggle:hover{text-decoration:underline}
  .af .ck-body{margin-top:8px}
  /* skapa ny affär från lead/aktivitet (inline i expanderad rad) */
  .af .af-createdeal{margin-top:12px;border-top:1px dashed var(--border);padding-top:11px;max-width:660px}
  .af .af-cd-toggle{display:inline-block;font-size:12.5px;font-weight:700;color:var(--orange);cursor:pointer}
  .af .af-cd-toggle:hover{text-decoration:underline}
  .af .af-cd-form{margin-top:11px}
  /* skapa nytt: generell rad + kort-actions */
  .af .af-createbar{margin-bottom:12px}
  .af .af-newbtn{background:var(--input);border:1px solid var(--border);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--w70);cursor:pointer;font-family:var(--fb);transition:border-color .12s,color .12s}
  .af .af-newbtn:hover{border-color:var(--orange);color:var(--orange)}
  .af [data-af="createpanel"]:not(:empty){margin-bottom:16px}
  .af .card-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 18px 4px;border-top:1px solid var(--border);padding-top:11px}
  .af .card-actions .ca-lbl{font-size:11px;color:var(--w40);margin-right:2px}
  .af .af-cardnew{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--w70);cursor:pointer;font-family:var(--fb)}
  .af .af-cardnew:hover{border-color:var(--orange);color:var(--orange)}
  .af .card-actions-panel:not(:empty){margin:0 18px 8px}

</style>

  <h1>Affär <span>·</span> samlad vy</h1>

    </div>

  </div>

  <div class="af-note" data-af="note"></div>
</div>

<script>
(function(){
  "use strict";
  var all=document.querySelectorAll(".af"),root=null;
  for(var i=0;i<all.length;i++){ if(!all[i].getAttribute("data-af-claimed")){ root=all[i]; break; } }
  if(!root) return; root.setAttribute("data-af-claimed","1");
  var $=function(k){ return root.querySelector('[data-af="'+k+'"]'); };
  var cfg=function(k){ var el=root.querySelector('[data-mira="'+k+'"]'); return (el&&el.value)||""; };
  var HOST=cfg("api_host").replace(/\/+$/,""), TOKEN=cfg("planning_token"), CUC=cfg("current_user_company");

  // type="" => feed-läge (samlad översikt); annars list-läge (server-paginerad per typ)
  var STATE={ feedRows:[], listRows:[], funnel:null, type:"", src:"", q:"", from:"", to:"", person:"", kategori:"", page:0, total:null, grand:null, filtered:false, hasMore:false, loading:false };
  var USERS=[];   // kollegor (för tilldela-dropdown)
  var ICON={ Lead:"✨", Aktivitet:"💬", "Affär":"🤝", Offert:"📄", Avtal:"📘", Order:"🧾", Faktura:"💳" };
  var STEPS=[["Lead","lead"],["Aktivitet","aktivitet"],["Affär","affar"],["Offert","offert"],["Avtal","avtal"],["Order","order"],["Faktura","faktura"]];
  var LABEL2TYPE={ "":"", "Lead":"lead", "Aktivitet":"aktivitet", "Affär":"affar", "Offert":"offert", "Avtal":"avtal", "Order":"order", "Faktura":"faktura" };
  var DOC_HEADS=["Typ","Källa","Företag","Nummer","Belopp","Datum","Ansvarig","Status",""];
  var LEAD_HEADS=["Skapad","Namn","Email","Telefon","Företag","Prel. värde","Meddelande","Region","Källa","Formulär","Kundansvarig","Skapad av","Tilldela"];
  var AKT_HEADS=["Skapad","Leverantör","Typ","Fas","Mötesdatum","Företag","Affär","Meddelande","Vår användare"];
  var TYPE2DOC={ "Order":"order", "Offert":"offert", "Faktura":"faktura" };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function money(n){ if(n==null) return ""; return Math.round(n).toLocaleString("sv-SE")+" kr"; }
  function clip(s,n){ s=String(s==null?"":s); return s.length>n?s.slice(0,n-1)+"…":s; }
  function weekRange(){ var d=new Date(); var day=(d.getDay()+6)%7; var mon=new Date(d); mon.setDate(d.getDate()-day); var sun=new Date(mon); sun.setDate(mon.getDate()+13); function iso(x){ return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2); } return { from:iso(mon), to:iso(sun) }; }
  function stampAffar(){ var u=$("upd"); if(u){ var d=new Date(); function p(n){return ("0"+n).slice(-2);} u.textContent="· uppdaterad "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()); } }
  function cm(v){ return v?esc(v):'<span class="muted">—</span>'; }

  function renderFunnel(){
    var f=STATE.funnel||{}, h="";
    for(var i=0;i<STEPS.length;i++){
      var lbl=STEPS[i][0], key=STEPS[i][1], on=(STATE.type===lbl)?" on":"";
      h+='<div class="fstep'+on+'" data-step="'+esc(lbl)+'"><div class="lbl">'+esc(lbl)+'</div><div class="num">'+(f[key]!=null?f[key]:"–")+'</div><span class="arw">›</span></div>';
    }
    $("funnel").innerHTML=h;
  }
  function setHead(heads){
    $("thead").innerHTML='<tr>'+heads.map(function(h){ return '<th'+(h==="Belopp"?' class="num"':'')+'>'+esc(h)+'</th>'; }).join("")+'</tr>';
  }
  function colCount(){ return root.querySelectorAll('[data-af="thead"] th').length||7; }
  function emptyRow(msg){ return '<tr><td colspan="'+colCount()+'" class="muted" style="padding:20px">'+esc(msg)+'</td></tr>'; }

  // ── rad-renderers per typ ──
  function docRowHtml(r){
    var ic=ICON[r.type]||"•";
    var isWo=!!(r.wo && r.rows && r.rows.length);
    var isMiraOrder=(r.type==="Order" && r.source==="mira");   // redigerbar order-editor
    var kt=kType(r.type);
    var isKopp=(!isWo && !isMiraOrder && !!kt);   // offert/order(fortnox)/faktura/avtal (workorder+mira-order har egna expanders)
    var af="";
    if(r.type==="Affär") af=' class="affar" data-affar-id="'+esc(r.id)+'"';
    else if(isWo) af=' class="worow" data-wo-id="'+esc(r.id)+'"';
    else if(isMiraOrder) af=' class="orderrow" data-order-id="'+esc(r.id)+'"';
    else if(isKopp) af=' class="kopplarow" data-kid="'+esc(r.id)+'" data-ktype="'+kt+'" data-ksrc="'+esc(r.source)+'" data-kdeal="'+(r.deal_id?"1":"")+'"';
    var chev=(r.type==="Affär"||isWo||isKopp||isMiraOrder)?' <span class="muted" style="font-weight:400">▸</span>':'';
    var koppTag=(isKopp&&r.deal_id)?' <span class="kindtag" style="color:var(--green)">kopplad</span>':'';
    var lastCell=isWo?('<span class="worowlink">'+r.rows.length+' rader ▸</span>'):(viewCell(r)+convertCell(r));
    return '<tr'+af+'>'+
      '<td><span class="typ"><span class="ic">'+ic+'</span>'+esc(r.type)+chev+(r.type==="Offert"&&r.kind?' <span class="kindtag">'+esc(r.kind)+'</span>':'')+koppTag+'</span></td>'+
      '<td><span class="src '+esc(r.source)+'"><span class="d"></span>'+esc(r.source)+'</span></td>'+
      '<td>'+cm(r.company)+'</td>'+
      '<td class="mono">'+cm(r.number)+'</td>'+
      '<td class="num">'+(r.amount!=null?esc(money(r.amount)):'<span class="muted">—</span>')+'</td>'+
      '<td class="muted">'+esc(r.date||"")+'</td>'+
      '<td>'+cm(r.ansvarig)+'</td>'+
      '<td><span class="pill p-'+esc(r.status_cls||"wait")+'"><span class="d"></span>'+esc(r.status||"")+'</span>'+((isMiraOrder&&r.klar_for_leverans)?' <span class="af-klarbadge sm">✓ klar f. lev.</span>':'')+'</td>'+
      '<td>'+lastCell+'</td>'+
    '</tr>';
  }
  function viewCell(r){
    if(r.url) return '<a class="viewbtn" href="'+esc(r.url)+'" target="_blank" rel="noopener">Visa ↗</a>';
    var dt=TYPE2DOC[r.type];
    if(dt && r.source==="fortnox") return '<button class="viewbtn" data-doc-type="'+esc(dt)+'" data-doc-id="'+esc(r.id)+'">Visa ↗</button>';
    return "";
  }
  // Mira offert → order: Konvertera-knapp om ingen order, annars ✓ Order-tag. Bara Mira (Fortnox avvaktas).
  function convertCell(r){
    if(r.type!=="Offert" || r.source!=="mira") return "";
    if(r.order_id) return ' <span class="ordertag" title="Order '+esc(r.order_nr||"")+'">✓ Order '+esc(r.order_nr||"")+'</span>';
    return ' <button class="af-conv" data-off-id="'+esc(r.id)+'">Konvertera →</button>';
  }
  function doConvert(btn){
    var id=btn.getAttribute("data-off-id");
    if(!window.confirm("Konvertera offerten till en order?")) return;
    var orig=btn.textContent; btn.disabled=true; btn.textContent="Konverterar…";
    fetch(HOST+"/admin/affar/offert/"+encodeURIComponent(id)+"/convert",{method:"POST",headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"}})
      .then(function(r){ return r.json(); }).then(function(j){
        if(!j||!j.ok){ btn.disabled=false; btn.textContent=orig; alert("Kunde inte konvertera: "+esc((j&&(j.hint||j.error))||"okänt fel")); return; }
        btn.outerHTML='<span class="ordertag">✓ Order '+esc(j.order_nr||"")+(j.created?"":" (fanns)")+'</span>';
        var i; for(i=0;i<STATE.listRows.length;i++){ if(STATE.listRows[i].id===id){ STATE.listRows[i].order_id=j.order_id; STATE.listRows[i].order_nr=j.order_nr; break; } }
        for(i=0;i<STATE.feedRows.length;i++){ if(STATE.feedRows[i].id===id){ STATE.feedRows[i].order_id=j.order_id; STATE.feedRows[i].order_nr=j.order_nr; break; } }
      }).catch(function(){ btn.disabled=false; btn.textContent=orig; alert("Nätverksfel vid konvertering."); });
  }

  // ── order-editor (inline, Mira-order redigerbar utan cutoff) ──
  var orderCache={};
  function kokOptions(koks, cur){ var o='<option value="">— kök —</option>'; for(var i=0;i<koks.length;i++){ o+='<option value="'+esc(koks[i].id)+'"'+(koks[i].id===cur?" selected":"")+'>'+esc(koks[i].namn)+'</option>'; } return o; }
  var PREP_KATEGORIER=["Frallor","Kall lunch","Varm lunch","Sallad","Wraps","Mingel","Buffé","Bröd","Konditori","Kall dryck","Varm dryck","Alkohol"];
  function prepOptions(cur){ var list=PREP_KATEGORIER.slice(); if(cur && list.indexOf(cur)<0) list.unshift(cur); var o='<option value="">— prep —</option>'; for(var i=0;i<list.length;i++){ o+='<option value="'+esc(list[i])+'"'+(list[i]===cur?" selected":"")+'>'+esc(list[i])+'</option>'; } return o; }
  // Läsvy för en rad (dokument-utseende). Penna → redigering.
  function rowViewInner(r){
    var qty=esc(r.antal)+(r.enhet?(' '+esc(r.enhet)):'')+' · '+esc(money(r.apris))+'/'+(r.enhet?esc(r.enhet):'st');
    var kok=r.kok_namn?('<span class="kokpill">'+esc(r.kok_namn)+'</span>'):'<span class="kokpill nokok">Kök ej satt</span>';
    var prep=r.prep_kategori?(' <span class="af-orv-prep muted">'+esc(r.prep_kategori)+'</span>'):'';
    return '<div class="af-orv-l">'+
        '<div class="af-orv-namn">'+cm(r.benamning)+'</div>'+
        '<div class="af-orv-qty muted">'+qty+'</div>'+
        (r.beskrivning_long?('<div class="af-orv-besk muted">'+esc(r.beskrivning_long)+'</div>'):'')+
      '</div>'+
      '<div class="af-orv-r">'+kok+prep+'<b class="af-orv-sum">'+esc(money(r.radsumma))+'</b>'+
        '<span class="af-icobtn af-or-pencil" title="Redigera rad">✎</span>'+
        '<span class="af-icobtn af-or-del" title="Ta bort rad">✕</span>'+
      '</div>';
  }
  function rowEditFormInner(r, koks){
    return '<div class="erow">'+
        '<div style="flex:2"><label class="el">Benämning</label><input class="ein af-or-benamning" value="'+esc(r.benamning)+'"></div>'+
        '<div style="max-width:90px"><label class="el">Antal</label><input class="ein af-or-antal" type="number" step="any" value="'+esc(r.antal)+'"></div>'+
        '<div style="max-width:90px"><label class="el">Enhet</label><input class="ein af-or-enhet" value="'+esc(r.enhet)+'"></div>'+
        '<div style="max-width:110px"><label class="el">Á-pris</label><input class="ein af-or-apris" type="number" step="any" value="'+esc(r.apris)+'"></div>'+
      '</div>'+
      '<div class="erow">'+
        '<div style="max-width:90px"><label class="el">Rabatt %</label><input class="ein af-or-rabatt" type="number" step="any" value="'+esc(r.rabatt)+'"></div>'+
        '<div style="max-width:90px"><label class="el">Moms %</label><input class="ein af-or-moms" type="number" step="any" value="'+esc(r.moms)+'"></div>'+
        '<div><label class="el">Kök (produktionsenhet)</label><select class="ein af-or-kok">'+kokOptions(koks, r.kok_id)+'</select></div>'+
        '<div><label class="el">Prep-kategori</label><select class="ein af-or-prep">'+prepOptions(r.prep_kategori)+'</select></div>'+
      '</div>'+
      '<div><label class="el">Beskrivning (visas i produktion)</label><textarea class="ein af-or-besk" rows="2">'+esc(r.beskrivning_long)+'</textarea></div>'+
      '<div class="eact" style="justify-content:flex-start"><button class="ebtn af-or-save">Spara rad</button><button class="af-lnk af-or-cancel">Avbryt</button><span class="af-or-msg ecur"></span></div>';
  }
  function orderRowHtml(r, koks){
    return '<div class="af-o-row" data-row-id="'+esc(r.id)+'">'+
      '<div class="af-or-view">'+rowViewInner(r)+'</div>'+
      '<div class="af-or-edit" style="display:none">'+rowEditFormInner(r, koks)+'</div>'+
    '</div>';
  }
  function headViewInner(o){
    function f(lbl, val){ return '<div class="af-ohv-f"><span class="af-ohv-l">'+esc(lbl)+'</span><span class="af-ohv-v">'+(val?esc(val):'<span class="muted">—</span>')+'</span></div>'; }
    var refName=o.var_referens_name||"";
    var refCell=refName?esc(refName):(o.var_referens_default_name?('<span class="muted">'+esc(o.var_referens_default_name)+' (ägare)</span>'):'<span class="muted">—</span>');
    var klarBadge=(o.klar_for_leverans===true)?'<span class="af-klarbadge">✓ Klar för leverans</span>':'';
    return '<div class="af-ohv-grid">'+
        f("Leveransdatum", o.leveransdatum)+f("Leveranstid", o.leveranstid)+f("Status", o.orderstatus)+
        '<div class="af-ohv-f"><span class="af-ohv-l">Vår referens</span><span class="af-ohv-v">'+refCell+'</span></div>'+
        f("Betalningsvillkor", o.betalningsvillkor)+f("Momstyp", o.momstyp)+f("Valuta", o.valuta)+
        f("Leveransadress", o.leveransadress)+
        (o.villkor_text?f("Villkorstext", o.villkor_text):'')+
      '</div>'+
      (klarBadge?('<div style="margin-top:6px">'+klarBadge+'</div>'):'')+
      (o.intern_instruktion?('<div class="af-ohv-instr"><span class="af-ohv-l">Intern instruktion (skrivs på kök-PM)</span><div class="af-ohv-v">'+esc(o.intern_instruktion)+'</div></div>'):'')+
      '<span class="af-icobtn af-o-headpencil" title="Redigera orderuppgifter">✎</span>';
  }
  function headEditInner(o, so, users){
    var statusOpts=''; for(var i=0;i<so.length;i++){ statusOpts+='<option value="'+esc(so[i])+'"'+(so[i]===o.orderstatus?" selected":"")+'>'+esc(so[i])+'</option>'; }
    var us=users||[]; var curRef=o.var_referens||"";
    var defLbl=o.var_referens_default_name?(" — "+o.var_referens_default_name+" (affärens ägare)"):"";
    var refOpts='<option value="">— ingen'+esc(defLbl)+' —</option>';
    for(var u=0;u<us.length;u++){ refOpts+='<option value="'+esc(us[u].id)+'"'+(us[u].id===curRef?" selected":"")+'>'+esc(us[u].name)+'</option>'; }
    return '<div class="erow">'+
        '<div><label class="el">Leveransdatum</label><input type="date" class="ein af-o-levdatum" value="'+esc(o.leveransdatum)+'"></div>'+
        '<div><label class="el">Leveranstid</label><input class="ein af-o-levtid" value="'+esc(o.leveranstid)+'" placeholder="t.ex. 12:00"></div>'+
        '<div><label class="el">Status</label><select class="ein af-o-status">'+statusOpts+'</select></div>'+
        '<div><label class="el">Valuta</label><input class="ein af-o-valuta" value="'+esc(o.valuta)+'"></div>'+
      '</div>'+
      '<div class="erow">'+
        '<div style="flex:2"><label class="el">Vår referens (ansvarig för ordern)</label><select class="ein af-o-varref">'+refOpts+'</select></div>'+
        '<div style="flex:1;display:flex;align-items:flex-end"><label class="el" style="display:flex;align-items:center;gap:7px;cursor:pointer;margin:0 0 9px"><input type="checkbox" class="af-o-klar" style="width:16px;height:16px;accent-color:var(--green)"'+(o.klar_for_leverans===true?" checked":"")+'>Klar för leverans</label></div>'+
      '</div>'+
      '<div class="erow">'+
        '<div><label class="el">Betalningsvillkor</label><input class="ein af-o-betalning" value="'+esc(o.betalningsvillkor)+'"></div>'+
        '<div><label class="el">Momstyp</label><input class="ein af-o-momstyp" value="'+esc(o.momstyp)+'"></div>'+
        '<div style="flex:2"><label class="el">Villkorstext</label><input class="ein af-o-villkor" value="'+esc(o.villkor_text)+'"></div>'+
      '</div>'+
      '<div><label class="el">Intern instruktion (skrivs tydligt på kök-PM)</label><textarea class="ein af-o-instr" rows="2" placeholder="T.ex. viktigt att vara på plats 11:30 för uppdukning">'+esc(o.intern_instruktion||"")+'</textarea></div>'+
      '<div class="muted" style="font-size:11px;margin:6px 0">Leveransadress redigeras ej här (geo-fält).</div>'+
      '<div class="eact" style="justify-content:flex-start"><button class="ebtn af-o-savehead">Spara</button><button class="af-lnk af-o-headcancel">Avbryt</button><span class="af-o-headmsg ecur"></span></div>';
  }
  function orderEditorHtml(j){
    var o=j.order, koks=j.koks||[], so=j.status_options||[], users=j.users||[]; orderCache[o.id]=j;
    var rowsHtml=(j.rows||[]).map(function(r){ return orderRowHtml(r, koks); }).join("");
    return '<div class="edit af-ord" data-order-id="'+esc(o.id)+'">'+
      '<div class="af-o-head-row"><div style="font-weight:800;color:var(--orange)">Order '+esc(o.ordernr||"")+' · '+esc(o.company||"")+'</div>'+
        '<div class="af-o-pdfbtns"><button class="af-pdfbtn af-o-pdf-order">Order-PDF ↗</button><button class="af-pdfbtn af-o-pdf-pm">Kök-PM ↗</button></div></div>'+
      '<div class="af-o-headview">'+headViewInner(o)+'</div>'+
      '<div class="af-o-headedit" style="display:none">'+headEditInner(o, so, users)+'</div>'+
      '<div class="af-o-rowshead">Rader · kök-tilldelning styr produktionen</div>'+
      '<div class="af-o-rows">'+rowsHtml+'</div>'+

  // ── "5 SKÄL TILL BOM" → sannolikhet (2026-08-22) ──────────────────────────
  // Ersätter den handsatta sannolikhets-dropdownen överallt där en affär skapas
  // eller redigeras. ⚠️ RIKTNING: fler stjärnor = starkare position = HÖGRE
  // sannolikhet. Rubriken påminner om vad som fäller affärer; graderingen mäter
  // hur väl vi står. Servern räknar (formeln finns bara där) — det här är UI.
  // ⚠️ Alla fem krävs; annars ser siffran exakt ut men vilar på gissningar.
  var BOM=[["relation","Relation"],["beslutsprocess","Beslutsprocess"],["timing","Tid/timing"],["budget","Budget"],["battre","Bättre"]];
  function bomPct(scores){
    var sum=0, n=0;
    for(var i=0;i<BOM.length;i++){ var v=scores[BOM[i][0]]; if(v){ sum+=v; n++; } }
    if(n<BOM.length) return null;
    return Math.round(((sum-BOM.length)/(BOM.length*4))*0.95*100);
  }
  function bomHtml(cur){
    cur=cur||{};
    var rows="";
    for(var i=0;i<BOM.length;i++){
      var k=BOM[i][0], v=Number(cur[k])||0, stars="";
      for(var n=1;n<=5;n++) stars+='<button type="button" class="bom-star'+(n<=v?" on":"")+'" data-bom="'+esc(k)+'" data-v="'+n+'" title="'+n+' av 5">★</button>';
      rows+='<div class="bom-row"><span class="l">'+esc(BOM[i][1])+'</span><span class="bom-stars">'+stars+'</span></div>';
    }
    var pct=bomPct(cur);
    return '<div class="bom" data-bomwrap="1">'+
      '<div class="bom-h"><span class="t">5 skäl till bom</span>'+
      '<span class="p'+(pct==null?" na":"")+'" data-bompct>'+(pct==null?"ej graderad":("Sannolikhet "+pct+" %"))+'</span></div>'+
      rows+
      '<span class="bom-msg" data-bommsg>Gradera alla fem — sannolikheten räknas fram. Max 95 %: 100 % först vid signering.</span>'+
    '</div>';
  }
  // Läser graderingen ur ett formulär. → {scores, klar}
  function bomRead(box){
    var wrap=box.querySelector("[data-bomwrap]"); if(!wrap) return { scores:null, klar:true };
    var scores={}, n=0;
    for(var i=0;i<BOM.length;i++){
      var on=wrap.querySelectorAll('.bom-star.on[data-bom="'+BOM[i][0]+'"]');
      if(on.length){ scores[BOM[i][0]]=on.length; n++; }
    }
    return { scores:scores, klar:(n===BOM.length), antal:n };
  }
  // Klick på en stjärna: fyll 1..n för den raden och räkna om procenten.
  // ⚠️ Punktuppdatering — ALDRIG en re-render, då försvinner text man skrivit
  // i formulärets andra fält (samma fälla som deal-formuläret och chipsen).
  function bomSet(star){
    var wrap=star.closest("[data-bomwrap]"); if(!wrap) return;
    var k=star.getAttribute("data-bom"), v=Number(star.getAttribute("data-v"))||0;
    var all=wrap.querySelectorAll('.bom-star[data-bom="'+k+'"]');
    for(var i=0;i<all.length;i++){
      var n=Number(all[i].getAttribute("data-v"))||0;
      if(n<=v) all[i].classList.add("on"); else all[i].classList.remove("on");
    }
    var box={ querySelector:function(sel){ return wrap.matches(sel)?wrap:wrap.querySelector(sel); } };
    var r=bomRead(box), pct=bomPct(r.scores||{});
    var el=wrap.querySelector("[data-bompct]");
    if(el){ el.textContent=(pct==null?"ej graderad":("Sannolikhet "+pct+" %")); el.className="p"+(pct==null?" na":""); }
    var m=wrap.querySelector("[data-bommsg]"); if(m) m.className="bom-msg";
  }
  // Lägger graderingen i en payload. Returnerar felsträng om ofullständig.
  function bomApply(box, payload){

  var chainCache={};   // dealId → hela /deal/:id-svaret (för steg-detalj-expandering)
  function pillMini(txt, cls){ return '<span class="pill p-'+esc(cls||"wait")+'" style="font-size:10px;padding:2px 7px"><span class="d"></span>'+esc(txt)+'</span>'; }
  function first(items){ return (items && items.length) ? items[0] : null; }
  function money0(n){ return n==null?"":Math.round(n).toLocaleString("sv-SE")+" kr"; }
  function stepSum(items){ if(!items||!items.length) return null; var s=0,has=false; for(var i=0;i<items.length;i++){ var a=items[i].amount; if(a!=null){ s+=a; has=true; } } return has?s:null; }
  function stepVal(count, sum){ if(!count) return '<span class="muted">—</span>'; var s=esc(count)+" st"; if(sum!=null) s+=" · "+esc(money0(sum)); return s; }
  function stepMeta(items){ var it=first(items); return it?pillMini(it.status,it.status_cls):""; }
  function chainStepItems(j, key){
    var c=j.chain, av=c.avtal||{count:0,items:[]};
    if(key==="offert") return c.offert.items||[];
    if(key==="avtal")  return av.items||[];
    if(key==="order")  return c.order.items||[];
    if(key==="faktura")return c.faktura.items||[];
    return [];
  }
  function renderChainHtml(j){
    var c=j.chain, D=j.deal, did=D.id;
    chainCache[did]=j;
    // avtal kan saknas om HTML deployas fore affar_api — guarda med ||-fallback (ej optional chaining)
    var av=c.avtal||{count:0,items:[]};
    var offSum=stepSum(c.offert.items), avSum=stepSum(av.items), ordSum=stepSum(c.order.items), invSum=stepSum(c.faktura.items);
    var stages=[
      { key:"lead", exp:false, has:!!c.lead, label:"Lead", val: c.lead?esc(c.lead.name||"Lead"):'<span class="muted">—</span>', meta: c.lead?esc(c.lead.date||""):"" },
      { key:"aktivitet", exp:false, has:c.aktivitet.count>0, label:"Aktivitet", val: c.aktivitet.count?(esc(c.aktivitet.count)+" st"):'<span class="muted">—</span>', meta: c.aktivitet.latest?esc(c.aktivitet.latest):"" },
      { key:"offert", exp:c.offert.count>0, has:c.offert.count>0, label:"Offert", val: stepVal(c.offert.count, offSum), meta: stepMeta(c.offert.items) },
      { key:"avtal", exp:av.count>0, has:av.count>0, label:"Avtal", val: stepVal(av.count, avSum), meta: stepMeta(av.items) },
      { key:"order", exp:c.order.count>0, has:c.order.count>0, label:"Order", val: stepVal(c.order.count, ordSum), meta: stepMeta(c.order.items) },
      { key:"faktura", exp:c.faktura.count>0, has:c.faktura.count>0, label:"Faktura", val: stepVal(c.faktura.count, invSum), meta: stepMeta(c.faktura.items) }
    ];
    var lastIdx=-1,i; for(i=0;i<stages.length;i++){ if(stages[i].has) lastIdx=i; }
    var steps=stages.map(function(s,idx){

  function loadList(){
    var t=LABEL2TYPE[STATE.type]||"";
    if(!t){ render(); return; }
    STATE.loading=true; render();
    var url=HOST+"/admin/affar/list?type="+encodeURIComponent(t)+"&page="+STATE.page+"&limit=30"+(STATE.q?("&q="+encodeURIComponent(STATE.q)):"")+(STATE.from?("&from="+encodeURIComponent(STATE.from)):"")+(STATE.to?("&to="+encodeURIComponent(STATE.to)):"")+(STATE.person?("&person="+encodeURIComponent(STATE.person)):"")+(STATE.kategori?("&kategori="+encodeURIComponent(STATE.kategori)):"");
    fetch(url,{headers:{"x-admin-token":TOKEN}})
      .then(function(r){ return r.json(); })
      .then(function(j){
        STATE.loading=false;
        if(!j||!j.ok){ STATE.listRows=[]; render(); $("rows").innerHTML=emptyRow("Kunde inte ladda ("+esc((j&&j.error)||"fel")+")."); return; }
        STATE.listRows=j.rows||[]; STATE.total=(j.total!=null?j.total:null); STATE.grand=(j.grand_total!=null?j.grand_total:null); STATE.filtered=!!j.filtered; STATE.hasMore=!!j.has_more;
        stampAffar();
        render();
      })
      .catch(function(){ STATE.loading=false; STATE.listRows=[]; render(); $("rows").innerHTML=emptyRow("Nätverksfel."); });
  }
  function loadUsers(){
    if(!CUC) return;
    fetch(HOST+"/admin/approval/users-by-company?clientcompany="+encodeURIComponent(CUC),{headers:{"x-admin-token":TOKEN}})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.ok){ USERS=j.items||[]; if(STATE.type==="Lead") render(); } })
      .catch(function(){});
  }

  // ── events ─────────────────────────────────────────────────────────
  var searchTimer=null;
  root.addEventListener("click",function(e){
    var t=e.target;
    if(t.closest && t.closest(".assign")) return;   // låt tilldela-selecten vara
    var dx=t.closest && t.closest(".dx"); if(dx){ var ch=dx.closest(".dchip"); if(ch&&ch.parentNode){ ch.parentNode.removeChild(ch); } return; }
    var si=t.closest && t.closest(".si"); if(si){ if(si.closest(".ck-sugg")){ pickDocForCard(si); } else { pickSugg(si); } return; }
    // ⚠️ Nästa steg-knapparna ligger INNE i redigeringsraden. Utan den här grenen
    // FÖRE rad-hanterarna bubblar klicket upp och kollapsar raden man redigerar
    // (samma fälla som deal-formuläret på kundkortet).
    // ⚠️ Stjärnorna ligger INNE i redigerings-/skaparformuläret. Utan den här
    // grenen före rad-hanterarna bubblar klicket upp och fäller ihop raden.
    var bst=t.closest && t.closest(".bom-star");
    if(bst){ bomSet(bst); return; }
    var nsb=t.closest && t.closest("[data-ns]");
    if(nsb){ var nsw=nsb.closest("[data-nswrap]"); if(nsw) nsSelect(nsw, nsb.getAttribute("data-ns")); return; }
    var sa=t.closest && t.closest(".af-a-save"); if(sa){ saveAkt(sa); return; }
    var sl=t.closest && t.closest(".af-l-save"); if(sl){ saveLead(sl); return; }
    var sd=t.closest && t.closest(".af-d-save"); if(sd){ saveDeal(sd); return; }
    var sk=t.closest && t.closest(".af-koppla-save"); if(sk){ saveKoppla(sk); return; }
    var cdt=t.closest && t.closest(".af-cd-toggle"); if(cdt){ var cf=cdt.parentNode.querySelector(".af-cd-form"); if(cf){ cf.style.display=(cf.style.display==="none"?"block":"none"); } return; }
    var cdsv=t.closest && t.closest(".af-cd-save"); if(cdsv){ saveCreateDeal(cdsv); return; }
    var ndsv=t.closest && t.closest(".af-nd-save"); if(ndsv){ saveNewDeal(ndsv); return; }
    var ckt=t.closest && t.closest(".ck-toggle"); if(ckt){ var b=ckt.parentNode.querySelector(".ck-body"); if(b){ b.style.display=(b.style.display==="none"?"block":"none"); } return; }
    var cks=t.closest && t.closest(".ck-save"); if(cks){ saveCardKoppla(cks); return; }
    var csx=t.closest && t.closest(".cstep-x"); if(csx){ toggleStepDetail(csx); return; }
    var cv=t.closest && t.closest(".af-conv"); if(cv){ doConvert(cv); return; }
    var ohp=t.closest && t.closest(".af-o-headpencil"); if(ohp){ toggleHeadEdit(ohp.closest(".af-ord"), true); return; }
    var ohc=t.closest && t.closest(".af-o-headcancel"); if(ohc){ toggleHeadEdit(ohc.closest(".af-ord"), false); return; }
    var ohs=t.closest && t.closest(".af-o-savehead"); if(ohs){ saveOrderHead(ohs); return; }
    var orp=t.closest && t.closest(".af-or-pencil"); if(orp){ toggleRowEdit(orp.closest(".af-o-row"), true); return; }
    var orc=t.closest && t.closest(".af-or-cancel"); if(orc){ toggleRowEdit(orc.closest(".af-o-row"), false); return; }
    var ors=t.closest && t.closest(".af-or-save"); if(ors){ saveOrderRow(ors); return; }
    var oad=t.closest && t.closest(".af-o-addrow"); if(oad){ addOrderRow(oad); return; }
    var odl=t.closest && t.closest(".af-or-del"); if(odl){ deleteOrderRow(odl); return; }
    var opo=t.closest && t.closest(".af-o-pdf-order"); if(opo){ orderPdf(opo,"order"); return; }
    var opm=t.closest && t.closest(".af-o-pdf-pm"); if(opm){ orderPdf(opm,"pm"); return; }
    var nas=t.closest && t.closest(".af-na-save"); if(nas){ saveNewAkt(nas); return; }
    var nts=t.closest && t.closest(".af-nt-save"); if(nts){ saveNewTodo(nts); return; }
    var nnb=t.closest && t.closest(".af-newbtn"); if(nnb){ openCreate(nnb.getAttribute("data-new")); return; }
    var cnw=t.closest && t.closest(".af-cardnew"); if(cnw){ openCardCreate(cnw); return; }
    if(t.closest && t.closest(".edit")) return;     // klick i redigeringsformuläret ska ej toggla raden
    var vb=t.closest && t.closest('.viewbtn[data-doc-id]');
    if(vb){
      var w=window.open("","_blank");   // förladda flik i klick-gesten (undviker popup-blockare)
      var dt=vb.getAttribute("data-doc-type"), did=vb.getAttribute("data-doc-id"), orig=vb.textContent;
      vb.textContent="…";
      fetch(HOST+"/admin/affar/doc-url?type="+encodeURIComponent(dt)+"&id="+encodeURIComponent(did),{headers:{"x-admin-token":TOKEN}})
        .then(function(r){ return r.json(); })
        .then(function(j){ vb.textContent=orig; if(j&&j.ok&&j.url){ if(w){ w.location.href=j.url; } } else { if(w){ w.close(); } alert("Kunde inte hämta PDF: "+((j&&j.error)||"okänt fel")+((j&&j.detail)?(" ("+(j.detail.status||JSON.stringify(j.detail))+")"):"")); } })
        .catch(function(){ vb.textContent=orig; if(w){ w.close(); } alert("Nätverksfel vid PDF-hämtning."); });
      return;
    }
    var rf=t.closest && t.closest('[data-af="refresh"]'); if(rf){ loadFeed(); if(STATE.type) loadList(); return; }
    var wp=t.closest && t.closest('[data-af="weekpreset"]'); if(wp){ var wr=weekRange(); STATE.from=wr.from; STATE.to=wr.to; STATE.page=0; var ff=$("from"); if(ff) ff.value=wr.from; var tf=$("to"); if(tf) tf.value=wr.to; if(STATE.type) loadList(); return; }
    var dc=t.closest && t.closest('[data-af="datclear"]'); if(dc){ STATE.from=""; STATE.to=""; STATE.person=""; STATE.kategori=""; STATE.page=0; var pe=$("person"); if(pe) pe.value=""; var ke=$("kategori"); if(ke) ke.value=""; if(STATE.type) loadList(); return; }
    var pnav=t.closest('[data-af="prev"],[data-af="next"]');
    if(pnav){ var isNext=(pnav.getAttribute("data-af")==="next"); if(isNext&&STATE.hasMore){ STATE.page++; loadList(); } else if(!isNext&&STATE.page>0){ STATE.page--; loadList(); } return; }
    var step=t.closest("[data-step]");
    if(step){ var slbl=step.getAttribute("data-step"); STATE.type=(STATE.type===slbl)?"":slbl; STATE.page=0; setChips("typechips","data-t",STATE.type); if(STATE.type) loadList(); else render(); return; }
    var tc=t.closest('[data-af="typechips"] .chip'); if(tc){ STATE.type=tc.getAttribute("data-t")||""; STATE.page=0; setChips("typechips","data-t",STATE.type); if(STATE.type) loadList(); else render(); return; }
    var sc=t.closest('[data-af="srcchips"] .chip'); if(sc){ STATE.src=sc.getAttribute("data-s")||""; setChips("srcchips","data-s",STATE.src); render(); return; }
    var ar=t.closest("tr.affar"); if(ar){ toggleDeal(ar); return; }
    var orr=t.closest("tr.orderrow"); if(orr){ toggleOrder(orr); return; }
    var wr=t.closest("tr.worow"); if(wr){ toggleWo(wr); return; }
    var kr=t.closest("tr.kopplarow"); if(kr && !(t.closest && t.closest(".viewbtn"))){ toggleKoppla(kr); return; }
    var lr=t.closest("tr.lead"); if(lr){ toggleEdit(lr,"lead"); return; }
    var akr=t.closest("tr.akt"); if(akr){ toggleEdit(akr,"akt"); return; }
  });
  root.addEventListener("input",function(e){
    if(e.target.classList && e.target.classList.contains("af-co-search")){ searchCompanies(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-td-search")){ searchTodos(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-d-co-search")){ searchDealCompanies(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-d-kp-search")){ searchDealCoworkers(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-d-td-search")){ searchDealTodos(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-deal-search")){ searchDeals(e.target); return; }
    if(e.target.classList && e.target.classList.contains("ck-search")){ searchDocForCard(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-cd-co-search")){ fieldSearchCompanies(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-nd-co-search")){ fieldSearchCompanies(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-na-co-search")){ fieldSearchCompanies(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-na-deal-search")){ fieldSearchDeals(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-nt-co-search")){ fieldSearchCompanies(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-nt-cw-search")){ fieldSearchCoworkers(e.target); return; }
    if(e.target.classList && e.target.classList.contains("af-nt-deal-search")){ fieldSearchDeals(e.target); return; }
    if(e.target.getAttribute("data-af")!=="search") return;
    STATE.q=e.target.value.trim();
    if(searchTimer){ clearTimeout(searchTimer); }
    if(STATE.type){ searchTimer=setTimeout(function(){ STATE.page=0; loadList(); },350); }
    else { render(); }
  });
  root.addEventListener("change",function(e){
    var sel=e.target;
    if(sel.getAttribute && sel.getAttribute("data-af")==="from"){ STATE.from=sel.value; STATE.page=0; if(STATE.type) loadList(); return; }
    if(sel.getAttribute && sel.getAttribute("data-af")==="to"){ STATE.to=sel.value; STATE.page=0; if(STATE.type) loadList(); return; }
    if(sel.getAttribute && sel.getAttribute("data-af")==="person"){ STATE.person=sel.value; STATE.page=0; if(STATE.type) loadList(); return; }
    if(sel.getAttribute && sel.getAttribute("data-af")==="kategori"){ STATE.kategori=sel.value; STATE.page=0; if(STATE.type) loadList(); return; }
    if(sel.classList && sel.classList.contains("af-a-type")){ toggleAktCond(sel); return; }
    if(sel.classList && sel.classList.contains("af-a-done")){ toggleNote(sel); return; }
    if(sel.classList && sel.classList.contains("af-na-type")){ toggleNaCond(sel); return; }
    if(sel.classList && sel.classList.contains("af-na-done")){ toggleNaNote(sel); return; }
    if(sel.classList && sel.classList.contains("ck-type")){ var ckb=sel.closest(".card-koppla"); if(ckb){ ckb.querySelector(".ck-id").value=""; ckb.querySelector(".ck-src").value=""; ckb.querySelector(".ck-cur").textContent="Inget valt"; ckb.querySelector(".ck-save").disabled=true; ckb.querySelector(".ck-msg").textContent=""; var sg=ckb.querySelector(".ck-sugg"); if(sg){ sg.classList.remove("on"); sg.innerHTML=""; } } return; }
    if(!sel.classList || !sel.classList.contains("assign")) return;
    var leadId=sel.getAttribute("data-lead-id"), uid=sel.value;
    sel.disabled=true;
    fetch(HOST+"/admin/affar/lead/"+encodeURIComponent(leadId)+"/assign",{
      method:"POST", headers:{"x-admin-token":TOKEN,"Content-Type":"application/json"}, body:JSON.stringify({user_id:uid})
    }).then(function(r){ return r.json(); })
      .then(function(j){
        sel.disabled=false;
        if(!j||!j.ok){ alert("Tilldelning misslyckades."); return; }
        for(var i=0;i<STATE.listRows.length;i++){ if(STATE.listRows[i].id===leadId){ STATE.listRows[i].tilldelad=j.tilldelad; break; } }
      })
      .catch(function(){ sel.disabled=false; alert("Nätverksfel vid tilldelning."); });
  });

  if(!HOST||!TOKEN){ setHead(DOC_HEADS); $("rows").innerHTML=emptyRow("Saknar api_host/planning_token."); return; }
  loadUsers();
  loadFeed();
})();
</script>
