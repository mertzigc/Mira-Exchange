<!--
  mira-visitor.html — receptionistens besöksvy. Klistras in på Bubble-sidan `visitor`.

  ⚠️ BÄR ALDRIG PLANNING_ADMIN_TOKEN. All åtkomst går via x-visitor-token, som Bubble
  skriver till Current User's visitor_token (backend-wf `visitor_session`). Tokenen bär
  receptionistens fastighets-scope — backend filtrerar mot den, blocket bestämmer inget.
  Se handoff/BESOKSHANTERING.md §7.5.

  ⚠️ Sessionen är ASYNKRON: `Schedule API Workflow` hinner inte klart innan sidan renderar,
  så blocket startar utan token och väntar in den. Det är inte ett fel.

  Backend: /visitor/context · /visitor/hosts · /visitor/visits (GET+POST)
           /visitor/visits/:id/notify · /visitor/visits/:id/checkout
  data-mira: api_host + visitor_token. Konventioner: INGEN ?./??, IIFE, BROOT-claim.
-->
<style>
  .vi, .vi *{box-sizing:border-box;margin:0;padding:0}
  .vi{
    --base:#1e2235;--panel:#23283f;--card:#262b42;--deep:#2c314e;--input:#2e3350;
    --orange:#F47B30;--orange-dim:rgba(244,123,48,.13);
    --white:#fff;--w70:rgba(255,255,255,.70);--w40:rgba(255,255,255,.40);--w10:rgba(255,255,255,.07);
    --green:#4CAF7D;--red:#E05A5A;--border:rgba(255,255,255,.07);
    --fb:Arial,sans-serif;background:var(--base);color:var(--white);font-family:var(--fb);
    font-size:14px;line-height:1.5;display:block;padding:20px 22px 34px;border-radius:14px}
  .vi input[type=hidden]{display:none}
  .vi h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .vi h1 span{color:var(--orange)}
  .vi .sub{color:var(--w40);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:3px 0 16px}
  .vi .bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .vi .search{flex:1;min-width:190px;background:var(--input);border:1px solid var(--border);border-radius:9px;
    padding:10px 13px;color:var(--white);font-family:var(--fb);font-size:14px}
  .vi .search:focus{outline:none;border-color:var(--orange)}
  .vi .search::placeholder{color:var(--w40)}
  .vi .sel{background:var(--input);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    color:var(--white);font-family:var(--fb);font-size:13px}
  .vi .sel:focus{outline:none;border-color:var(--orange)}
  .vi .muted{color:var(--w40)}
  /* ⚠️ !important på hover — Bubble-sidor har en global button:hover med !important som
     annars gör knappen helorange med osynlig text. Se [[reference-bubble-button-hover-important]]. */
  .vi .btn{background:var(--input);border:1px solid var(--border);border-radius:9px;padding:9px 14px;
    font-size:13px;font-weight:700;color:var(--w70);cursor:pointer;font-family:var(--fb)}
  .vi .btn:hover,.vi .btn:focus{background:var(--input)!important;border-color:var(--orange);color:var(--orange)!important;outline:none}
  .vi .btn:disabled,.vi .btn:disabled:hover{opacity:.5;cursor:default;background:var(--input)!important;color:var(--w70)!important}
  .vi .btn.sm{padding:6px 11px;font-size:12px}
  .vi .ebtn{background:var(--orange);border:none;border-radius:9px;padding:11px 22px;color:#1c1206;
    font-weight:800;font-size:14px;cursor:pointer;font-family:var(--fb)}
  .vi .ebtn:hover,.vi .ebtn:focus{background:var(--orange)!important;color:#1c1206!important;filter:brightness(1.07);outline:none}
  .vi .ebtn:disabled{opacity:.5;cursor:default}
  .vi .tablewrap{width:100%;overflow-x:auto}
  .vi table{width:100%;border-collapse:collapse;min-width:780px}
  .vi th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--w40);
    padding:9px 11px;border-bottom:1.5px solid var(--w10);white-space:nowrap;font-weight:700}
  .vi td{padding:12px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
  .vi tr:last-child td{border-bottom:none}
  .vi tr:hover td{background:var(--card)}
  .vi .tnum{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  .vi .gname{font-weight:700}
  .vi .s{display:block;font-size:11.5px;color:var(--w40);margin-top:2px}
  .vi .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;
    padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
  .vi .pill i{width:6px;height:6px;border-radius:50%;display:block}
  .vi .p-ok{background:rgba(76,175,125,.13);color:var(--green)}   .vi .p-ok i{background:var(--green)}
  .vi .p-wait{background:var(--orange-dim);color:var(--orange)}   .vi .p-wait i{background:var(--orange)}
  .vi .p-err{background:rgba(224,90,90,.13);color:var(--red)}     .vi .p-err i{background:var(--red)}
  .vi .p-off{background:var(--w10);color:var(--w70)}
  .vi .chip{display:inline-block;font-size:11px;color:var(--w70);background:var(--w10);border-radius:6px;
    padding:3px 9px;white-space:nowrap}
  .vi .acts{text-align:right;white-space:nowrap}
  .vi .msg{padding:26px;text-align:center;color:var(--w40)}
  .vi .empty{padding:34px 20px;text-align:center;color:var(--w40)}
  .vi .empty b{display:block;color:var(--white);font-size:15px;margin-bottom:4px}
  .vi .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .vi .panel h3{font-size:15px;font-weight:700;margin-bottom:12px}
  .vi .row{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:12px}
  .vi .row>div{flex:1;min-width:170px}
  .vi .el{display:block;font-size:9.5px;color:var(--w40);margin-bottom:5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em}
  .vi .ein{width:100%;background:var(--input);border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;color:var(--white);font-family:var(--fb);font-size:14px}
  .vi .ein:focus{outline:none;border-color:var(--orange)}
  .vi .eact{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:13px}
  .vi .emsg{font-size:12px;color:var(--w40)}
  .vi .emsg.err{color:#ff8080}
  .vi .kmsg{font-size:11px;color:var(--w40);margin-left:7px}
  .vi .kmsg.err{color:#ff8080}
  .vi .hostline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}
  @media(max-width:720px){ .vi .row>div{min-width:100%} }
</style>

<div class="vi">
  <input type="hidden" data-mira="api_host"      value="https://mira-exchange.onrender.com">

  <!-- ▼▼▼ HÄR SKA TOKEN IN DYNAMISKT ▼▼▼
       Ersätt det TOMMA value-attributet nedan med Bubbles "Insert dynamic data"
       → Current User's visitor_token
       Rätt gjort blir det en blå platshållare i editorn, inte texten du ser här.
       ⚠️ Utan bindningen ser blocket ingen session och väntar för evigt — även om
          användaren HAR en giltig token i databasen. -->
  <input type="hidden" data-mira="visitor_token" value="">
  <!-- ▲▲▲ HÄR SKA TOKEN IN DYNAMISKT ▲▲▲ -->
  <div data-vi="root"><div class="msg">Startar session…</div></div>
</div>

<script>
(function(){
  "use strict";
  var all=document.querySelectorAll(".vi"),root=null;
  for(var i=0;i<all.length;i++){ if(!all[i].getAttribute("data-vi-claimed")){ root=all[i]; break; } }
  if(!root) return; root.setAttribute("data-vi-claimed","1");
  var $=function(k){ return root.querySelector('[data-vi="'+k+'"]'); };
  var cfgEl=function(k){ return root.querySelector('[data-mira="'+k+'"]'); };
  var cfg=function(k){ var el=cfgEl(k); return (el&&el.value)||""; };
  var HOST=cfg("api_host").replace(/\/+$/,"");
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function TOK(){ return cfg("visitor_token"); }
  function api(path){ return fetch(HOST+path,{headers:{"x-visitor-token":TOK()}}).then(function(r){ return r.json(); }); }
  function post(path, body){
    return fetch(HOST+path,{method:"POST",headers:{"x-visitor-token":TOK(),"Content-Type":"application/json"},
      body:JSON.stringify(body||{})}).then(function(r){ return r.json(); });
  }
  function klocka(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d.getTime())) return "—";
    return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }

  // ⚠️ formHus är SKILT från fastighet (listfiltret). Står listan på "alla mina hus"
  // måste formuläret ändå peka på ETT hus — annars visas hyresgäster från fel hus och
  // backend avvisar kombinationen med tenant_not_in_fastighet.
  var STATE={ ready:false, ctx:null, fastighet:"", rows:[], loading:false, q:"",
              form:false, formHus:"", formHyresgast:"", hosts:[], hostsFor:"", busy:{} };
  var _deb=null;

  // ── Sessionen: vänta in token ───────────────────────────────────────────
  // Bubble skriver visitor_token asynkront (backend-wf). Fältet uppdateras reaktivt,
  // så vi pollar tills det dyker upp i stället för att felaktigt visa "utloggad".
  var waited=0;
  function waitForToken(){
    if(TOK()){ console.log("[visitor] session hittad, startar"); STATE.ready=true; boot(); return; }
    waited+=400;
    if(waited>25000){
      // Vanligaste orsaken är INTE roll/fastighet utan att value-attributet aldrig
      // bands till Current User's visitor_token — blocket läser bara attributet.
      console.error("[visitor] ingen token efter 25 s. Fältet data-mira=\"visitor_token\" var:",
        JSON.stringify(TOK()), "· är det bundet till Current User's visitor_token?");
      $("root").innerHTML='<div class="empty"><b>Sessionen nådde inte fram</b>'+
        'Kontrollera i tur och ordning:<br>1. att fältet <b style="display:inline">visitor_token</b> i HTML-blocket är kopplat till <b style="display:inline">Current User\'s visitor_token</b><br>'+
        '2. att du har rollen Receptionist med minst en fastighet<br><br>'+
        '<span style="font-size:12px">Detaljer finns i webbläsarens konsol.</span></div>';
      return;
    }
    setTimeout(waitForToken, 400);
  }

  function boot(){
    api("/visitor/context").then(function(j){
      if(!j||!j.ok){
        $("root").innerHTML='<div class="empty"><b>Kunde inte hämta dina hus</b>'+esc((j&&j.error)||"okänt fel")+'</div>';
        return;
      }
      STATE.ctx=j; load();
    }).catch(function(){ $("root").innerHTML='<div class="empty"><b>Nätverksfel</b>Kunde inte nå Mira.</div>'; });
  }

  // ── Vy ──────────────────────────────────────────────────────────────────
  function husOpts(){
    var h='<option value="">Alla mina hus</option>', f=STATE.ctx.fastigheter||[];
    for(var i=0;i<f.length;i++) h+='<option value="'+esc(f[i].id)+'"'+(f[i].id===STATE.fastighet?" selected":"")+'>'+esc(f[i].name)+'</option>';
    return h;
  }
  function statusPill(r){
    if(r.status==="skickad") return '<span class="pill p-ok"><i></i>'+esc(r.kanal==="sms"?"SMS levererat":"Mail skickat")+'</span>';
    if(r.status==="fel")     return '<span class="pill p-err"><i></i>Nådde inte värden</span>';
    return '<span class="pill p-wait"><i></i>Ej notifierad</span>';
  }
  function rowActions(r){
    if(STATE.busy[r.id]) return '<span class="kmsg">Arbetar…</span>';
    var h="";
    if(r.status!=="skickad") h+='<button class="btn sm" data-vi="notify" data-id="'+esc(r.id)+'">Notifiera</button> ';
    else h+='<button class="btn sm" data-vi="notify" data-id="'+esc(r.id)+'" data-force="1">Notifiera igen</button> ';
    if(r.open) h+='<button class="btn sm" data-vi="checkout" data-id="'+esc(r.id)+'">Checka ut</button>';
    return h+'<span class="kmsg" data-kmsg="'+esc(r.id)+'"></span>';
  }
  function table(){
    if(!STATE.rows.length) return '<div class="empty"><b>Inga besök i dag</b>Registrera ett besök när första gästen kommer.</div>';
    var b="";
    for(var i=0;i<STATE.rows.length;i++){ var r=STATE.rows[i];
      b+='<tr><td class="tnum">'+klocka(r.in)+
          '<span class="s">'+(r.via==="lobby"?"lobbyskärm":"reception")+(r.ut?" · ut "+klocka(r.ut):"")+'</span></td>'+
        '<td><span class="gname">'+esc(r.gast||"—")+'</span>'+(r.gast_bolag?'<span class="s">'+esc(r.gast_bolag)+'</span>':"")+'</td>'+
        '<td><span class="chip">'+esc(r.hyresgast||"—")+'</span></td>'+
        '<td>'+esc(r.vard||"—")+'</td>'+
        '<td>'+statusPill(r)+(r.notis_fel?'<span class="s">'+esc(r.notis_fel)+'</span>':"")+'</td>'+
        '<td>'+(r.open?'<span class="pill p-wait"><i></i>Inne</span>':'<span class="pill p-off">Utcheckad</span>')+'</td>'+
        '<td class="acts">'+rowActions(r)+'</td></tr>';
    }
    return '<div class="tablewrap"><table><thead><tr>'+
      '<th>Tid</th><th>Besökare</th><th>Hyresgäst</th><th>Värd</th><th>Notis</th><th>Status</th><th></th>'+
      '</tr></thead><tbody>'+b+'</tbody></table></div>';
  }
  function hyresgastOpts(){
    var h='<option value="">Välj hyresgäst…</option>', c=(STATE.ctx&&STATE.ctx.hyresgaster)||[];
    // Bara hyresgäster i det valda huset — backend avvisar annars med tenant_not_in_fastighet.
    for(var i=0;i<c.length;i++){ if(STATE.formHus && c[i].fastighet!==STATE.formHus) continue;
      h+='<option value="'+esc(c[i].id)+'" data-f="'+esc(c[i].fastighet)+'"'+(c[i].id===STATE.formHyresgast?" selected":"")+'>'+esc(c[i].name)+'</option>'; }
    return h;
  }
  function hostOpts(){
    var h='<option value="">Välj värd…</option>';
    for(var i=0;i<STATE.hosts.length;i++){ var v=STATE.hosts[i];
      var kanal=v.has_sms?"SMS":(v.has_mail?"endast mail":"ingen kontaktväg");
      h+='<option value="'+esc(v.id)+'" data-n="'+esc(v.name)+'">'+esc(v.name)+(v.title?" · "+esc(v.title):"")+" — "+kanal+'</option>'; }
    return h;
  }
  function formHtml(){
    if(!STATE.form) return "";
    var husSel='<div><label class="el">Hus</label><select class="ein" data-nv="fastighet">'+
      (function(){ var o="", L=STATE.ctx.fastigheter||[];
        for(var i=0;i<L.length;i++) o+='<option value="'+esc(L[i].id)+'"'+(L[i].id===STATE.formHus?" selected":"")+'>'+esc(L[i].name)+'</option>';
        return o; })()+'</select></div>';
    return '<div class="panel"><h3>Registrera besök</h3>'+
      '<div class="row">'+husSel+
        '<div><label class="el">Hyresgäst</label><select class="ein" data-nv="hyresgast">'+hyresgastOpts()+'</select></div>'+
      '</div>'+
      '<div class="row">'+
        '<div><label class="el">Värd</label><select class="ein" data-nv="vard"'+(STATE.hosts.length?"":" disabled")+'>'+
          (STATE.hosts.length?hostOpts():'<option>Välj hyresgäst först</option>')+'</select>'+
          '<div class="hostline" data-vi="hostinfo"></div></div>'+
      '</div>'+
      '<div class="row">'+
        '<div><label class="el">Besökarens namn</label><input class="ein" type="text" data-nv="gast" placeholder="För- och efternamn"></div>'+
        '<div><label class="el">Besökarens bolag <span style="text-transform:none;letter-spacing:0">(valfritt)</span></label>'+
          '<input class="ein" type="text" data-nv="gast_bolag"></div>'+
      '</div>'+
      '<div class="eact"><button class="ebtn" data-vi="save">Checka in och notifiera</button>'+
        '<button class="btn" data-vi="cancel">Avbryt</button>'+
        '<span class="emsg" data-nv-msg></span></div></div>';
  }
  function render(){
    if(!STATE.ctx) return;
    var namn=(STATE.ctx.user&&STATE.ctx.user.name)||"";
    var inne=0; for(var i=0;i<STATE.rows.length;i++) if(STATE.rows[i].open) inne++;
    var head='<h1>Dagens besök <span>·</span> '+(STATE.fastighet?esc(husNamn(STATE.fastighet)):"mina hus")+'</h1>'+
      '<div class="sub">'+(STATE.loading?"laddar…":(STATE.rows.length+" besök · "+inne+" inne"))+(namn?" · "+esc(namn):"")+'</div>';
    var bar='<div class="bar">'+
      '<button class="ebtn" data-vi="new">＋ Registrera besök</button>'+
      '<input class="search" type="text" data-vi="q" placeholder="Sök besökare, bolag eller värd…" value="'+esc(STATE.q)+'">'+
      '<select class="sel" data-vi="hus">'+husOpts()+'</select>'+
      '<button class="btn" data-vi="reload">Uppdatera</button></div>';
    $("root").innerHTML=head+bar+formHtml()+(STATE.loading?'<div class="msg">Laddar…</div>':table());
  }
  function husNamn(id){ var f=(STATE.ctx&&STATE.ctx.fastigheter)||[];
    for(var i=0;i<f.length;i++) if(f[i].id===id) return f[i].name; return ""; }

  // ── Data ────────────────────────────────────────────────────────────────
  function load(){
    STATE.loading=true; render();
    var p=[]; if(STATE.fastighet) p.push("fastighet="+encodeURIComponent(STATE.fastighet));
    if(STATE.q) p.push("q="+encodeURIComponent(STATE.q));
    api("/visitor/visits"+(p.length?("?"+p.join("&")):"")).then(function(j){
      STATE.loading=false;
      STATE.rows=(j&&j.ok&&j.rows)?j.rows:[];
      render();
    }).catch(function(){ STATE.loading=false; STATE.rows=[]; render(); });
  }
  // ⚠️ Uppdaterar BARA värd-selecten. En render() här hade byggt om formuläret från
  // STATE och raderat gästnamnet receptionisten just skrivit — samma fälla som
  // deal-formuläret och autocompleten i personlistan.
  function paintHosts(){
    var sel=root.querySelector('[data-nv="vard"]'); if(!sel) return;
    sel.innerHTML=STATE.hosts.length?hostOpts():'<option>Välj hyresgäst först</option>';
    sel.disabled=!STATE.hosts.length;
    var info=root.querySelector('[data-vi="hostinfo"]'); if(info) info.innerHTML="";
  }
  function loadHosts(companyId){
    STATE.formHyresgast=companyId||"";
    if(!companyId){ STATE.hosts=[]; STATE.hostsFor=""; paintHosts(); return; }
    if(STATE.hostsFor===companyId) return;
    STATE.hostsFor=companyId;
    api("/visitor/hosts?hyresgast="+encodeURIComponent(companyId)).then(function(j){
      STATE.hosts=(j&&j.ok&&j.hosts)?j.hosts:[];
      paintHosts();
    }).catch(function(){ STATE.hosts=[]; paintHosts(); });
  }
  function save(){
    var panel=root.querySelector(".panel"); if(!panel) return;
    var g=function(k){ var el=panel.querySelector('[data-nv="'+k+'"]'); return el?el.value.trim():""; };
    var msg=root.querySelector("[data-nv-msg]");
    var fastighet=g("fastighet"), hyresgast=g("hyresgast"), gast=g("gast");
    if(!fastighet){ if(msg){ msg.textContent="Välj hus"; msg.className="emsg err"; } return; }
    if(!hyresgast){ if(msg){ msg.textContent="Välj hyresgäst"; msg.className="emsg err"; } return; }
    if(!gast){ if(msg){ msg.textContent="Fyll i besökarens namn"; msg.className="emsg err"; } return; }
    var vardSel=panel.querySelector('[data-nv="vard"]');
    var vard=vardSel?vardSel.value:"";
    var vardNamn="";
    if(vardSel&&vardSel.selectedIndex>0){ var o=vardSel.options[vardSel.selectedIndex]; vardNamn=o.getAttribute("data-n")||""; }
    if(msg){ msg.textContent="Checkar in…"; msg.className="emsg"; }
    post("/visitor/visits",{fastighet:fastighet,hyresgast:hyresgast,gast:gast,gast_bolag:g("gast_bolag"),vard:vard,vard_namn:vardNamn})
      .then(function(j){
        if(!j||!j.ok){ if(msg){ msg.textContent="✗ "+((j&&j.error)||"fel"); msg.className="emsg err"; } return; }
        // Notisen är ett EGET anrop — besöket är redan loggat även om den fallerar.
        return post("/visitor/visits/"+encodeURIComponent(j.id)+"/notify").then(function(){
          STATE.form=false; STATE.hosts=[]; STATE.hostsFor=""; STATE.formHyresgast=""; load();
        });
      }).catch(function(){ if(msg){ msg.textContent="✗ nätverksfel"; msg.className="emsg err"; } });
  }
  function notify(id, force){
    STATE.busy[id]=true; render();
    post("/visitor/visits/"+encodeURIComponent(id)+"/notify", force?{force:true}:{}).then(function(j){
      STATE.busy[id]=false;
      // ok:false med status "fel" är INTE ett tekniskt fel — besöket är loggat,
      // notisen gick bara inte fram. Listan visar orsaken.
      load();
      if(j&&j.ok===false&&j.status!=="fel"){
        var m=root.querySelector('[data-kmsg="'+id+'"]'); if(m){ m.textContent="✗ "+esc(j.error||"fel"); m.className="kmsg err"; }
      }
    }).catch(function(){ STATE.busy[id]=false; render(); });
  }
  function checkout(id){
    STATE.busy[id]=true; render();
    post("/visitor/visits/"+encodeURIComponent(id)+"/checkout").then(function(){ STATE.busy[id]=false; load(); })
      .catch(function(){ STATE.busy[id]=false; render(); });
  }

  // ── Händelser ───────────────────────────────────────────────────────────
  root.addEventListener("click", function(e){
    var t=e.target;
    if(t.closest && t.closest('[data-vi="new"]')){
      STATE.form=!STATE.form;
      if(STATE.form){
        var L=(STATE.ctx&&STATE.ctx.fastigheter)||[];
        STATE.formHus=STATE.fastighet||(L.length?L[0].id:"");
        STATE.hosts=[]; STATE.hostsFor=""; STATE.formHyresgast="";
      }
      render(); return;
    }
    if(t.closest && t.closest('[data-vi="cancel"]')){ STATE.form=false; STATE.hosts=[]; STATE.hostsFor=""; STATE.formHyresgast=""; render(); return; }
    if(t.closest && t.closest('[data-vi="save"]')){ save(); return; }
    if(t.closest && t.closest('[data-vi="reload"]')){ load(); return; }
    var n=t.closest?t.closest('[data-vi="notify"]'):null;
    if(n){ notify(n.getAttribute("data-id"), n.getAttribute("data-force")==="1"); return; }
    var c=t.closest?t.closest('[data-vi="checkout"]'):null;
    if(c){ checkout(c.getAttribute("data-id")); return; }
  });
  root.addEventListener("change", function(e){
    var t=e.target, k=t.getAttribute?t.getAttribute("data-vi"):null, nv=t.getAttribute?t.getAttribute("data-nv"):null;
    if(k==="hus"){ STATE.fastighet=t.value; load(); return; }
    if(nv==="hyresgast"){ loadHosts(t.value); return; }
    if(nv==="fastighet"){ STATE.formHus=t.value; STATE.hosts=[]; STATE.hostsFor=""; STATE.formHyresgast=""; render(); return; }
    if(nv==="vard"){
      var info=root.querySelector('[data-vi="hostinfo"]'); if(!info) return;
      var h=null; for(var i=0;i<STATE.hosts.length;i++) if(STATE.hosts[i].id===t.value) h=STATE.hosts[i];
      // Visa kanalen INNAN incheckning — receptionisten ska veta om värden går att nå.
      if(!h){ info.innerHTML=""; return; }
      if(h.has_sms) info.innerHTML='<span class="pill p-ok"><i></i>Notifieras via SMS</span>';
      else if(h.has_mail) info.innerHTML='<span class="pill p-wait"><i></i>Endast mail — kan dröja</span>';
      else info.innerHTML='<span class="pill p-err"><i></i>Saknar kontaktväg</span>';
      return;
    }
  });
  root.addEventListener("input", function(e){
    var t=e.target;
    if(t.getAttribute&&t.getAttribute("data-vi")==="q"){
      STATE.q=t.value; if(_deb) clearTimeout(_deb); _deb=setTimeout(load, 350);
    }
  });

  waitForToken();
})();
</script>
